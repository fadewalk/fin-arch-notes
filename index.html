 Y5 --> YA[节点A]\n        Y5 --> YE[节点E]\n        Y6[城市3] --> Y7[\"数据中心3\"]\n        Y7 --> YC[节点C]\n        Y8[\"任一城市故障仍剩3节点-多数派可用\"]\n        Y8 -.- Y1\n    end\n```", "compare": "| 部署方案 | 备份数 | 分布 | 可扛故障 | 容灾级别 |\n| --- | --- | --- | --- | --- |\n| 2+1 双机房 | 3 | 两机房 | 单节点 | 单节点级 |\n| 两地三中心 | 3 | 两城三机房 | 单数据中心 | 机房级 |\n| 三地五中心 | 5 | 三城五机房 | 城市级故障 | 城市级 |\n\n| 维度 | 推（心跳） | 拉（定期取） |\n| --- | --- | --- |\n| 实时性 | 强 | 较弱 |\n| 资源要求 | 峰值能力高 | 基本固定 |\n| 适用 | 高 SLA 业务 | 按业务 SLA 折中 |", "pitfalls": "- 3 备份放在 2 个机房不等于机房容灾：多数派要求 2 节点在线，机房 1 挂掉后算法直接不可用。\n- fsync 成功 ≠ 数据落盘：数据可能只在硬件控制器缓存里，断电照样丢。\n- 监控平台不必套用业务系统容灾架构，因为监控数据可以部分丢失——不要为小概率数据中心级灾难付出高成本。\n- 服务器端正确不等于整体正确：客户端找新主的行为直接影响恢复速度。", "quiz": "- 正确容灾的两个维度是什么？哪个风险更不可控？（SLA 与事务原子性；事务正确性出问题风险不可控）\n- 两地三中心与三地五中心分别能扛什么级别的故障？（机房级故障 / 城市级故障）\n- 为什么监控数据本地异步备份就够？（监控数据时效衰减快、允许部分丢失，高成本容灾不划算）\n- 单机断电丢数据的两个处理方向？（企业级带电池硬盘保落盘；或把断电当单节点故障处理，如 Kafka）"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 21, "title": "21丨容灾（下）：如何通过混沌工程提高系统稳定性？", "isQA": false, "summary": "分布式系统无法从理论或实践上证明\"一定不出错\"，正确性本质是对系统不出大问题的置信度；混沌工程通过主动制造故障的统计实验提高发现问题的概率，从而提升对系统的信心。", "mindmap": "- 混沌工程\n  - 正确性新思路\n    - 形式化证明限有限\n    - 证有不证无\n    - 正确性是置信区间\n  - 系统定义\n    - 组成超三个易混沌\n    - 行为非线性不可预测\n    - 含软硬件与运维人员\n  - 实验定义\n    - 自变量可控扰动\n    - 因变量受影响对象\n    - 用假设不用断言\n    - 区别于测试\n  - 自变量分层\n    - 硬件层\n    - 操作系统层\n    - 虚拟机层\n    - 系统API与应用层\n  - 因变量与SRE\n    - SLA包含SLO与SLI\n    - SLI是监控对象\n    - SLO是目标值\n  - 实验过程\n    - 先补齐SLI监控\n    - 环境逐级升级\n    - 控制伤害半径\n  - Jepsen测试\n    - 专验分布式正确性", "concepts": "- **证有不证无**：逻辑上只能证明问题存在（找到一只黑天鹅即可），无法穷举证明问题不存在；因此放弃证明\"没有 bug\"，改为证明\"能找到 bug\"。\n- **置信区间**：正确性是概率概念——找 bug 成本超过收益时停止投入，此时\"系统不太会出大问题\"是统计意义上的信心，而非绝对保证。\n- **混沌系统**：组成部分超过 3 个后行为趋向非线性（不可预测）；混沌工程的对象就是这类系统，且\"系统\"不只软件，还包括硬件、运维系统、监控系统与开发/运维/值班人员。\n- **自变量/因变量/假设**：自变量是可控制的扰动（如拔掉硬盘），因变量是被自变量影响的对象（如告警、高可用），假设描述两者的影响关系。\n- **伤害半径（Blast Radius）**：实验故障的影响范围，要控制得尽量小；实验从测试环境逐级升级到生产灰度。\n- **Jepsen 测试**：面向分布式系统正确性的混沌测试，实验后收集各节点数据验证结果正确性；与混沌工程几乎一样，只是 SLO 定义在正确性（目标 100%）上。", "points": "1. 形式化证明只能覆盖有限状态；Raft 涉及无限种可能，无法形式化证明正确；实现不可能比理论更正确，所以理论与实践都证不了\"无错\"。\n2. 测试 vs 混沌实验：测试已知正确答案、目标是肯定正确性；混沌实验结果未知、目标是更好地理解系统，用假设而非断言。\n3. 系统是由相互作用、相互依赖的组成部分构成的整体，本身又是更大系统的一部分；组成超过 3 个就很可能进入混沌状态。\n4. 自变量按软件层次找：硬件（CPU/硬盘/网卡…）→操作系统（虚拟内存/文件系统/Socket/进程线程）→虚拟机（VMWare/Docker）→系统 API→应用程序（解释型语言还有运行时）。\n5. 分层思维可迁移到新场景：云计算下从刀片、机柜、单数据中心到城市容灾集群逐层划分扰动对象。\n6. 每个自变量定义自己的操作类型（硬盘慢/坏、断网/掉帧），定义越准确实验设计越精细。\n7. SRE 负责定义与实现服务质量体系；SLA 包含 SLO 与 SLI——SLI 是监控对象（吞吐量、延时、性能），SLO 是指标目标（如高可用 5 个 9）。实验中 SLI 即因变量，SLO 即假设。\n8. 实验前必须补齐覆盖所有 SLI 的监控：软件不可见，只能靠指标间接了解它的行为。\n9. 实验逐级升级：测试环境→回归环境→预生产环境→生产环境灰度小规模；目的是理解生产环境的能力范围，不是故意搞坏它。\n10. 暴露的问题要像测试 bug 一样修复；反复实验都未发现问题，则对系统正常情况下的正确性更有信心。\n11. 作者实践：Raft 支付系统研发 3 个月、混沌测试一整年，最后一个 bug 半年后才发现；正确性是金融系统开发者的道德底线，要先做强再做大。", "arch": "```mermaid\ngraph TD\n    A[定义实验假设] --> B[确定自变量-环境扰动]\n    A --> C[确定因变量-SLI]\n    A --> D[确定SLO-实验目标]\n    B --> E[补齐监控覆盖SLI]\n    E --> F[测试环境小规模实验]\n    F --> G[回归与预生产环境]\n    G --> H[生产环境灰度实验]\n    H --> I[控制伤害半径]\n    I --> J{暴露问题?}\n    J -- 是 --> K[修复并迭代]\n    J -- 否 --> L[提升系统信心]\n```", "compare": "| 维度 | 测试 | 混沌工程实验 |\n| --- | --- | --- |\n| 前提 | 已知正确答案 | 不知道会发生什么 |\n| 目标 | 肯定正确性 | 更好地理解系统 |\n| 结论形式 | 断言 | 假设 |\n| 暴露问题后 | 修 bug | 同样要修复 |", "pitfalls": "- 别把混沌工程当成\"故意搞坏生产环境\"：它是通过制造问题理解系统能力边界，伤害半径必须尽量小。\n- 不要用断言思维做混沌实验：应该先提出自变量与因变量之间的假设，接受未知结果。\n- SLA/SLO/SLI 三个词极易混：SLI 是\"看什么\"，SLO 是\"要达到多少\"，SLA 是包含前两者的协议。\n- \"Raft 被广泛使用\"不等于\"Raft 被证明正确\"：形式化证明只适用有限状态，Raft 状态无限。\n- \"系统\"的边界容易被低估：硬件、监控、运维与值班人员都属于混沌实验的对象范围。", "quiz": "- 为什么不能证明 Raft 是正确的？（涉及无限状态，形式化证明只覆盖有限状态；实现正确性不会高于理论）\n- 混沌工程与测试的本质区别？（测试已知答案、肯定正确性；混沌未知结果、理解系统，用假设）\n- SLA、SLO、SLI 的关系？（SLA 包含 SLO 与 SLI；SLI 是监控对象，SLO 是指标目标）\n- 什么是伤害半径、如何控制？（实验故障影响范围；从测试环境逐级升级到生产灰度小规模）"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少", "module": "05-春节策划", "moduleNo": 5, "order": 0, "title": "春节策划第1期丨分布式金融系统知识，你掌握了多少？", "isQA": false, "summary": "本篇是课程结课自测卷：10 道客观题检验知识点，两道跨行业主观题（春运卖票、王者荣耀）考察架构分析能力；命题立意是金融级问题的解法可迁移到任何高要求系统。", "mindmap": "- 春节策划第一期\n  - 三期策划结构\n    - 第1期客观题自测\n    - 第2期推荐书单\n    - 第3期主观题答案\n  - 客观题部分\n    - 5道单选\n    - 5道多选\n    - 覆盖全课程知识点\n  - 主观题一 春运卖票\n    - 峰值日点击1495亿\n    - 高峰每秒170万次\n    - 日售票超1000万张\n    - 火车票是动态SKU\n    - G71约136个SKU\n    - 选座使数量再翻倍\n  - 主观题二 王者荣耀\n    - 10客户端同场交互\n    - 掉线重连恢复状态\n    - 崩溃重启可回原局\n    - 设计前后端方案", "concepts": "- **动态 SKU**：电商商品库存是静态的，火车票则随任意起终点区间组合动态增减——卖出一张短途票会同时改变多个区间的可售状态，还叠加选座维度，数据量可达普通电商的数百倍。\n- **查询量与交易量分离**：点击量（QPS）与交易量（TPS）是两类完全不同的问题，前者可高出后者多个数量级，二者的架构优化路径也不同，量级不能直接比较。", "points": "1. 三期策划配套使用：本期自测，第 2 期书单，第 3 期公布主观题参考答案并回链对应课程章节以便查漏补缺。\n2. 12306 峰值日网络点击 1495 亿次，平均每秒约 170 万次点击；对比 2019 年淘宝订单创建峰值 54.4 万笔/秒。\n3. 春运日售票 1000 万张以上，平均约 115 笔/秒，峰值 TPS 估计几百到几千——交易量并不算高。\n4. G71 高铁 17 站按起终点组合共 136 个 SKU、对应 408 个商品；买短途票还会增加后段区间的 SKU，选座功能可能再翻倍。\n5. 命题用意：金融系统要求最高，学会它之后再处理其他行业的高难度系统是\"它山之石可以攻玉\"。\n6. 主观题 1 考察如何分析\"查询极重、交易正常\"型业务；主观题 2 考察弱网环境下的状态同步设计。", "arch": "本篇无显著架构内容", "compare": "| 对比 | 12306 | 淘宝（参照系） |\n| --- | --- | --- |\n| 峰值指标 | QPS 近 200 万（查询） | 订单 TPS 54.4 万/秒（交易） |\n| 业务形态 | 查询极重、交易正常 | 交易驱动型电商 |\n| 库存形态 | 动态 SKU，数百倍复杂度 | 静态商品库存 |", "pitfalls": "- 不要把 1495 亿次点击当作交易压力：那是查询侧 QPS，与 TPS 是两回事，直接对比没有额外信息。\n- TPS 量级低不代表系统简单：TPS 的处理难度高于 QPS，几百到几千已属正常甚至偏高。\n- \"查得到有票但下单失败\"不是系统 bug，这是业务上可接受的最终一致表现（为第 3 期的 CQRS 答案埋伏笔）。", "quiz": "- 12306 与淘宝的峰值对比说明了什么？（QPS 与 TPS 是不同问题，量级对比没有架构意义）\n- 为什么说火车票是动态 SKU？（卖出一段区间的票会同时改变多个相关区间的可售组合，还叠加选座维度）\n- 春运卖票业务的负载结构是什么？（查询量每秒百万级、交易 TPS 只有几百到几千，读写严重不对称）\n- 本期两道主观题分别考察什么能力？（重查询业务的读写分析、弱网下多端状态一致的设计）"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书", "module": "05-春节策划", "moduleNo": 5, "order": 0, "title": "春节策划第2期丨读书如抽丝，为你推荐一些我读过的好书", "isQA": false, "summary": "给出一份按技术、经济、金融三类组织的进阶书单，并阐明选书与读书方法论：首选英文原版以溯本求源，读书是质变手段而非速成方法，具体配置问题应查文档而非指望书籍。", "mindmap": "- 架构师进阶书单\n  - 选书原则\n    - 覆盖系统分布式金融\n    - 英文原版优先\n    - 翻译属再创作有失真\n    - 读书求质变非速成\n    - 配置问题查文档\n  - 技术类\n    - 领域驱动设计\n      - Evans原著难读\n      - Millett书啰嗦但佳\n    - 数据系统\n      - DDIA知识点最全\n      - 按章末论文深挖\n      - Internals补单机\n    - 数据库教材\n      - 事务锁实现详尽\n      - XML内容已过时\n    - 优化书系\n      - 网站架构全景入门\n      - CSAPP自硬件到软件\n      - 现代操作系统\n      - 性能监控极全面\n  - 经济类\n    - 曼昆入门但啰嗦\n    - 萨缪尔森凯恩斯派\n    - Varian微观进阶\n    - 哈耶克科普有争议\n  - 金融类\n    - CFA是敲门砖\n    - Mishkin学术教材", "concepts": "- **读书求质变**：系统开发中\"如何配置使用\"类问题查文档即可；真正需要读书的场合往往救不了当下，读书的价值是缓慢且无法自我感知的认知结构改变，须放下急功近利。\n- **溯本求源选书**：翻译是再创作，受译者水平限制；中文版讲不清时无法区分是原作者还是译者的问题，因此经典教材首选英文原版。", "points": "1. 书单覆盖计算机系统、分布式数据、金融与经济知识域，与课程知识体系一一对应。\n2. DDD：Evans 原著方法论极其重要但行文跳跃、前后顺序混乱，阅读难度大；Millett《Patterns, Principles, and Practices of DDD》是近十年不错的复述，行文啰嗦，需识别可跳读内容。\n3. 数据系统首推 DDIA：理论与实践兼备、知识点几乎全覆盖，但篇幅有限只能点到为止，正确用法是按每章末尾的论文列表继续深挖。\n4. 《Database Systems: The Complete Book》是为数不多讲数据库系统架构的书，事务与锁实现介绍极其详尽；缺点是 XML 内容已被 JSON 取代、书也难买。\n5. 《Database Internals》书名带分布式，实际单机部分写得比分布式部分好，可作 DDIA 的单机补充。\n6. 优化学习按宏观到微观：李智慧《大型网站技术架构》（唯一中文书，浅而全，可按图索骥查关键字）→《CS:APP》（自硬件到软件）→《Modern Operating Systems》→《Systems Performance》（火焰图作者所著，覆盖 CPU/内存/盘/网络/云，极其全面）。\n7. 经济类：曼昆《经济学原理》入门首选但啰嗦；萨缪尔森《经济学》为凯恩斯主义代表、止于第 19 版；Varian 微观经济学（作者曾任 Google 首席经济学家、主导拍卖设计）；哈耶克《通往奴役之路》争议大，酌情选择。\n8. 金融类实用的不是教材而是考试材料：CFA 以股票基本面为主、与现实有差距，但对跨行者是好敲门砖；Mishkin《货币金融学》学术视角、数据翔实。", "arch": "本篇无显著架构内容", "compare": "| 书 | 强项 | 短板 |\n| --- | --- | --- |\n| DDIA | 知识点全、理论实践兼备 | 只点到为止，需配论文 |\n| Database Systems | 事务与锁实现极详尽 | XML 过时、难买 |\n| Database Internals | 单机实现精彩 | 分布式部分凌乱分散 |", "pitfalls": "- 不要指望书籍解决\"当下的配置问题\"，那是文档的职责；书的定位是长期能力建设。\n- 中文译本读不懂时先怀疑翻译质量，回读英文原版，而不是怀疑原文讲不清楚。\n- 《Database Internals》按书名预期是分布式宝典，实际强项在单机；不要只看目录下单机章节就跳过。\n- CFA 不是学金融系统设计的教材，它教的是完成金融过程的流程知识，与系统设计需求不同。", "quiz": "- 为什么作者首选英文原版教材？（翻译是再创作，无法区分问题出在原作者还是译者）\n- DDIA 的正确读法是什么？（通读建立框架，再按各章末尾的论文列表深入每个知识点）\n- 经济类与金融类书单的定位差异？（经济提供理论框架与学派视角；金融实用的是 CFA 等考试材料）\n- 优化主题的阅读顺序为什么从宏观到微观？（先全景了解问题与解法，再逐层深入计算机、操作系统与性能调优）"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例", "module": "05-春节策划", "moduleNo": 5, "order": 0, "title": "春节策划第3期丨如何运用架构知识解读春运买票和手游案例？", "isQA": false, "summary": "公布第 1 期两道主观题参考答案：春运卖票本质是 QPS 近 200 万、TPS 仅几百的\"查询极重\"业务，用 CQRS 读写分离加异步推送解决；王者荣耀用事件溯源，服务器只做命令排序、自动机与状态放手机端以省流量。核心结论是架构核心知识通用。", "mindmap": "- 架构案例拆解\n  - 春运卖票\n    - TPS仅几百到几千\n    - QPS近200万\n    - 定位查询极重业务\n    - CQRS读写分离\n    - 订票与查询两系统\n    - 出票信息异步同步\n    - 写端座位区间加锁\n    - 锁粒度车次站点座位\n    - 万级TPS内可承载\n    - 读间无冲突可并发\n    - 业务容忍查询不一致\n    - 牺牲时效换吞吐\n  - 王者荣耀\n    - 物理操作转逻辑命令\n    - 事件即已发生变更\n    - 状态是角色与竞技场\n    - 服务器全局命令排序\n    - 自动机放手机端\n    - 依据手机流量小\n    - 时光机支持重连\n    - 读模式节点供解说\n    - 自动机须无随机性\n    - 需跨平台浮点中间件", "concepts": "- **CQRS（读写分离）**：把订票系统与余票查询系统拆成两个系统，出票信息由订票侧异步推送给查询侧。读、写各自独立优化，成立前提是业务不要求读写在同一事务中完成。\n- **区间加锁**：出票前必须锁住同一车次连续几个站点的同一座位，防止已选票被抢走。把票拆到\"车次×站点×座位\"最细粒度后，写入退化为 1 万 TPS 以下的加锁问题，一般数据系统都能承受。\n- **事件溯源三要素**：命令是外部指令（App 需把屏幕点击等物理操作翻译成\"角色向右走\"这类逻辑命令）；事件是已发生且会改变状态的事；状态是 10 个角色与竞技场的当前情况。\n- **自动机确定性**：事件溯源的时光机、读模式节点等能力都建立在自动机无随机性的前提上。不同手机 CPU 浮点精度不同，需要跨平台浮点计算中间件抹平差异。", "points": "1. 数据分析先行：日售票 1000 万张约 115 笔/秒，峰值 TPS 几百到几千；峰值 QPS 接近 200 万，约为淘宝订单 TPS 的 4 倍。\n2. QPS 与 TPS 的优化架构完全不同、不可比，TPS 更难处理，量级低是正常现象。\n3. 合并两组数据才能定位业务形态：查询量极其巨大、交易量正常——所以优化重点是查询侧，这对应课程第 7 课的 CQRS。\n4. 写端数据量估算约 100T，一个机柜内存即可装下，数据量不是挑战，真正的写挑战是区间加锁。\n5. 读操作可分布式化的依据一：任意两个读操作之间没有冲突，无冲突即可并发，一生二、二生万物，堆机器即可（对应第 19 课）。\n6. 依据二：用户被抢票体验训练出\"查得到但买不到\"的默认容忍，业务接受查询与实际不一致，可异步推送、按需建索引，牺牲时效性换吞吐量。\n7. 状态放服务器还是手机端取决于数据传输量：手机网络吞吐小，应把自动机放手机端、只传命令，事件生成与状态更新都在端上完成。\n8. 服务器职责收敛为收集全部命令并排序（保证全局操作顺序），这继承了事件溯源的时光机（掉线重连）与读模式节点（解说员实时观战）。\n9. 架构核心知识是通用的：复杂系统宏观上类似，细节各有千秋，关键是开发者如何合理使用。", "arch": "```mermaid\ngraph LR\n    A[\"用户\"] -->|\"高频余票查询\"| B[\"余票查询系统\"]\n    A -->|\"低频订票\"| C[\"订票系统\"]\n    C -->|\"座位区间加锁出票\"| C\n    C -->|\"异步推送出票信息\"| B\n    B -->|\"按查询复杂度建索引\"| B\n```\n\n```mermaid\nsequenceDiagram\n    participant 手机端\n    participant 服务器\n    手机端->>手机端: 物理操作译为逻辑命令\n    手机端->>服务器: 发送逻辑命令\n    服务器->>服务器: 全局命令排序\n    服务器->>手机端: 广播排序后命令\n    手机端->>手机端: 自动机生成事件并更新状态\n```", "compare": "| 维度 | 春运卖票 | 王者荣耀 |\n| --- | --- | --- |\n| 主要瓶颈 | 读侧 QPS 近 200 万 | 弱网流量与多端状态同步 |\n| 核心方案 | CQRS 读写分离 + 异步推送 | 事件溯源 + 命令排序 |\n| 一致性容忍 | 查询结果允许与实际不一致 | 掉线重连后恢复到当前状态 |\n| 优化抓手 | 牺牲时效性换吞吐量 | 减少传输数据量（传命令不传状态） |", "pitfalls": "- \"查到票但买不到\"不是错误，而是异步架构下的最终一致，是架构选型时的主动牺牲。\n- 不要把点击量峰值当交易压力：TPS 只有几百到几千，压力全部在读侧。\n- 游戏命令不能用屏幕坐标直接传输：机型与屏幕尺寸不同，物理坐标不通用，必须先翻译成逻辑命令。\n- 自动机若含随机性，事件溯源的时光机等能力全部失效；浮点精度差异是隐蔽的随机性来源。\n- 状态放手机端不是技术偏好，而是手机网络吞吐量约束下的数据量权衡。", "quiz": "- 为什么春运卖票适合 CQRS 架构？（QPS 百万级而 TPS 仅几百，读写负载严重不对称且业务不要求读写同事务）\n- 读操作分布式化的两条可行性依据是什么？（读与读之间无冲突可无限并发；业务默认容忍查询信息不一致）\n- 游戏服务器为什么只做命令排序而不存状态？（手机网络吞吐小，传输命令比传输状态省流量，状态计算下沉到手机端）\n- 事件溯源能力的前提是什么？（自动机必须无随机性，需用跨平台浮点计算中间件抹平不同 CPU 的精度差异）"}], "globalMap": "- 分布式金融架构\n  - 开篇词\n    - 金融级软件：演进中证明正确性\n    - 金融级人才：矛盾中看本质\n    - 课程路线：业务→正确性→分布式\n  - 金融业务与系统\n    - 扫码支付全链路与跨行清算\n    - 信息流资金流分离与组件演进\n    - 四类金融业务的技术要点\n    - DDD顶层架构与三领域划分\n    - 实体值对象聚合统一建模\n    - 思考题解析与外汇系统拓展\n  - 系统正确性保障\n    - 双时序保证输入正确\n    - 事件溯源保证过程正确\n    - 三段式保证结果正确\n    - 传输分交易与市场数据\n    - 存储按数据形态选库\n    - 优化分吞吐量与延时\n    - 答疑收束与账务特化\n  - 分布式正确性及高可用\n    - 12 单机:冲突与隔离级别\n    - 13 多机:2PC 与 TCC 分布式事务\n    - 14 容灾:会话/线性/严格串行化\n    - 15 存在性:FLP 不可能性\n    - 16 Raft:共识与线性化存储\n  - 春节策划\n    - 第1期：客观题自测与两道主观题\n    - 第2期：技术/经济/金融书单\n    - 第3期：CQRS与事件溯源案例答案", "atlas": [{"id": "ladder", "title": "一致性分级阶梯图", "blurb": "按环境复杂度递进的三级正确性阶梯——单机隔离级别、多机分布式事务、容灾下的一致性谱系", "order": 1, "body": "组内箭头按保证强度递增，组间虚线为环境升级维度（依据第 12/13/14 讲）。\n\n```mermaid\nflowchart LR\n    subgraph S1[\"单机无备份(L12)\"]\n        A1[\"读未提交RU<br/>消除脏写\"]\n        A2[\"读已提交RC<br/>加消除脏读\"]\n        A3[\"可重复读RR<br/>加消除模糊读\"]\n        A4[\"快照隔离<br/>MVCC读写无锁·事实默认\"]\n        A5[\"可串行化<br/>等价于某串行序\"]\n        A1 --> A2\n        A2 --> A3\n        A3 --> A5\n        A2 --> A4\n        A4 --> A5\n    end\n    subgraph S2[\"多机无容灾(L13)\"]\n        B2[\"2PC两阶段提交<br/>库级·准备成功态\"]\n        B3[\"TCC业务补偿<br/>锁短·防空回滚悬挂\"]\n        B1[\"分布式可串行化<br/>协调者集中决策\"]\n        B2 --> B1\n        B3 --> B1\n    end\n    subgraph S3[\"多机有容灾(L14)\"]\n        C1[\"最终一致性<br/>极限时间副本可见\"]\n        C2[\"会话一致性<br/>单调读写·自读自写·先读后写\"]\n        C3[\"线性一致性<br/>操作可排全局序\"]\n        C4[\"严格可串行化<br/>唯一真实时间序\"]\n        C1 --> C2\n        C2 --> C3\n        C3 --> C4\n    end\n    A5 -.->|\"数据拆多库<br/>汇集局部决策\"| B1\n    B1 -.->|\"加副本容灾<br/>集中控制失效\"| C1\n    classDef g1 fill:#d5e8d4,stroke:#82b366\n    classDef g2 fill:#ffe6cc,stroke:#d79b00\n    classDef g3 fill:#dae8fc,stroke:#6c8ebf\n    class A1,A2,A3,A4,A5 g1\n    class B1,B2,B3 g2\n    class C1,C2,C3,C4 g3\n```"}, {"id": "dag", "title": "课程知识关联图", "blurb": "L01-L21 与春3的依赖与互证网络，按五大模块着色，实线为前置依赖、虚线为综合运用", "order": 2, "body": "实线=后一讲建立在前一讲上；虚线=跨讲次综合运用与互相印证。\n\n```mermaid\nflowchart LR\n    BIZ1[\"L01 扫码支付\"]\n    BIZ2[\"L02 支付原理\"]\n    BIZ3[\"L03 金融业务\"]\n    BIZ4[\"L04 DDD上\"]\n    BIZ5[\"L05 DDD下\"]\n    COR1[\"L06 双时序\"]\n    COR2[\"L07 事件溯源\"]\n    COR3[\"L08 结果保障\"]\n    COR4[\"L09 数据传输\"]\n    COR5[\"L10 存储选型\"]\n    COR6[\"L11 系统优化\"]\n    THY1[\"L12 单机一致性\"]\n    THY2[\"L13 分布式事务\"]\n    THY3[\"L14 容灾一致性\"]\n    THY4[\"L15 FLP\"]\n    THY5[\"L16 Raft\"]\n    CAS1[\"L17 多机事件溯源\"]\n    CAS2[\"L18 数据方案\"]\n    CAS3[\"L19 动态分库\"]\n    CAS4[\"L20 实时容灾\"]\n    CAS5[\"L21 混沌工程\"]\n    SPR[\"春3 案例拆解\"]\n    BIZ1 --> BIZ2 --> BIZ3 --> BIZ4 --> BIZ5 --> COR1\n    COR1 --> COR2 --> COR3 --> COR4 --> COR5 --> COR6\n    COR1 --> COR3\n    THY1 --> THY2 --> THY3 --> THY4 --> THY5\n    THY5 --> CAS1\n    COR2 --> CAS1\n    CAS1 --> CAS3\n    THY5 --> CAS2\n    COR5 --> CAS2\n    THY5 --> CAS4\n    CAS4 --> CAS5\n    COR1 -.-> COR5\n    COR6 -.->|\"分库引出事务\"| THY2\n    THY2 -.->|\"协调者单点求解\"| THY5\n    THY3 -.-> CAS1\n    THY3 -.-> CAS2\n    COR2 -.->|\"日志即状态\"| CAS2\n    COR6 -.-> CAS3\n    THY5 -.->|\"不可形式化证明\"| CAS5\n    COR2 -.->|\"CQRS与溯源迁移\"| SPR\n    BIZ2 -.->|\"秒杀异步化\"| COR6\n    LEG[\"图例: 实线=前置依赖<br/>虚线=综合运用互证\"]\n    classDef cBiz fill:#f8cecc,stroke:#b85450\n    classDef cCor fill:#d5e8d4,stroke:#82b366\n    classDef cThy fill:#dae8fc,stroke:#6c8ebf\n    classDef cCas fill:#ffe6cc,stroke:#d79b00\n    classDef cSpr fill:#e1d5e7,stroke:#9673a6\n    class BIZ1,BIZ2,BIZ3,BIZ4,BIZ5 cBiz\n    class COR1,COR2,COR3,COR4,COR5,COR6 cCor\n    class THY1,THY2,THY3,THY4,THY5 cThy\n    class CAS1,CAS2,CAS3,CAS4,CAS5 cCas\n    class SPR cSpr\n```"}, {"id": "capstone", "title": "金融系统全链路综合图", "blurb": "一笔扫码支付从用户到清结算，再下探数据系统、存储层与两地三中心部署的全景综合", "order": 3, "body": "四色四域：蓝=支付链路，紫=数据系统，绿=存储层，红=容灾部署；label 末尾附讲次出处。\n\n```mermaid\nflowchart TD\n    U[\"用户扫码付款(详见L01)\"] --> MER[\"商户二维码订单(详见L01)\"]\n    MER --> ACQ[\"收单与第三方支付(详见L02)\"]\n    ACQ --> GW[\"金融网关签名路由(详见L02)\"]\n    GW --> CH[\"支付渠道银行卡组织(详见L01)\"]\n    CH --> CLR[\"清算机构日终轧差(详见L01)\"]\n    CLR --> PBOC[\"央行调准备金划款(详见L01)\"]\n    ACQ --> MQ[\"消息队列削峰填谷(详见L11)\"]\n    MQ --> ACC[\"账务系统记账(详见L02)\"]\n    ACC --> REC[\"核算系统对账(详见L02)\"]\n    REC -.->|\"信息流资金流同步\"| ACQ\n    ACC --> ES[\"事件溯源命令事件自动机(详见L07)\"]\n    ES --> CQRS[\"CQRS读模式自动机(详见L07)\"]\n    ES --> DW[\"双时序数据仓库(详见L06)\"]\n    ACC --> RDB[\"关系型数据库事务账(详见L10)\"]\n    DW --> TSDB[\"时序库KDB列存行情(详见L10)\"]\n    ACQ --> CACHE[\"缓存热点账户路由(详见L18)\"]\n    RDB -.->|\"部署于\"| DR1[\"两地三中心机房级(详见L20)\"]\n    ES -.->|\"复制状态机容灾\"| DR1\n    DR1 -.->|\"加城市加节点\"| DR2[\"三地五中心城市级(详见L20)\"]\n    classDef cFlow fill:#dae8fc,stroke:#6c8ebf\n    classDef cData fill:#e1d5e7,stroke:#9673a6\n    classDef cStore fill:#d5e8d4,stroke:#82b366\n    classDef cDR fill:#f8cecc,stroke:#b85450\n    class U,MER,ACQ,GW,CH,CLR,PBOC,ACC,REC,MQ cFlow\n    class ES,CQRS,DW cData\n    class RDB,TSDB,CACHE cStore\n    class DR1,DR2 cDR\n```"}, {"id": "decision-consistency", "title": "一致性选型决策树", "blurb": "按第14讲选级思路，从数据形态出发落到一致性等级并附一句代价提示", "order": 4, "body": "从\"这是什么数据\"出发，六个判断、七个叶子，对应第 12/13/14 讲的实际分级。\n\n```mermaid\nflowchart TD\n    R[\"这是什么数据或写场景?\"] --> Q1{\"单机库还是分布式多机?\"}\n    Q1 -->|\"单机单库\"| L1[\"快照隔离MVCC<br/>读写无锁·事实默认<br/>写写冲突仍需处理\"]\n    Q1 -->|\"分布式多机\"| Q2{\"数据有副本容灾吗?\"}\n    Q2 -->|\"无副本·分库分表跨服务写\"| L2[\"分布式事务TCC或2PC<br/>2PC长持锁·TCC防空回滚\"]\n    Q2 -->|\"有副本\"| Q3{\"短暂读到旧值可接受?\"}\n    Q3 -->|\"可接受·行情展示通知\"| L3[\"最终一致性<br/>窗口期旧值·无工程时限\"]\n    Q3 -->|\"不可接受\"| Q4{\"只有本会话有要求?\"}\n    Q4 -->|\"是·自己写的要看见\"| L4[\"单调读写+自读自写<br/>节点保存会话写入\"]\n    Q4 -->|\"否·跨会话\"| Q5{\"资金或锁等强正确?\"}\n    Q5 -->|\"否·跨用户因果即可\"| L5[\"先读后写<br/>跨会话定序成本\"]\n    Q5 -->|\"是·账户余额配置路由锁\"| Q6{\"要求事务级串行?\"}\n    Q6 -->|\"操作级即可\"| L6[\"线性一致性<br/>须共识算法支撑\"]\n    Q6 -->|\"全局唯一串行序\"| L7[\"严格可串行化<br/>真实时间唯一序·极少用\"]\n```"}, {"id": "decision-storage", "title": "存储选型决策树", "blurb": "按第10讲数据关系分类：图、时序、双时序、关系型与NewSql的取舍路径", "order": 5, "body": "从数据形态与访问模式出发，叶子落到第 10 讲的引擎结论（辅以第 7/18 讲的日志存储）。\n\n```mermaid\nflowchart TD\n    R[\"数据形态与访问模式?\"] --> Q1{\"关系呈网状图?\"}\n    Q1 -->|\"是\"| L1[\"图数据库<br/>仅KYC与AML风控分析\"]\n    Q1 -->|\"否\"| Q2{\"按时间序·数据间无关系?\"}\n    Q2 -->|\"是·行情类\"| Q3{\"旧数据要修订更正吗?\"}\n    Q3 -->|\"要·场外低吞吐\"| L2[\"双时序数据库<br/>自研·矩形索引成本高\"]\n    Q3 -->|\"不要·只追加\"| L3[\"列存时序库KDB<br/>向量指令·GB至TB\"]\n    Q2 -->|\"否\"| Q4{\"树状业务数据?\"}\n    Q4 -->|\"是·强事务必不可少\"| L4[\"关系型数据库<br/>万金油·事务兜底\"]\n    Q4 -->|\"是·高并发对象为主\"| L5[\"NewSql<br/>JSON原子存·索引最终一致\"]\n    Q4 -->|\"否·海量追加日志\"| L6[\"顺序写文件+定长索引<br/>或LSM树·写快读锯齿\"]\n```"}, {"id": "decision-dr", "title": "容灾方案决策树", "blurb": "按第20讲：从SLA与RPO出发落到人工监控、主备异步、两地三中心与三地五中心", "order": 6, "body": "以成本三角（服务质量/事务正确性/成本）为根，叶子是第 20 讲的部署结论，附第 21 讲验证收尾。\n\n```mermaid\nflowchart TD\n    R[\"RPO与RTO要求及成本预算?\"] --> Q1{\"业务量小且SLA宽松?\"}\n    Q1 -->|\"是·SLA按天到月\"| L1[\"人工监控即可<br/>如资产证券化Excel台账\"]\n    Q1 -->|\"否·高SLA限时恢复\"| Q2{\"允许丢少量尾部数据?\"}\n    Q2 -->|\"允许·RPO大于0\"| L2[\"主备异步复制<br/>如Redis主挂可能丢数据\"]\n    Q2 -->|\"不允许·RPO趋零\"| Q3{\"要扛哪一级故障?\"}\n    Q3 -->|\"单节点断电\"| L3[\"带电池硬盘保落盘<br/>或断电视作单点故障\"]\n    Q3 -->|\"单机房故障\"| L4[\"两地三中心2+1<br/>机房级·一城挂缺多数派\"]\n    Q3 -->|\"城市级故障\"| L5[\"三地五中心<br/>任一城市挂仍多数派\"]\n    L2 -.-> V[\"混沌工程与Jepsen验证<br/>正确性是置信度(详见L21)\"]\n    L4 -.-> V\n    L5 -.-> V\n```"}], "sreCards": [{"title": "隔离级别与单机事务", "lectures": "12", "定位": "按\"冲突解决数量\"分级的单机事务正确性阶梯(读写/写读/写写三型冲突),工程默认是快照隔离+MVCC,不是最高等级。", "故障": "- **读到未提交/重复读不一致**:库实际跑在 Read Uncommitted/Read Committed 级别 → 同一事务前后两次读结果不同,甚至读到未提交数据;是级别没到位,不是 bug。\n- **2PL 锁等待雪崩**:两阶段锁先对全部资源加排它锁、最后统一解锁且中途不能再加锁 → 高并发下等锁队列整体拉长。\n- **MVCC 版本堆积**:删除只打标签等回收 → 表体积与行版本持续上涨、查询变慢;根因是回收器被长事务卡住,不是数据在涨。\n- **SSI 长事务晚回滚**:提交时才查冲突 → 冲突密集时事务跑很久在提交阶段被回滚,白耗资源。\n- **写写冲突穿透快照隔离**:快照隔离弱于可串行化 → 两个并发事务各基于旧快照写入,出现丢失更新类结果。", "观测": "- `txn_lock_wait_ms`:等锁耗时;抬升=持锁事务变长或冲突变密。\n- `long_running_txn_age_seconds`:最老事务年龄;它是 MVCC 回收的最大阻力。\n- `mvcc_dead_version_count`:待回收版本数;单调上升=回收没跟上。\n- `txn_write_conflict_count` / `abort_at_commit_ratio`:写写冲突与提交期回滚占比;偏高说明乐观路线已不划算。\n- `reported_isolation_level`:库自报级别;上线核对一次,别默认是可串行化。", "应急": "- 锁等待堆积 → 找最老持锁事务、kill 阻塞源释放锁,再回头拆分事务。\n- 版本堆积 → 清长事务、手动触发回收,而非扩容。\n- 提交期大量回滚 → 拆小热点长事务,或降回快照隔离换吞吐,再评估悲观锁路线。", "误区": "- \"支持事务\"≠最高正确性:同名\"事务\"天差地别,先怀疑它只是快照隔离。\n- 2PL(两阶段锁)与 2PC(两阶段提交)名字像但毫无关系,别混着查。\n- 可串行化的\"某个顺序\"不唯一,按定义对照结果;快照不是真拷贝数据,靠版本列过滤实现。"}, {"title": "2PC 分布式事务", "lectures": "13", "定位": "2PC 由协调者汇集各库局部状态集中决策:阶段一各库预处理停在\"准备成功\"态,阶段二统一下发提交或回滚,用单机事务撑起全局事务。", "故障": "- **协调者单点故障**:协调者全局库保存全部全局事务状态 → 它宕机或库损坏后,一批事务既不提交也不回滚,全局无法决策。\n- **prepare 后失联**:阶段一已发、阶段二没来 → 参与库一批事务停在\"准备成功\"态,对应数据锁一直被持有,业务排队。\n- **两阶段间长持锁**:阶段一不提交事务,相关数据全程持锁 → 锁等待随协调者处理与网络往返拉长而集中爆发。\n- **准备失败/无响应触发全局回滚**:任一节点异常即统一回滚 → 业务侧成批失败,回滚日志指向失败节点。\n- **消息乱序**:节点先收阶段二后收阶段一 → 是异步乱序而非故障;2PC 已封装在数据库底层处理,业务无感。", "观测": "- `prepared_txn_age`:\"准备成功\"态事务时长;亚秒级过渡正常,持续增长=阶段二没下发。\n- `2pc_held_locks`:两阶段间持锁数据项数;升高对应卡住事务,是锁等待的根因上游。\n- `2pc_roundtrip_ms`:两次网络往返延时;这是 2PC 无法压缩的下限,抬升=网络/负载恶化。\n- `coordinator_state_db_health`:协调者全局库健康;损坏=全局决策中断。\n- `2pc_global_abort_rate`:全局回滚比例;骤升先按回滚记录定位节点。", "应急": "- 事务卡\"准备成功\" → 查协调者:活着就重推阶段二决策;全局库丢数据时可按各节点准备状态反推全局进展,人工收敛到提交或回滚。\n- 协调者反复单点 → 治本:给全局事务库加共识容灾(操作日志经 Raft 同步、日志恢复状态)。\n- 锁等待爆发 → 找持锁最久的 in-doubt 事务,推动阶段二决策落地释放锁。", "误区": "- \"已提交事务不能回滚\"与 2PC 不冲突:阶段二回滚的是从未提交、停在\"准备成功\"态的事务。\n- 协调者全局库丢数据不必然灾难:各节点状态携带信息,可反推全局进展。\n- 准备失败触发回滚与消息乱序是两类事:前者是故障路径,后者是乱序,处置完全不同。"}, {"title": "TCC 补偿事务", "lectures": "13", "定位": "TCC 把分布式事务搬到业务层:Try-Confirm-Cancel 每阶段都是完整提交的本地事务,Cancel 用反向业务对冲第一阶段效果,换短锁持有时间。", "故障": "- **中间态瞬时空窗**:Try 已真正提交、Confirm/Cancel 未执行 → 账面瞬时\"少了钱\"(如转账双方停在中间值);微观不原子的固有表现,不是丢钱。\n- **Try/Cancel 乱序**:先收 Cancel 后收 Try → 没做空回滚的实现在此报错或错误执行。\n- **悬挂事务**:空回滚记录没被检查,迟到 Try 又执行 → 已取消业务的正向效果\"复活\",无确认阶段收尾。\n- **Cancel 被当回滚实现**:Try 已提交、数据库层不可回滚 → Cancel 报错或反向失败,对账出现单向差额。\n- **停在中间态收不了尾**:协调者或参与方故障 → 大量事务停在 Try 后,中间态远超预期窗口。", "观测": "- `tcc_pending_txn_age`:Try 完成到 Confirm/Cancel 终态的时长;增长=收敛链路断。\n- `empty_cancel_count`:空回滚次数;稳定存在=乱序被正常处理。\n- `suspended_try_blocked_count`:防悬挂拦截迟到 Try 的次数;不拦截即悬挂事故信号。\n- `tcc_compensation_lag`:补偿动作相对 Try 的延迟;抬升=协调者积压或参与方响应慢。\n- `intermediate_state_diff_count`:中间态账面差额(对账口径);应随补偿完成归零。", "应急": "- 事务停在中间态 → 协调者按全局记录重推 Confirm/Cancel;每阶段是完整本地事务,重试安全,业务需幂等。\n- Cancel 无 Try 报错 → 补齐异常三加强(允许空回滚、空回滚留记录、防悬挂)后重放该事务。\n- 账面差额不归零 → 对账定位未收尾事务清单,逐单驱动补偿,再查协调者与参与方链路。", "误区": "- Cancel 不是数据库回滚,是反向业务对冲;每个业务必须写正反两套,少一套即事故源。\n- \"转账必须原子\"是宏观结论,微观有可见中间态,靠最终正确收尾——别把中间态告警当资金事故硬查。\n- 最复杂的异常不是宕机而是乱序:没收到 Try 却收到 Cancel,三重加强就是为它准备的。"}, {"title": "Raft 共识与选主", "lectures": "15,16", "定位": "Raft 保证多数在线时集群日志完全一致,等价于全序广播与线性化存储;选主靠任期递增:心跳压制从节点,失主后候选任期+1 争过半投票。", "故障": "- **选主风暴**:主失联心跳中断,从节点自荐候选(任期+1) → `raft_term` 快速跳增;候选可同时多个,但同一时刻至多一个主。\n- **客户端打到从节点**:客户端缓存的主过期 → 写入报错;从节点应给出它心中的主节点提示,客户端循提示快速找主。\n- **\"不确定\"处理不当**:网络无响应非成非败 → 不按失败重发则结果未知;重发而服务端没去重则同一请求重复执行。\n- **多数派不在线**:Raft 可用前提是多数在线而非全部 → 选举无法过半,健康侧节点再多也起不来。\n- **同步中内容被当可用**:日志分已确认段与同步中段 → 从节点读出未提交内容后失效,属误用临时数据。", "观测": "- `raft_term`:任期单调递增;连续跳增=选主风暴,长期不动=主稳定。\n- `raft_leader_elections_total`:选主累计;斜率异常查心跳链路与负载抖动。\n- `quorum_available`:可构成多数派的节点数;低于半数=集群不可用。\n- `client_redirect_count`:从节点提示改道次数;突增=主刚切换或缓存过期。\n- `duplicate_request_count`:去重拦截的重复请求数;\"重发+去重\"链路成立的标志。\n- `raft_uncommitted_log_entries`:未过半确认的日志;堆积=多数派复制变慢。", "应急": "- 失主/选主风暴 → 不手动指定主,让机制收敛;客户端轮询其余节点、跟随提示找主。\n- 出现重复执行 → 立即确认服务端去重(幂等)在位——是必需品不是可选项。\n- 多数派不在线 → 按容灾力度恢复节点使多数派复活,业务侧同步降级。\n- 关键消息不收敛 → 核对超时/失败检测配置:完全异步+可能故障时不存在非随机共识(FLP),超时是唯一现实出路。", "误区": "- \"成功\"=已通过全序广播保存到所有正常机器,此时才能继续下一条。\n- 客户端不能缓存\"谁是主\"太久,主节点角色随时可能变化。\n- Raft 假设节点非恶意,与区块链拜占庭共识前提不同;FLP 是有精确前提的不可能,加超时即可绕开,不是\"分布式注定不可能\"。"}, {"title": "主从复制与最终一致性", "lectures": "14,18", "定位": "数据多副本后一致性分出最终一致性、四种并列的会话一致性、线性一致性与严格可串行化;写主节点复制到备份、读可落任一节点,是一切差异的来源。", "故障": "- **延迟窗口读到旧值**:异步复制未及副本 → 用户刚写的查不到,或后一次读比前一次更旧(违反单调读)。\n- **读不到自己写的**:读请求落未同步副本 → 自读自写被破坏;注意它只保证写入完成,不保证写序。\n- **写序错乱**:各节点写序与用户不一致(违反单调写) → 同会话多次写在不同节点顺序颠倒。\n- **异步主从丢数据**:Redis 式异步备份下主节点故障丢未复制数据 → \"读主=线性一致\"只在主不故障时成立,集群整体达不到。\n- **CAP 误用**:脑裂发生时只能 CP/AP 二选一,不是三选二 → 复盘引用错误取舍依据会掩盖真实的一致性选择。", "观测": "- `replication_lag_seconds`:复制延迟,即最终一致性的实际窗口;无界波动=会话一致性全面承压。\n- `stale_read_count`:读到更旧值的计数;非 0 按读节点分布排查路由。\n- `write_order_violation_count`:跨节点写序不一致;出现=复制未保序。\n- `cross_session_causal_violation_count`:先读后写(唯一跨会话)被破坏;因果依赖业务必盯。\n- `async_backup_unacked_bytes`:主节点未获备份确认的数据量;即故障时可能丢失的量级。", "应急": "- 读到旧值 → 一致性敏感读切主节点(或一致性读:查询当空命令经共识排序达线性一致),再评估路由策略。\n- 延迟放大 → 排查主节点写放大与副本回放速度,必要时写侧限流,等 lag 收敛再放行。\n- 切换后丢数据 → 承认异步复制的既定窗口,走业务补偿,评估改同步复制。\n- 因果类投诉 → 核对四类会话一致性(单调写/单调读/自读自写/先读后写)是否按需组合:四者并列无强弱,缺哪类补哪类。", "误区": "- 单调读不约束读顺序,约束的是读相对写的新旧,名字极误导。\n- 自读自写≠写入完成,顺序正确需单调写补足。\n- 三个\"强\"分层记:可串行化管事务(顺序可任选)、线性一致性管操作(全局可排序)、严格可串行化顺序唯一但效率极低;多副本下集中决策/单点控制的旧结论整体失效。"}, {"title": "事件溯源架构", "lectures": "7,17", "定位": "命令经检查生成事件、按 FIFO 落盘、由无随机性自动机重放,历史状态可复现可审计;多机容灾靠共识算法复制事件队列构成复制状态机。", "故障": "- **自动机随机性污染重放**:执行中用真随机数或外部 IO → 同一份队列两机重放出不同状态,时光机与容灾同时失效;跨平台浮点精度是隐蔽随机源。\n- **复制了命令队列而非事件队列**:命令转事件有随机性,换主后同命令可能生成不同事件 → 主从切换后各节点状态分叉。\n- **事件文件尾部损坏**:队列只末尾追加,损坏集中尾部 → 尾部事件读不出;先写索引后写事件会指向未落盘内容。\n- **读模式节点长期落后**:读模式重放有固有延时 → 常规查询返回旧状态;仅被共识标记已同步的数据才保证正确。\n- **快照缺事件位置**:只存状态不记位置 → 恢复时不知从哪条事件继续,流程卡死或状态重复执行。", "观测": "- `snapshot_position_gap`:快照后待重放事件数;恢复时间只取决于它,变大=恢复变慢。\n- `replay_lag_seconds`:读模式落后主节点的时间;长期不收敛查其同步链路。\n- `event_file_integrity_failures`:索引/事件校验码联合检测失败;应集中在尾部。\n- `index_event_mismatch_count`:索引指向不存在的事件;非零=写入顺序颠倒。\n- `nop_event_ratio`:空事件(留痕 NOP)占比;确认被拒命令有迹可循的审计指标。", "应急": "- 重放结果不一致 → 停用该自动机做容灾/审计,排查真随机、外部 IO、浮点来源;外部输入必须提前写入事件队列。\n- 尾部损坏 → 别整个丢弃:裁剪索引到单条大小的整数倍,从末尾逐条校验抢救可用部分,再从快照重放补齐。\n- 恢复慢 → 打新快照截断恢复时间(借日切节奏),把\"恢复时间=快照后事件数\"纳入规划。\n- 读模式返回旧值 → 敏感查询升级为一致性读(查询当空命令走写节点共识,达线性一致)。", "误区": "- 命令≠事件:不合理的命令不生成事件(或生成空事件留痕),事件一旦生成执行必然成功;检查闸门是正确性关键。\n- 禁的是真随机:伪随机把算法与种子记入事件即可重放;事件不触发事件,触发的是命令。\n- 容灾复制的是事件队列,不是命令队列——这是换主后状态一致的前提。"}, {"title": "分库分表与动态迁移", "lectures": "11,19", "定位": "分库分表按 MECE 原则切分扛流量(哈希打散/范围连续);事件溯源支撑不停机动态分库:快照管存量、命令队列管增量、状态机管实时一致。", "故障": "- **路由错库**:消息发到不负责该业务的集群 → 设计上应返回错误并提示正确去处(错误重定向),不能默默丢弃。\n- **切换窗口无人处理**:A/B 配置生效时间差内,属 B 的消息两边都不处理 → 因事先把差距压到几秒,影响约等于一次重发。\n- **范围切分热点**:按时间/主键范围切分后最近数据被集中访问 → 单库打满;哈希切分则流量均匀但连续访问被打散。\n- **库数定死难扩容**:分库数确定后难以调整 → 容量水位逼近上限却无法加库(四大代价之一)。\n- **同步判定造假**:用\"完全一致\"当标准 → A 持续处理业务、B 永有延时,分库永远发起不了。", "观测": "- `misrouted_msg_count`:收到不属自己业务消息的计数;分库后短暂出现即归零。\n- `shard_sync_gap_seconds`:B 相对 A 的事件差距;收敛到几秒才能发分库命令。\n- `migration_window_duration`:分库命令在 A/B 生效的时间差;即\"无人处理窗口\"。\n- `hotspot_shard_qps`:单库 QPS 分布;持续超均值即热点。\n- `migration_command_dup_count`:同一分库命令重复执行计数;命令幂等,重复不影响正确性,用于验证幂等在位。", "应急": "- 上游发错库 → 依赖错误重定向自动更新路由;上游无路由能力就在中间加一层路由承接。\n- 窗口丢消息 → 消息重发+幂等收敛,属设计内影响,勿人工重放引发重复。\n- 单库热点 → 重新评估切分维度;超大流量账户优先单独分库,再拆子账户/科目,最后纵向扩容。\n- 流程卡住 → 查协调者阶段记录;注意 B 由它自己从命令队列读到命令驱动,协调者只推或拉状态。", "误区": "- 别追求完全同步:达标线是差距缩到几秒;判断同步完成的资格只有 B 自己有。\n- 分库命令只记录\"谁负责什么业务\",不含数据格式与处理细节;照它改存储逻辑是理解错误。\n- 市场数据按时间范围切分(连续访问友好),哈希会打散连续性;分库分表自带至少两次网络通讯的延时下限,低延时业务不可接受。"}, {"title": "跨机房容灾", "lectures": "20", "定位": "正确容灾=SLA 限时恢复+事务原子性并与成本权衡;无状态层靠调度重试与幂等,数据层靠共识算法的两地三中心/三地五中心部署。", "故障": "- **监控伪报误导处置**:监控报服务不可用但实际正常(如防火墙错配) → 告警触发、切流执行,业务却无异常;容灾流程必须在伪报下仍正确。\n- **多数派被一锅端**:3 备份按 2+1 跨两机房,机房 1 整体故障只剩 1 节点 → Raft 缺多数派不可用;自以为的机房容灾实为单节点级。\n- **fsync 成功仍丢数据**:数据只到硬件控制器缓存 → 断电后\"已提交\"数据消失,单节点容灾隐形坑。\n- **客户端找不到新主**:服务端切换正确但客户端扑向旧主 → 恢复时间被拉长,SLA 压线甚至违约。\n- **无状态层消息重发**:服务处理成功但结果未送达 → 重试致同一请求重复执行,无幂等即重复记账。", "观测": "- `monitor_false_alarm_rate`:伪报率(报不可用实际正常);由监控平台互相监控对账得出,是切流可信的前提。\n- `raft_nodes_by_site`:各机房/城市节点分布;对照口径:两地三中心(2+1)扛机房级,三地五中心扛城市级。\n- `fsync_battery_health`:带电池硬盘的掉电保护状态;异常=断电丢数据窗口敞开。\n- `failover_recovery_duration`:故障到恢复时长 vs SLA 时限;差值是客户端找主、路由更新的损耗。\n- `retry_dup_count_after_failover`:容灾期重发消息数;配合幂等校验确认重复被兜住。", "应急": "- 故障切流 → 无状态层调度重试落健康机房,第一时间更新路由剔除故障机房;交易所类有状态系统按数据节点处理。\n- 疑似伪报 → 切流走可回退路径,用业务探针验证真实链路后再定级。\n- 客户端找主慢 → 落实轮询找主+跟随从节点提示,把恢复压回 SLA。\n- 多数派不在线 → 按三地五中心口径补位节点复活多数派。", "误区": "- 3 备份放 2 机房≠机房容灾:多数派要 2 节点在线,机房 1 挂掉算法直接不可用。\n- fsync 成功≠落盘:要么企业级带电池硬盘,要么像 Kafka 把断电当单节点故障——到什么程度取决于你有多少钱。\n- 监控平台不必套业务系统容灾:数据允许部分丢失,本地异步备份+互相监控即可;SLA 违约金额可控,事务正确性出错不可控,优先级不同。"}, {"title": "混沌工程", "lectures": "21", "定位": "系统正确性无法被理论或实践穷尽证明,只能转为统计置信度;混沌工程主动制造故障提高发现问题概率,对象含硬件、监控、运维与值班人员。", "故障": "- **SLI 监控缺位就开实验**:软件不可见只能靠指标间接了解行为 → 实验做完无数据可分析;补齐 SLI 覆盖是前置条件。\n- **伤害半径失控**:跳过测试/回归/预生产直接生产全量 → 一次\"演练\"变真事故;必须逐级升级到生产灰度、半径尽量小。\n- **断言式实验**:用测试思维(已知正确答案)做混沌 → 真正暴露的未知问题被漏掉;应用假设,接受未知结果。\n- **对象边界低估**:只扰动应用进程,不覆盖硬件/操作系统/虚拟机/系统 API 各层 → 未实验的层次真实爆发;分层找自变量。\n- **证明幻觉**:以为\"Raft 广泛使用=被证明正确\" → 形式化证明只适用有限状态,Raft 状态无限;正确性只能靠实验抬置信度。", "观测": "- `sli_coverage_ratio`:SLI(吞吐/延时/性能)的监控覆盖率;低于 100% 先补监控再实验。\n- `blast_radius_percent`:实验影响范围(用户/节点比例);从灰度小规模按环境层级放大。\n- `injected_vs_detected_faults`:注入扰动数 vs 被告警捕获数;差值即系统盲区清单。\n- `slo_breach_during_experiment`:实验期 SLO 违反次数;SLO 是假设的目标值,违反即证伪、转修复。\n- `jepsen_invariant_violations`:Jepsen 类正确性验证的违反项;它把 SLO 定义在正确性(目标 100%)上。", "应急": "- 实验引发真故障 → 立即回滚扰动源,控制伤害半径,再按正常故障处置。\n- 实验暴露问题 → 像修测试 bug 一样建单修复并回归;修复前不在该层重复同强度实验。\n- 发现盲区 → 补齐对应 SLI 监控与告警后再做下一轮,监控覆盖是实验前提。\n- 实验通过 → 记录为置信度证据;未发现问题只提升信心,不是保证。", "误区": "- 不是\"故意搞坏生产环境\":是通过制造问题理解系统能力边界,伤害半径必须尽量小。\n- 别用断言思维:先提出自变量-因变量假设、接受未知结果,这是与测试的本质区别。\n- SLA/SLO/SLI 极易混:SLI 是\"看什么\"(实验因变量),SLO 是\"达到多少\"(实验假设),SLA 是包含两者的协议;系统边界含人与运维,勿低估。"}], "sreMetrics": "# 监控指标速查表\n\nSRE 值班速查:按\"指标 → 异常含义 → 深入讲次\"定位故障手册卡。指标名为按课程机制推导的通用命名,语义以课程内容为准。\n\n| 指标/观测项 | 所属层 | 正常含义 | 异常说明 | 深入讲次 |\n| --- | --- | --- | --- | --- |\n| `txn_lock_wait_ms` | 单机事务(2PL) | 等锁耗时接近零 | 持续抬升=持锁事务变长或冲突变密,2PL 全量加锁拖出等待队列 | 12 |\n| `long_running_txn_age_seconds` | 单机事务 | 事务短平快 | 出现长事务;它是锁等待与 MVCC 回收的最大阻力 | 12 |\n| `mvcc_dead_version_count` | 单机事务(MVCC) | 已打删除标签的版本被回收器及时清掉 | 单调上升=垃圾回收没跟上,表体积与查询延时随之变差 | 12 |\n| `prepared_txn_age` | 2PC | \"准备成功\"态是亚秒级过渡 | 持续增长=第二阶段决策未下发,参与库锁被无限期持有 | 13 |\n| `coordinator_state_db_health` | 2PC | 协调者全局事务库可用 | 损坏=全局事务无法决策,整批事务卡死(单点问题) | 13 |\n| `tcc_pending_txn_age` | TCC | Try 完成到 Confirm/Cancel 仅一次往返量级 | 拉长=收敛链路断,账面中间态(瞬时空窗)持续暴露 | 13 |\n| `empty_cancel_count` | TCC | 空回滚留痕,迟到的 Try 被防悬挂记录拦截 | 报错/业务复活=三重加强(空回滚、留记录、防悬挂)缺失 | 13 |\n| `raft_term` | Raft 选主 | 单调递增,跳变对应一次选主 | 短时连续跳增=选主风暴(心跳中断);长期不动=主稳定 | 16 |\n| `quorum_available` | Raft 多数派 | 多数节点在线,集群可用 | 低于半数=选举无法过半,集群整体拒绝服务(哪怕部分节点健康) | 16 |\n| `duplicate_request_count` | Raft 客户端 | \"不确定\"按失败重发后被服务端去重拦截 | 拦截数为 0 且有重复执行效果=服务端去重(幂等)缺失 | 16 |\n| `replication_lag_seconds` | 主从复制/最终一致性 | 副本短暂落后后收敛 | 无界波动=最终一致性窗口放大,会话一致性全面承压 | 14,18 |\n| `stale_read_count` | 会话一致性 | 读不到比前次更旧的值(单调读) | 非 0=读路由落到未同步副本,自读自写/单调读被破坏 | 14 |\n| `async_backup_unacked_bytes` | 异步主从备份(Redis) | 异步复制积压极小 | 变大=主故障时即将丢失的量级;集群整体达不到线性一致 | 18 |\n| `snapshot_position_gap` | 事件溯源(快照) | 快照后待重放事件数受控(日切节奏) | 变大=容灾恢复时间线性变长 | 7 |\n| `replay_lag_seconds` | 事件溯源(读模式) | 读模式节点重放落后几秒内 | 不收敛=常规查询返回旧状态;仅已同步数据保证正确 | 7,17 |\n| `event_file_integrity_failures` | 事件溯源(存储) | 校验码联合检测(索引存校验码)通过 | 失败集中在尾部=末尾损坏;先写索引后写事件会产生指向空位的索引 | 7 |\n| `misrouted_msg_count` | 动态分库路由 | 上游发错库,收到错误重定向提示 | 持续非零=路由层没学会新路由,业务长期投递失败 | 19 |\n| `shard_sync_gap_seconds` | 动态分库同步 | 新集群差距收敛到几秒(足够新) | 停在分钟级=分库命令无法发起,切换窗口无人处理时间被放大 | 19 |\n| `hotspot_shard_qps` | 分库分表 | 各库流量按切分策略分布 | 单库超均值=范围切分热点(最近数据集中访问);库数定死难扩容 | 11,19 |\n| `queue_backlog_size` | 消息队列削峰 | 高峰入队、按集群能力匀速消化 | 积压持续增长=消化能力不足或下游故障,峰值时延被拉长 | 11 |\n| `rate_limit_drop_count` | 数据传输限流 | 漏桶/令牌桶按策略拒绝超额请求 | 骤升=上游突发或下游容量不足;限流开启后必须假设数据会丢 | 9 |\n| `isr_sync_count` | Kafka 同步副本 | 同步副本数达标,容灾在位 | 被调低换速度后频繁丢失=时效性换速超过业务容忍线 | 9 |\n| `secondary_index_staleness` | 存储健康度(NewSql) | 二级索引与主数据同步更新 | 分布式下只能最终一致,查询结果不准——金融观望的直接原因 | 10 |\n| `fsync_battery_health` | 单节点容灾 | 企业级带电池硬盘保证断电落盘 | 电池异常=fsync 只到控制器缓存,断电即丢\"已提交\"数据 | 20 |\n| `monitor_false_alarm_rate` | 监控可靠性 | 监控平台互相监控、伪报率≈0 | 升高=防火墙类误报会触发错误切流,容灾决策不可信 | 20 |\n| `failover_recovery_duration` | 容灾恢复(SLA) | 限时恢复,符合 SLA 承诺 | 超时=客户端找新主、路由更新等环节拖慢恢复 | 20 |\n| `sli_coverage_ratio` | 混沌工程 | 所有 SLI(吞吐/延时/性能)被监控覆盖 | 低于 100%=实验前必补,否则实验结果不可分析 | 21 |\n| `blast_radius_percent` | 混沌工程 | 实验影响范围=生产灰度小规模 | 失控=跳过测试/回归/预生产逐级升级,演练变真事故 | 21 |\n", "cards": [{"id": "00-开篇词-如何成为金融级人才#q0", "modNo": 1, "lect": "如何成为金融级人才？", "q": "金融软件与军用软件、操作系统的复杂度差异在哪里？", "a": "金融在于演进过程中保持并证明正确性"}, {"id": "00-开篇词-如何成为金融级人才#q1", "modNo": 1, "lect": "如何成为金融级人才？", "q": "为什么金融系统不能在正确性与吞吐量之间简单取舍？", "a": "吞吐不足会让人转不了钱，引发挤兑等恶性群体性事件"}, {"id": "00-开篇词-如何成为金融级人才#q2", "modNo": 1, "lect": "如何成为金融级人才？", "q": "同时改善矛盾需求的代价包含哪几类？", "a": "开发、运营、思考成本，还要保证迭代后承诺不破"}, {"id": "00-开篇词-如何成为金融级人才#q3", "modNo": 1, "lect": "如何成为金融级人才？", "q": "课程三大模块分别解决什么问题？", "a": "业务认知、单系统正确性与优化、分布式一致性高可用与容灾"}, {"id": "00-开篇词-如何成为金融级人才#c4", "modNo": 1, "lect": "如何成为金融级人才？", "q": "金融级软件 是什么?", "a": "处理对象是钱，错误意味着真金白银的损失且不可逆。它区别于其他大型系统的关键，是在软件不断迭代升级的过程中始终保持正确性，并能证明这种正确性，同时还要兼顾性能。"}, {"id": "00-开篇词-如何成为金融级人才#c5", "modNo": 1, "lect": "如何成为金融级人才？", "q": "金融级人才 是什么?", "a": "能在正确性与吞吐量等相互矛盾的需求之间不做二选一、而是同时改善的架构师。进阶到资深架构师乃至技术决策者的必经之路。"}, {"id": "00-开篇词-如何成为金融级人才#c6", "modNo": 1, "lect": "如何成为金融级人才？", "q": "透过现象看本质 是什么?", "a": "金融级人才的核心能力。理解了问题本质就能推演出事物发展规律，从而提前布局、未雨绸缪，而不是等问题出现再救火。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c0", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "绑卡四要素 是什么?", "a": "姓名、身份证号、银行卡号、银行预留手机号,全是银行记录的静态信息;再加短信验证码这一动态信息共验证 5 项。验证主体是银行,第三方公司只是转交,通过后拿到用户 Token 供后续合法操作。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c1", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "轮询 是什么?", "a": "用户 App 定时向支付后台查询交易状态。因为后台与银行之间是异步消息,支付结果不会同步返回,只能由用户主动拉取。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c2", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "异步消息处理(削峰填谷) 是什么?", "a": "应对偶发流量峰值的架构——高峰期把请求缓存进消息队列按系统正常速度消化,避免核心系统超载;代价是结果无法即时返回。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c3", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "存款准备金 是什么?", "a": "各银行存放在央行的资金。跨行转账不搬真钱,只需央行调整两家银行准备金的一减一增。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c4", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "清算机构 是什么?", "a": "记录日间全部跨行交易明细、日终计算各行净差额的机构,银联、网联、万事达均属此类。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c5", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "轧差 是什么?", "a": "把两家银行互欠金额相互抵消,日终只按净差额通过央行做一笔真实转账;本质是延时更大的批量异步处理。"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么#c6", "modNo": 2, "lect": "业务初探：扫了二维码之后发生了什么？", "q": "外汇零售与批发 是什么?", "a": "面向终端用户的小额换汇逐层向上汇聚成大额订单;顶层是巨型跨国商业银行做市商,通过交换不同币种的大额定息存折决定汇率。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c0", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "信息流 是什么?", "a": "想象中钱的流转,转移的是资金使用权(白天朋友间纸条记账);非银行机构没有物理现金,只能产生信息流。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c1", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "资金流 是什么?", "a": "钱的真实流转,转移的是所有权(晚上通过银行转账);只有银行和央行能完成。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c2", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "交易订单/支付订单 是什么?", "a": "交易订单同时含财产交换与物品交换两类信息;支付订单只记账号间的财产变动,是支付系统真正处理的对象。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c3", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "金融网关 是什么?", "a": "对接第三方支付/银行的二进制协议层,负责证书签名、加解密、协议传输与数据校验。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c4", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "智能路由 是什么?", "a": "金融网关对接多家支付机构,按可用性与费率动态选择通道。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c5", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "核算系统 是什么?", "a": "负责与第三方机构对账,并核对账务系统与业务系统的一致性,保证信息流与资金流最终同步。"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件#c6", "modNo": 2, "lect": "原理解读：如何理解第三方支付的业务逻辑和系统", "q": "备付金资金池 是什么?", "a": "把用户资金混存于支付公司银行账户,账面用虚拟账户区分你我;须持支付牌照设立,挪用受严格监管。"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点#c0", "modNo": 2, "lect": "产品大观：不同金融业务都有哪些技术实现要点？", "q": "信息不对称 是什么?", "a": "金融最核心的盈利原理;有的机构靠制造不对称赚钱(拆单),有的靠消除不对称赚钱(高频交易、公开市场)。"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点#c1", "modNo": 2, "lect": "产品大观：不同金融业务都有哪些技术实现要点？", "q": "资产证券化 是什么?", "a": "把房贷、消费贷等资产打包后按信用评级拆分成小包卖给投资人,分拆包装后总价值反而上升;次贷危机与花呗/借呗等背后都是这套资本运作。"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点#c2", "modNo": 2, "lect": "产品大观：不同金融业务都有哪些技术实现要点？", "q": "一级/二级市场 是什么?", "a": "一级是股东间私下交易,投行靠人脉撮合买卖,对系统要求不高;二级是交易所公开交易,靠海量成交发现合理价格,对系统要求极高。"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点#c3", "modNo": 2, "lect": "产品大观：不同金融业务都有哪些技术实现要点？", "q": "拆单 是什么?", "a": "把大额订单拆成小单分时发送以免冲击市场价格,本质是制造信息不对称;承载方是算法交易平台。"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点#c4", "modNo": 2, "lect": "产品大观：不同金融业务都有哪些技术实现要点？", "q": "高频交易 是什么?", "a": "以极低延时发现并利用他人的交易意图(如拆单后的连续小单),靠统计规律超短线获利。"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点#c5", "modNo": 2, "lect": "产品大观：不同金融业务都有哪些技术实现要点？", "q": "场外交易(OTC) 是什么?", "a": "交易所之外的交易,涵盖私下股票交易、外汇、证券化产品;没有公开市场发现价格,必须主动计算合同价值。"}, {"id": "04-04-领域驱动设计-上-如何设计金融软件顶层架构#c0", "modNo": 2, "lect": "领域驱动设计（上）：如何设计金融软件顶层架构", "q": "领域驱动设计(DDD) 是什么?", "a": "针对特定领域定制的战略设计,空间上覆盖整个行业领域,时间上覆盖软件全生命周期,角色上覆盖业务、产品、开发、运维全员;专门用于复杂问题。"}, {"id": "04-04-领域驱动设计-上-如何设计金融软件顶层架构#c1", "modNo": 2, "lect": "领域驱动设计（上）：如何设计金融软件顶层架构", "q": "领域语言 是什么?", "a": "全员直接沟通中沉淀出的对专业术语的共同理解,让各方沟通不再\"鸡同鸭讲\"。"}, {"id": "04-04-领域驱动设计-上-如何设计金融软件顶层架构#c2", "modNo": 2, "lect": "领域驱动设计（上）：如何设计金融软件顶层架构", "q": "核心领域 是什么?", "a": "能给公司带来行业内竞争优势的业务;判据是超额利润(超出行业平均水平的利润),且随时代与竞争对手漂移。"}, {"id": "04-04-领域驱动设计-上-如何设计金融软件顶层架构#c3", "modNo": 2, "lect": "领域驱动设计（上）：如何设计金融软件顶层架构", "q": "通用领域 是什么?", "a": "跨行业可用的能力(短信、安全、日志、存储),市场多有成熟产品,优先采购。"}, {"id": "04-04-领域驱动设计-上-如何设计金融软件顶层架构#c4", "modNo": 2, "lect": "领域驱动设计（上）：如何设计金融软件顶层架构", "q": "支持型领域 是什么?", "a": "辅助核心领域运转、不能跨行业通用(会计系统、市场数据系统),缺了不行但不是竞争力。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c0", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "实体 是什么?", "a": "有唯一标识符的业务对象,靠标识判断是否同一,从发行到到期有完整生命周期;债券、期权、现金流、利息都是实体。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c1", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "值对象 是什么?", "a": "只有值没有标识的对象,靠内部属性判等(金额=币种+数额);不可变,修改即替换;只能作为实体或值对象的附属属性(状态)存在。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c2", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "领域服务 是什么?", "a": "业务逻辑跨多个实体、不适合放进任何单个实体时的逻辑载体;金融领域要求无状态、无随机性,因此金融系统普遍采用不可变架构。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c3", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "聚合 是什么?", "a": "实体引用关系图中的一个子图,同时定义影响范围边界与存储边界(一个数据库事务);聚合根是唯一入口且必为实体。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c4", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "工厂 是什么?", "a": "负责业务对象的创建,与设计模式中的工厂作用一致,实现创建与使用分离。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c5", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "仓库 是什么?", "a": "负责业务对象的序列化存取;形态像 SOA 的数据访问层,但更关键的作用是防腐化层——隔离数据使用与数据存储,防外部协议变化入侵领域模型。"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型#c6", "modNo": 2, "lect": "领域驱动设计（下）：如何设计统一的金融业务模", "q": "防腐化层 是什么?", "a": "介于新旧系统之间,把老协议包装成新协议;外部变化入侵内部导致架构变差的过程即\"腐化\"。"}, {"id": "06-06-答疑集锦-一-思考题解析与外汇架构知识拓展#c0", "modNo": 2, "lect": "思考题解析与外汇架构知识拓展", "q": "垫资(Floating) 是什么?", "a": "公司在每个币种资金池中放入自有资金,把外汇交易分解为单币种收支,无需逐笔实时换汇。"}, {"id": "06-06-答疑集锦-一-思考题解析与外汇架构知识拓展#c1", "modNo": 2, "lect": "思考题解析与外汇架构知识拓展", "q": "外汇支付=两笔同币种交易 是什么?", "a": "买家人民币付给支付公司、支付公司美元付给卖家;关键是把两笔不同币种的支付订单关联,记录当时汇率与手续费便于日后对账。"}, {"id": "06-06-答疑集锦-一-思考题解析与外汇架构知识拓展#c2", "modNo": 2, "lect": "思考题解析与外汇架构知识拓展", "q": "司库(Treasury) 是什么?", "a": "企业资金管理部门,根据未来几天的外汇支付行为预测需要购换汇的金额。"}, {"id": "06-06-答疑集锦-一-思考题解析与外汇架构知识拓展#c3", "modNo": 2, "lect": "思考题解析与外汇架构知识拓展", "q": "POJO 的缺陷 是什么?", "a": "纯二进制数据形态缺乏对象行为,最缺的是逻辑校验能力,使用方必须重建全部业务验证逻辑,易出错。"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据#c0", "modNo": 3, "lect": "计算输入的正确性：怎么选择正确时间的数据？", "q": "发生时间(VT/valid time) 是什么?", "a": "数据所描述的业务事实对应的时间,如\"2018年3月的通胀率\"。解决\"这条数据说的是什么时候的事\"。"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据#c1", "modNo": 3, "lect": "计算输入的正确性：怎么选择正确时间的数据？", "q": "记录时间(TT/transaction time) 是什么?", "a": "数据进入系统的时间。解决\"这条数据什么时候开始可查\"。通胀率发生时间是3月,记录时间可能是4月甚至更晚。"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据#c2", "modNo": 3, "lect": "计算输入的正确性：怎么选择正确时间的数据？", "q": "单时序数据库 是什么?", "a": "常见的时序数据库只有一个时间轴,只能处理数据的增加;双时序数据库多一条记录时间轴,专门处理数据的修改与更正。"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据#c3", "modNo": 3, "lect": "计算输入的正确性：怎么选择正确时间的数据？", "q": "可见范围 是什么?", "a": "一个数据\"能被查到\"的查询坐标集合——查询时间落在该范围内,才能看到这条数据。它不是数据的固有属性,而是由查询结果反推定义的。"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据#c4", "modNo": 3, "lect": "计算输入的正确性：怎么选择正确时间的数据？", "q": "最近的合理数据 是什么?", "a": "查询时在\"既已录入(记录时间不晚于查询)、且已生效(发生时间不晚于查询)\"的数据中,取发生时间最晚的一条。这与金融口语中\"现在的股价\"的语义一致——金融数据离散,不存在真正的\"现在\"。"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据#c5", "modNo": 3, "lect": "计算输入的正确性：怎么选择正确时间的数据？", "q": "情景计算(Scenario Analysis) 是什么?", "a": "监管提出的假设性事件(挤兑、地震等)下重算合同。双时序让它只动记录时间、不动发生时间,从而与真实数据天然隔离。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c0", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "命令(Command) 是什么?", "a": "系统收到的外部指令,如转账请求。命令先做合理性检查,可能被拒绝,因此不保证执行。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c1", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "事件(Event) 是什么?", "a": "命令检查通过后的结果,是\"一定执行、执行一定成功\"的事实用过去式表示(\"moved right\" vs \"move right\")。检查不通过可不生成事件,或生成不改变状态的空事件(NOP)以保留痕迹。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c2", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "状态(State) 是什么?", "a": "事件执行改变的对象与结果,如账户余额。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c3", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "自动机 是什么?", "a": "把事件队列当作无限磁带、从头逐条读取并改变状态的经典计算模型,是事件溯源的执行引擎。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c4", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "时光机 是什么?", "a": "重置自动机并重放事件,可精确恢复到任意历史时点的状态;既支撑审计(\"为什么\"),也支撑容灾。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c5", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "快照(Snapshot) 是什么?", "a": "把当前状态连同对应事件位置存入文件;恢复时先加载快照再重放其后事件,使恢复时间只取决于快照之后的事件数。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c6", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "CQRS 是什么?", "a": "读写分离。写组件只管命令与事件,查询由独立的\"读模式自动机\"(只执行事件不处理命令)提供。"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构#c7", "modNo": 3, "lect": "计算过程的正确性：如何设计正确的数据处理架构", "q": "不可变架构 是什么?", "a": "事件溯源所属的更大架构族,数据一律不可变,分为事件与状态两类。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c0", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "内容正确性 是什么?", "a": "上游对数据内容负责——用双时序查对时间,加 HMAC 防传输/读取损坏,加版本号标识数据格式以支持升级后的向下兼容。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c1", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "线性一致性 是什么?", "a": "不乱序的理论要求(第13讲展开)。实现上与 TCP 同思路:消息带自增 ID,接收端把提前到达的消息放入缓冲区,等目标 ID 出现再按序取出。多 TCP 链路/多路由下单靠 TCP 不够,需应用层重做。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c2", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "至少一次(At-least-once) 是什么?", "a": "非确定性网络下回执本身也可能丢,发送方只能持续重发直到收到至少一次回执。由\"事务记录回执状态+幂等更新回执位\"两个保证支撑。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c3", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "幂等性 是什么?", "a": "同一操作执行多次与一次结果相同(如把回执位反复置为成功)。去重就是让消息处理幂等化。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c4", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "去重与唯一ID 是什么?", "a": "至少一次必然带来重复,靠唯一 ID 只处理第一条。ID 来源:自增 ID(需消息系统可控格式)、业务属性(支付订单号)、与业务无关的数据库主键或摘要(MD5/SHA1)。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c5", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "函数式编程 是什么?", "a": "数据不可变、函数无随机,函数可像积木一样组合而不破坏正确性(Composibility),程序不因代码增长而失去正确性。金融大规模使用:Slang/SecDB(高盛)、A+/Scala(大摩)、OCaml(Jane Street)、Haskell(渣打)。"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的#c6", "modNo": 3, "lect": "计算结果的正确性：怎么保证计算结果是正确的？", "q": "异步验证与日切对账 是什么?", "a": "事后验证不阻塞对外输出,错了靠业务补偿(补账),日切/对账即异步验证的落地形态。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c0", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "交易数据 是什么?", "a": "订单等事务型数据,传输要满足上一讲的顺序正确性与恰好一次(不乱序+去重)。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c1", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "市场数据 是什么?", "a": "全市场成交信息(行情)。算法平台关心的是所有人的行情而非自己的成交,故不需要事务保证,允许丢数据——这是选型自由的来源。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c2", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "漏桶算法 是什么?", "a": "请求进固定容量桶,匀速消费,桶满丢弃。适合强制平滑对外发送速度(券商对交易所)。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c3", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "令牌桶算法 是什么?", "a": "系统匀速放令牌,消费消息需耗令牌;放令牌速度决定平均速率,桶容量决定峰值处理能力。适合总流量限流时做微调(交易所)。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c4", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "订阅发布(Pub/Sub) 是什么?", "a": "每个消费者独立收到全部消息,各自按相同顺序处理(如 Kafka、Google Cloud Pub/Sub 的原始设计)。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c5", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "消息(Messaging) 是什么?", "a": "所有消费者共享消息,各自只处理一部分,单视角看消息是断续的(ActiveMQ、SQS、RabbitMQ、RocketMQ 的原始设计)。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c6", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "时效性 是什么?", "a": "不同时间的数据价值不同。市场数据越新越值钱、旧数据价值衰减快,因此允许丢失——丢失后等一会儿其重要性自然下降。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c7", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "ISR(同步数) 是什么?", "a": "Kafka 同步副本数,设为0即放弃同步等待,牺牲容灾换处理速度。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c8", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "席位费 是什么?", "a": "交易所对低延时实时数据的收费分级;同机房托管可把光速延时压到忽略不计,但位置稀缺、天价。"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求#c9", "modNo": 3, "lect": "数据传输的质量：金融业务对数据传输有什么要求", "q": "FIX 协议 是什么?", "a": "金融专用二进制通讯协议;利用行情连续两条大部分相同的特性只传变化部分,思想同视频压缩关键帧。"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗#c0", "modNo": 3, "lect": "数据存储的合理性：金融业务可以不用关系型数据", "q": "数据分类三象限 是什么?", "a": "按数据间关系复杂度——无关系(市场数据)、树状(业务数据)、网状(图数据),分别对应时序、关系型、图数据库。选型先分类,再匹配。"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗#c1", "modNo": 3, "lect": "数据存储的合理性：金融业务可以不用关系型数据", "q": "行存储 vs 列存储 是什么?", "a": "存储设备是一维的,二维数据矩阵必须降维。行存横向切割,每行整体存取,查某几列也要加载整行;列存纵向切割,只加载需要的列,大量 IO 被省掉。市场数据求\"某段时间某几列\"的聚合,天然适合列存。"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗#c2", "modNo": 3, "lect": "数据存储的合理性：金融业务可以不用关系型数据", "q": "KDB 是什么?", "a": "金融行业最强的列存储数据库,自带函数式语言 Q(源自大摩的 A+、数学语言 A,与 Lisp 同族)。Q 中数据不可变、函数无随机,函数可视为参数到返回值的 Map;表与 Map 通过 flip 互转(列名即键)。实时编译 Q 以使用 CPU 向量指令,一条指令处理多个同类型数据。"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗#c3", "modNo": 3, "lect": "数据存储的合理性：金融业务可以不用关系型数据", "q": "双时序数据库 vs 时序数据库 是什么?", "a": "名字相近实现迥异。双时序多一维时间,无法按列存储、无法用向量指令加速,吞吐上不去,不适合股票外汇等高频业务,适合债券、期货、资产证券化等场外业务;无通用产品,是大型金融公司自研的核心竞争力(实现难点在时间索引,可用空间树)。"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗#c4", "modNo": 3, "lect": "数据存储的合理性：金融业务可以不用关系型数据", "q": "对象关系阻抗不匹配 是什么?", "a": "面向对象的关系是图(图论),关系库的模式是同构列表的集合(集合论),把对象存入关系库等于把图论翻译成集合论,天然别扭;且对象有封装与行为,库里只有原始数据,抽象层次不同。"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗#c5", "modNo": 3, "lect": "数据存储的合理性：金融业务可以不用关系型数据", "q": "NewSql(旧称 NoSql) 是什么?", "a": "解决两个问题——高并发高流量、树状数据存储。对象可作为原子单元(如 JSON)存储,缓解阻抗不匹配;但分布式架构下二级索引只能最终一致,查询可能不准。"}, {"id": "11-11-系统优化-如何让金融系统运行得更快#c0", "modNo": 3, "lect": "系统优化：如何让金融系统运行得更快？", "q": "边际成本与\"快\"的定义 是什么?", "a": "互联网业务边际成本≈0,倾向大规模扩张→海量用户→大流量→\"快\"指集群吞吐;机构金融要做 KYC、业务/财务/合规流程,无法规模扩张,只能拼质量→时间就是金钱→\"快\"指延时低。普惠金融(支付、小额信贷)归互联网一边。"}, {"id": "11-11-系统优化-如何让金融系统运行得更快#c1", "modNo": 3, "lect": "系统优化：如何让金融系统运行得更快？", "q": "分库分表 是什么?", "a": "将表横向/纵向切割后分散到多机,用更多硬件扛流量。切分要 MECE:子表互不重复(独立)且不丢数据(穷尽)。水平切分两法:按主键哈希(打散流量,但连续访问差)与按主键范围(区间连续对市场数据友好,但热点集中)。"}, {"id": "11-11-系统优化-如何让金融系统运行得更快#c2", "modNo": 3, "lect": "系统优化：如何让金融系统运行得更快？", "q": "消息队列削峰填谷 是什么?", "a": "流量先写入队列,服务器按自身能力匀速拉取,峰值流量不再压垮系统。队列写入上限很高,通常不构成瓶颈。"}, {"id": "11-11-系统优化-如何让金融系统运行得更快#c3", "modNo": 3, "lect": "系统优化：如何让金融系统运行得更快？", "q": "担保账号异步化 是什么?", "a": "秒杀付款先入担保账号而非直连卖家;中间账号扣款可延迟、甚至丢了靠日切对账补账,因此可异步处理,秒杀期只做买家账号一半的写操作。"}, {"id": "11-11-系统优化-如何让金融系统运行得更快#c4", "modNo": 3, "lect": "系统优化：如何让金融系统运行得更快？", "q": "单线程优化 是什么?", "a": "多线程赢在资源多,但线程调度要更新内核结构与 CPU 缓存,\"准备资源本身消耗资源\";单线程+绑核(sched_setaffinity)+isolcpus 独占 CPU 可反超。"}, {"id": "11-11-系统优化-如何让金融系统运行得更快#c5", "modNo": 3, "lect": "系统优化：如何让金融系统运行得更快？", "q": "epoll 是什么?", "a": "Linux 独有,同时监听海量连接,就绪才通知,解决 C10K;但读写仍要用户态自己调内核函数,状态切换开销大。"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化#c0", "modNo": 3, "lect": "思考题解析与账务系统优化", "q": "矩形切割存储(06题) 是什么?", "a": "双时序坐标空间按新增数据点做水平垂直切割成矩形,索引建在矩形左下/右上角坐标上。空间复杂度 O(n²),查询 O(log n) 或 O(1)——高存储成本正是双时序只适合低吞吐场外业务的原因(呼应第10讲)。"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化#c1", "modNo": 3, "lect": "思考题解析与账务系统优化", "q": "完整性检测(07题) 是什么?", "a": "索引文件每条末尾存\"此前所有内容的校验码\";事件文件的校验码(MD5/SHA1/HMAC)放在对应索引里,两文件联合检测。线性写文件损坏只在末尾:索引文件先裁剪到单条索引大小的整数倍,再从末尾逐条校验、不完整即丢弃。"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化#c2", "modNo": 3, "lect": "思考题解析与账务系统优化", "q": "逻辑时间(08题) 是什么?", "a": "让去重 ID 之间满足线性关系(任意可比、可传递,且后生成者更大),ID 反映事件顺序。ID 带时间/自增成分后,归档删除形成连续区间,只需判断新 ID 是否落在已删区间即知是否可能重复;由业务系统保证逻辑时间正确。"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化#c3", "modNo": 3, "lect": "思考题解析与账务系统优化", "q": "实时数据速度协调(09题) 是什么?", "a": "实时数据过期即失效,不能进队列缓存补发(补发的已不是实时服务)。接收方处理不过来就丢弃,并返回丢弃通知让发送方降速,稳定后回升——思想同 TCP 带宽探测。"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化#c4", "modNo": 3, "lect": "思考题解析与账务系统优化", "q": "合并存储(加餐) 是什么?", "a": "账务状态是简单 K/V,可在生成事件的同时\"假装执行\"得到前后余额,把事件与前状态、后状态一起存储。"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化#c5", "modNo": 3, "lect": "思考题解析与账务系统优化", "q": "对账链(加餐) 是什么?", "a": "两条不变式——前一事件的最终余额=后一事件的初始余额;事件最终余额=初始余额+变动金额。把相邻余额、事件前后余额链接成链,任一状态可沿链校验全部变动过程。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#q0", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "三种事务冲突分别是什么？各对应哪个隔离级别的哪次修复？", "a": "读写/写读/写写；RU 修写写、RC 修写读、RR 修读写"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#q1", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "可串行化与冲突可串行化是什么关系？为什么数据库常用后者？", "a": "后者是前者的充分不必要条件/子集；因为基于锁的实现天然只能做到冲突可串行化"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#q2", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "2PL 为什么能保证冲突可串行化？它的使用局限是什么？", "a": "最早解锁者可在解锁前与其他事务无冲突互换而提前；需提前知道全部访问数据，释放锁后不能再加锁"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#q3", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "快照里的数据为什么必须排除\"未开始\"的事务？", "a": "事务运行期间还有新事务陆续进入，其数据不属于该时刻的正确状态"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#q4", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "快照隔离的实现要点是什么？", "a": "MVCC 多版本只增不改、删除打标签、隐藏列记录事务、查询按已完成事务过滤版本"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c5", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "冲突 是什么?", "a": "两个操作作用于同一对象且至少有一个是写操作。排除双读情形后，冲突只有读写、写读、写写三种；写读冲突要求写事务回滚才暴露问题，读写冲突则要求写事务提交。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c6", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "隔离级别（Isolation Level） 是什么?", "a": "对\"不正确\"程度的分级。经典出处是 1995 年论文《A Critique of ANSI SQL Isolation Levels》，每一级比低一级多解决一种冲突。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c7", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "可串行化（Serializability） 是什么?", "a": "并发事务的最终结果永远等价于它们按某个顺序一个接一个执行的结果。\"永远\"指对任意初始值都成立；\"某个\"意味着等价顺序不必唯一，所以可串行化自带一定随机性。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c8", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "冲突可串行化（Conflict Serializability） 是什么?", "a": "更强(更苛刻)的等价定义——要求能通过一系列\"无冲突互换\"把原执行序列调整为串行执行。它是可串行化的充分条件，其集合是可串行化的真子集；有些可串行化的调度无法通过无冲突互换达成。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c9", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "2PL（Two Phase Lock） 是什么?", "a": "两阶段锁。事务先对所有要访问的资源加排它锁，访问完再统一释放，加锁与解锁不交替。注意与 2PC（两阶段提交）完全是两回事。它能实现冲突可串行化，但要求事务提前知道要访问哪些数据，释放任一锁后不能再加新锁。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c10", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "快照隔离（Snapshot Isolation） 是什么?", "a": "事务开始时为所有\"正确\"数据打一个不可变快照，此后读写互不干扰、无锁等待。正确=只包含已完成事务的数据，排除进行中和尚未开始的事务。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c11", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "MVCC（Multi-Version Concurrency Control） 是什么?", "a": "快照隔离的典型实现。数据只增不改，修改分解为\"删旧标新增\"，删除只是打标签由垃圾回收器择机回收；每行有隐藏列记录修改事务，查询时自动附加\"只取已完成事务版本\"的条件，快照其实并未真正拷贝数据。"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性#c12", "modNo": 4, "lect": "正确性分级（上）：单机无备份有哪几种不同的一", "q": "SSI（Serializable Snapshot Isolation） 是什么?", "a": "串行化快照隔离，在快照隔离上增加提交时检查读写、写读冲突的乐观机制，冲突少时性能好，冲突频繁时会在长时间运行后回滚、浪费资源。"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#q0", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "2PC 两个阶段各自做什么？什么条件下进入回滚？", "a": "阶段一准备提交并反馈；阶段二统一下发提交或回滚；任一准备失败或长时间无响应即回滚"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#q1", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "为什么 2PC 需要数据库新增\"准备成功\"状态？", "a": "第一阶段不提交也不能直接丢弃，需要一个未完成的中间事务状态，第二阶段凭此提交或回滚"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#q2", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "TCC 相对 2PC 的优缺点是什么？", "a": "每阶段完整本地事务、锁时间短；代价是业务双份实现、中间态可见、需处理空回滚与防悬挂"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#q3", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "TCC 的取消为什么不能叫回滚？", "a": "Try 阶段事务已真正提交，数据库层面不可回滚，只能用反向业务做补偿"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#q4", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "协调者的单点问题指什么？", "a": "协调者全局事务数据库保存全部分布式事务状态，它一出问题全局事务就无法决策"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#c5", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "分布式事务（Distributed Transaction） 是什么?", "a": "跨多个独立数据库的事务，目标是让整体表现如一个可串行化的事务。实现思路是用单机事务的正确性支撑全局事务的正确性。"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#c6", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "协调者（Coordinator） 是什么?", "a": "唯一与所有参与机器通信、收集局部状态并做全局决策的角色，可以是一台独立机器，也可以是集群中的一员。协调者的本地数据库保存全局事务状态，其事务能力决定整个分布式事务的能力。"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#c7", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "2PC（两阶段提交） 是什么?", "a": "数据库级分布式事务。第一阶段协调者发\"准备提交\"，各节点做预处理(加锁、改数据)但不提交，返回准备结果；第二阶段按全局结果统一下发提交或回滚。前提假设：节点间无直接交流、网络可能丢消息或回执。"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#c8", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "准备成功状态 是什么?", "a": "为支持 2PC，单机数据库在\"开始\"与\"完成\"之外新增的中间事务状态——预处理完成但未提交，所以第二阶段\"回滚\"并不违反已提交事务不可回滚的原则。"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#c9", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "TCC（Try-Confirm-Cancel） 是什么?", "a": "业务层分布式事务。Try 阶段各节点执行并真正提交本地事务并上报；Confirm 阶段做确认动作；Cancel 阶段用反向业务对冲第一阶段的业务效果。Cancel 是业务补偿(事务补偿)，不是数据库回滚，因此每个业务要实现正反两套。"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现#c10", "modNo": 4, "lect": "正确性分级（中）：多机无容灾有哪几种不同的一", "q": "空回滚 是什么?", "a": "允许对\"根本没收到 Try\"的事务执行 Cancel(取消一个不存在的事务)，并在系统中留下记录；此后迟到的 Try 看到该记录必须失败——这就是防悬挂。三者合起来解决 Try 与 Cancel 消息乱序问题。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#q0", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "CAP 为什么不是三选二？它的一致性实际指什么？", "a": "分区容错是故障前提，只能 CP/AP 二选一；一致性实指线性一致性"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#q1", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "线性一致性的定义包含哪几步？", "a": "重排操作消除时间重叠、非重叠操作先后不可反、按业务逻辑验证串行结果是否合理"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#q2", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "自读自写为什么还需要单调写配合？", "a": "自读自写只保证所有写入都已完成，不保证各节点写入顺序一致"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#q3", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "先读后写与其他三种会话一致性的本质区别？", "a": "它是唯一跨会话的一致性，约束两个用户间的写因果顺序"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#q4", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "分布式严格可串行化由什么组成？为什么不常用？", "a": "可线性化+可串行化，串行顺序唯一且随真实时间；效率极低"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c5", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "分区容错性（Partition Tolerance） 是什么?", "a": "网络故障把连通的机器割裂成独立部分，即脑裂。CAP 的真实含义是在脑裂发生后只能在一致性与可用性中二选一(CP 或 AP)，而不是流传甚广的\"三选二\"。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c6", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "可见性（Visible） 是什么?", "a": "机器 A 上的修改经过一段时间反映到机器 B 上，即该修改在 B 可见；之后就能在 B 上使用该结果。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c7", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "最终一致性（Eventual Consistency） 是什么?", "a": "修改在所有机器上最终都可见。\"最终\"借数学极限概念——时间趋于无穷时未复制到数据的机器数降为零；但对\"多久算最终\"没有工程可用的定义，指导意义有限。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c8", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "会话（Session） 是什么?", "a": "用户的唯一标识符，是客户端概念而非服务端概念。容灾下同一用户的请求会落到不同机器，需要保证体验与单机一致，因此引出四种会话一致性。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c9", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "单调写一致（Monotonic Write） 是什么?", "a": "所有节点记录的写入顺序与用户写入顺序完全一致。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c10", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "单调读一致（Monotonic Read） 是什么?", "a": "不是要求读顺序一致，而是与写有关——同一用户后一次读不能读到比前一次读更旧的值。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c11", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "自读自写（Read Your Write） 是什么?", "a": "能读回自己过去写入的全部值，要求读节点保存该会话的全部写入记录；但\"写都完成了\"不等于\"写顺序正确\"，需配合单调写。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c12", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "先读后写（Write Follow Reads） 是什么?", "a": "唯一跨会话的一致性。若读到别人的写，则自己的写必须定序在那个写之后，保证因果先后。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c13", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "线性一致性（Linearizability） 是什么?", "a": "分布式系统最重要的一致性，可视为分布式版的可串行化。要求能把所有操作按时间重排成互不重叠的顺序执行；未重叠的操作先后顺序不可颠倒；重排后还需按业务逻辑验证结果正确，全部排列都错才算违反。"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性#c14", "modNo": 4, "lect": "正确性分级（下）：多机有容灾有哪几种不同的一", "q": "严格可串行化（Strict Serializability） 是什么?", "a": "可线性化 + 可串行化。要求事务等价于唯一一个串行顺序——原事务结束越早，在串行序中越靠前，消除了可串行化\"某个顺序\"的随机性；代价是效率极低，很少使用。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#q0", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "FLP 结论的精确表述是什么？两个前提是什么？", "a": "完全异步且至少一台机器可能故障时，不存在非随机共识算法"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#q1", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "共识三条件分别约束什么？有效性为什么必要？", "a": "终止性:活着的机器最终唯一输出；一致性:输出全相同；有效性:排除恒定输出的平凡算法"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#q2", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "三步证明分别证明什么？", "a": "存在非确定初始状态；非确定状态可延续到中间状态；无限延续违反终止性"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#q3", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "为什么异步消息的\"可任意延迟\"是证明的核心？", "a": "允许把关键消息挪后，不断制造新的非确定状态，使系统永不收敛"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#q4", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "现实中的共识算法如何绕开 FLP？", "a": "引入时钟做失败检测/超时判断，消除完全异步前提"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c5", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "FLP 结论 是什么?", "a": "《Impossibility of Distributed Consensus with One Faulty Process》确立的不可能性定理(2001 年获 Dijkstra 最具影响力论文奖)。完全异步系统中只要有机器可能故障，就不存在非随机的共识算法。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c6", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "终止性（Termination） 是什么?", "a": "每个仍正常运行的机器最终都要确定唯一结果，一个不落；结果一旦做出不可更改；对故障机器无任何要求。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c7", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "一致性（Agreement） 是什么?", "a": "所有还活着的机器输出的结果完全相同(全 0 或全 1)。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c8", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "有效性（Validity） 是什么?", "a": "每个可能的值都可能成为共识结果。它排除了\"永远输出 0\"这类平凡算法——那虽满足终止与一致，却毫无意义。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c9", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "确定性/非确定性状态 是什么?", "a": "若能从某状态预先算出共识结果，该状态是确定性的；若结果取决于某台机器是否在线，则是非确定性的。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c10", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "路径 是什么?", "a": "系统状态变化的顺序，相邻两次状态变化之间恰好是新接收的一条消息。"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法#c11", "modNo": 4, "lect": "分布式正确性的存在性（上）：什么情况下不存在", "q": "失败检测器 是什么?", "a": "能判断某台机器是否出问题的机制(由时钟实现)，具有完整性与准确性两个属性，各分强弱共四种；后两篇 1996 年论文证明：即使很弱的失败检测也足以实现共识，而\"能最终做准确判断的不准确时钟\"是共识存在的充要条件。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#q0", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "共识算法通俗地解决什么问题？给出的确切结论是什么？", "a": "跨机同步不断增加的文件；只要多数机器正常工作，机器上的文件完全一致"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#q1", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "全序广播有哪两个条件？适合什么场景？", "a": "消息不丢、全机顺序一致；数据库日志容灾、会计账本备份"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#q2", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "为什么共识、全序广播、线性化存储可视为同一件事？各自怎么互推？", "a": "三者等价；线性化存储借分布式锁广播消息、全序广播借分布式状态机判定加锁命令"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#q3", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "客户端使用 Raft 的三条纪律是什么？", "a": "只访问主节点；失联轮询找主并跟随提示；不确定一律按失败重发且依赖服务端去重"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#q4", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "任期机制如何同时实现压制与选主？", "a": "主用心跳广播递增任期压制从节点；失主后节点自荐候选、任期+1 征求投票，半数以上同意即当选"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c5", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "共识（Consensus） 是什么?", "a": "多台机器就结论达成统一。通俗版：能在多台机器间同步一个内容不断增加的文件；保证是——只要多数机器正常工作，这些机器上的文件完全一样。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c6", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "全序广播（Total Order Broadcast） 是什么?", "a": "两个条件——消息一个不丢(某机出现的消息其他机器都有)，且所有机器记录的消息顺序完全一致。等于不仅要同步文件，还要同步文件内容的顺序。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c7", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "线性化存储（Linearizable Storage） 是什么?", "a": "第 14 讲\"可线性化\"理论的工程实现——一个分布式存储集群，用户在其上的操作序列可重排为无重叠的顺序执行且结果合理。标志性应用是分布式锁：在一台机器上拿到锁，等于在所有机器上都拿到了锁。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c8", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "分布式状态机 是什么?", "a": "事件溯源(第 7 讲)的分布式版本。命令经全序广播到达各机，各机自动机判定命令合理性后生成事件、更新状态，用于从全序广播构造线性化存储。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c9", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "主从节点（Leader and Follower） 是什么?", "a": "任一时刻集群最多一个主节点，是唯一处理请求的节点，负责把请求同步给从节点；主从角色会变化，但同一时刻最多一个主。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c10", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "候选节点（Candidate） 是什么?", "a": "未来的主节点。节点发现集群疑似无主时自荐为候选并发起选主；系统中可同时存在多个候选。"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法#c11", "modNo": 4, "lect": "分布式一致性（下）：怎么理解最简单的分布式一", "q": "任期（Term） 是什么?", "a": "不断递增的正整数，历任主节点任期严格递增。正常时主节点用心跳广播任期压制其他节点保持从属；主节点失联时各节点自荐候选，把最后任期数加一征求投票，获半数以上同意即当选为主。"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#q0", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "为什么容灾要复制事件队列而不是命令队列？", "a": "命令转事件有随机性，同命令换主后可能生成不同事件；复制事件才能全序一致"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#q1", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "常规查询从主节点还是从节点复制事件？各自代价？", "a": "主节点最新但压力大；从节点压力小但延时大"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#q2", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "一致性读如何实现、达到什么级别？", "a": "查询作空命令/事件发写节点经共识排序，结果经反向代理返回；线性一致性"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#q3", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "分库后反向代理要怎么变？", "a": "升级为路由，维护全局路由信息"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#q4", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "分布式事务协调者的单点问题怎么解？", "a": "复制状态机：操作日志经共识算法同步到多机恢复状态"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#c5", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "复制状态机 是什么?", "a": "用共识算法把同一份日志（这里是事件队列）按相同顺序复制到多台机器并各自执行，各节点状态完全一致；是有状态系统容灾的标准形态。"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#c6", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "全序广播 是什么?", "a": "所有节点以相同顺序看到相同消息序列；它是\"替换节点与主节点完全一致\"的机制基础，由一致性算法提供。"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#c7", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "反向代理 是什么?", "a": "集群对用户的统一代表，负责维持 TCP 长连接、转发请求与回传结果；用它向用户隐藏\"事件溯源是一组机器、且主节点可能中途更换\"的细节。"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#c8", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "读模式状态机 是什么?", "a": "只复制事件队列从而复制出状态、专门服务查询的节点；分布式下可从任一已同步节点获取事件。"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#c9", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "一致性读（Consistent Read） 是什么?", "a": "把查询当作空的命令和事件发给写节点、走共识排序，用线性一致性覆盖读模式满足不了的单调读一致与自读自写。"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构#c10", "modNo": 4, "lect": "正确性案例（上）：如何实现分布式的事件溯源架", "q": "分库路由 是什么?", "a": "分库后各节点只能处理部分业务，反向代理必须升级为维护全局路由信息的路由节点。"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#q0", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "Redis 靠什么做到低延迟？分别牺牲了什么？", "a": "单线程+epoll、异步主从、RDB；牺牲单调读/自读自写与数据完整性"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#q1", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "LSM 树为什么写快读慢？", "a": "更新变文件末尾追加；查询需自上而下逐层找，层多了出现锯齿延时"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#q2", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "Spanner 如何让 2PC 协调者不成为单点？", "a": "协调者即 Paxos 主节点，本身具备共识容灾"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#q3", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "TiDB 为什么要 TiFlash、它怎么同步数据？", "a": "列存优化分析场景；以读模式从 TiKV 主节点复制日志"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#c4", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "SSTable 是什么?", "a": "存储在文件里的 Map，键为字符串且按升序排列；是最小的文件型存储单元。"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#c5", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "LSM 树 是什么?", "a": "多个 SSTable 自上而下分层组成，查询从最上层往下逐层找；更新不改旧文件、只在最上面新建一个 SSTable，把\"修改\"变成\"新增\"，因此写极快、读偏慢。"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#c6", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "RDB / AOF 是什么?", "a": "Redis 的两种本地备份——RDB 定期把内部状态快照到硬盘（快但两次快照间的数据无法恢复），AOF 实时追加操作日志（完整但持续写盘）。"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#c7", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "日志即状态 是什么?", "a": "数据库操作日志可恢复状态，经共识算法（Paxos/Raft）全序广播同步到多机、各自回放，就得到分布式状态机；这是 Spanner 与 TiDB 的共同根基。"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么#c8", "modNo": 4, "lect": "正确性案例（中）：常见分布式数据方案的设计原", "q": "TiKV / TiFlash 是什么?", "a": "TiDB 把行存储（事务、LSM+Raft）与列存储（分析、B+树、读模式）拆成两个独立组件，分别优化写与分析。"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#q0", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "动态分库的三个架构目标？", "a": "尽量少停机、尽量与业务无关、尽量自动化"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#q1", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "存量与增量分别靠什么解决？", "a": "快照解决存量，命令队列解决增量，状态机保证一致性"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#q2", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "分库命令执行后 A、B 各发生什么？", "a": "A 改配置拒收 B 的业务并报错；B 改配置启用自己的业务；都通知协调者"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#q3", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "下游发现分库的两种方式及取舍？", "a": "协调者推送被动获知 vs 解析分库命令主动发现；下游类型多则主动方案开发成本大"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#c4", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "协调者 是什么?", "a": "分库过程的自动化组件，记录当前分库阶段、向各节点发送指令，本地数据库维护全部分库描述信息。"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#c5", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "分库命令 是什么?", "a": "写入命令队列的特殊命令，记录分库后 A/B 各自负责哪些业务；不涉及存储格式与增改逻辑，几乎与业务无关。"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#c6", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "读模式追赶 是什么?", "a": "新集群 B 先复制老集群 A 的快照恢复到某时间点，再以 A 的读模式身份持续同步命令队列，把差距缩到几秒。"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库#c7", "modNo": 4, "lect": "正确性案例（下）：如何在运行时进行数据系统的", "q": "错误重定向 是什么?", "a": "集群收到不属于自己业务的消息时返回错误并给出正确去处提示，上游据此动态更新路由。"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#q0", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "正确容灾的两个维度是什么？哪个风险更不可控？", "a": "SLA 与事务原子性；事务正确性出问题风险不可控"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#q1", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "两地三中心与三地五中心分别能扛什么级别的故障？", "a": "机房级故障 / 城市级故障"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#q2", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "为什么监控数据本地异步备份就够？", "a": "监控数据时效衰减快、允许部分丢失，高成本容灾不划算"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#q3", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "单机断电丢数据的两个处理方向？", "a": "企业级带电池硬盘保落盘；或把断电当单节点故障处理，如 Kafka"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#c4", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "SLA（服务质量协议） 是什么?", "a": "规定一定时限内必须恢复服务；违约按合同金额赔偿，风险可控。"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#c5", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "事务正确性（原子性） 是什么?", "a": "金额操作要么全成要么全不成；出错（半截过户、重复打款）带来不可控的经济风险，比 SLA 违约更危险。"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#c6", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "监控伪报 是什么?", "a": "监控系统报某服务不可用，但服务实际正常运行（如防火墙配置错误导致状态和指令都发不通）；容灾处理必须在这种情形下仍然正确。"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#c7", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "幂等性 是什么?", "a": "同一请求重复执行结果不变，靠消息内唯一标识或天然幂等的 K/V 结构实现，用来解决容灾期间的消息重发。"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#c8", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "两地三中心 是什么?", "a": "3 个 Raft 节点分布在两个城市的 3 个数据中心（2+1），只能扛单数据中心故障。"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾#c9", "modNo": 4, "lect": "容灾（上）如何实现正确的跨机房实时容灾？", "q": "三地五中心 是什么?", "a": "5 个节点基本平分到 3 个城市的数据中心，任一城市故障仍有多数派在线，达到城市级容灾。"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#q0", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "为什么不能证明 Raft 是正确的？", "a": "涉及无限状态，形式化证明只覆盖有限状态；实现正确性不会高于理论"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#q1", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "混沌工程与测试的本质区别？", "a": "测试已知答案、肯定正确性；混沌未知结果、理解系统，用假设"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#q2", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "SLA、SLO、SLI 的关系？", "a": "SLA 包含 SLO 与 SLI；SLI 是监控对象，SLO 是指标目标"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#q3", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "什么是伤害半径、如何控制？", "a": "实验故障影响范围；从测试环境逐级升级到生产灰度小规模"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#c4", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "证有不证无 是什么?", "a": "逻辑上只能证明问题存在（找到一只黑天鹅即可），无法穷举证明问题不存在；因此放弃证明\"没有 bug\"，改为证明\"能找到 bug\"。"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#c5", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "置信区间 是什么?", "a": "正确性是概率概念——找 bug 成本超过收益时停止投入，此时\"系统不太会出大问题\"是统计意义上的信心，而非绝对保证。"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#c6", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "混沌系统 是什么?", "a": "组成部分超过 3 个后行为趋向非线性（不可预测）；混沌工程的对象就是这类系统，且\"系统\"不只软件，还包括硬件、运维系统、监控系统与开发/运维/值班人员。"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#c7", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "自变量/因变量/假设 是什么?", "a": "自变量是可控制的扰动（如拔掉硬盘），因变量是被自变量影响的对象（如告警、高可用），假设描述两者的影响关系。"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#c8", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "伤害半径（Blast Radius） 是什么?", "a": "实验故障的影响范围，要控制得尽量小；实验从测试环境逐级升级到生产灰度。"}, {"id": "21-21-容灾-下-如何通过混沌工程提高系统稳定性#c9", "modNo": 4, "lect": "容灾（下）：如何通过混沌工程提高系统稳定性？", "q": "Jepsen 测试 是什么?", "a": "面向分布式系统正确性的混沌测试，实验后收集各节点数据验证结果正确性；与混沌工程几乎一样，只是 SLO 定义在正确性（目标 100%）上。"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少#q0", "modNo": 5, "lect": "分布式金融系统知识，你掌握了多少？", "q": "12306 与淘宝的峰值对比说明了什么？", "a": "QPS 与 TPS 是不同问题，量级对比没有架构意义"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少#q1", "modNo": 5, "lect": "分布式金融系统知识，你掌握了多少？", "q": "为什么说火车票是动态 SKU？", "a": "卖出一段区间的票会同时改变多个相关区间的可售组合，还叠加选座维度"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少#q2", "modNo": 5, "lect": "分布式金融系统知识，你掌握了多少？", "q": "春运卖票业务的负载结构是什么？", "a": "查询量每秒百万级、交易 TPS 只有几百到几千，读写严重不对称"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少#q3", "modNo": 5, "lect": "分布式金融系统知识，你掌握了多少？", "q": "本期两道主观题分别考察什么能力？", "a": "重查询业务的读写分析、弱网下多端状态一致的设计"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少#c4", "modNo": 5, "lect": "分布式金融系统知识，你掌握了多少？", "q": "动态 SKU 是什么?", "a": "电商商品库存是静态的，火车票则随任意起终点区间组合动态增减——卖出一张短途票会同时改变多个区间的可售状态，还叠加选座维度，数据量可达普通电商的数百倍。"}, {"id": "00-春节策划第1期-分布式金融系统知识-你掌握了多少#c5", "modNo": 5, "lect": "分布式金融系统知识，你掌握了多少？", "q": "查询量与交易量分离 是什么?", "a": "点击量（QPS）与交易量（TPS）是两类完全不同的问题，前者可高出后者多个数量级，二者的架构优化路径也不同，量级不能直接比较。"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书#q0", "modNo": 5, "lect": "读书如抽丝，为你推荐一些我读过的好书", "q": "为什么作者首选英文原版教材？", "a": "翻译是再创作，无法区分问题出在原作者还是译者"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书#q1", "modNo": 5, "lect": "读书如抽丝，为你推荐一些我读过的好书", "q": "DDIA 的正确读法是什么？", "a": "通读建立框架，再按各章末尾的论文列表深入每个知识点"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书#q2", "modNo": 5, "lect": "读书如抽丝，为你推荐一些我读过的好书", "q": "经济类与金融类书单的定位差异？", "a": "经济提供理论框架与学派视角；金融实用的是 CFA 等考试材料"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书#q3", "modNo": 5, "lect": "读书如抽丝，为你推荐一些我读过的好书", "q": "优化主题的阅读顺序为什么从宏观到微观？", "a": "先全景了解问题与解法，再逐层深入计算机、操作系统与性能调优"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书#c4", "modNo": 5, "lect": "读书如抽丝，为你推荐一些我读过的好书", "q": "读书求质变 是什么?", "a": "系统开发中\"如何配置使用\"类问题查文档即可；真正需要读书的场合往往救不了当下，读书的价值是缓慢且无法自我感知的认知结构改变，须放下急功近利。"}, {"id": "00-春节策划第2期-读书如抽丝-为你推荐一些我读过的好书#c5", "modNo": 5, "lect": "读书如抽丝，为你推荐一些我读过的好书", "q": "溯本求源选书 是什么?", "a": "翻译是再创作，受译者水平限制；中文版讲不清时无法区分是原作者还是译者的问题，因此经典教材首选英文原版。"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#q0", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "为什么春运卖票适合 CQRS 架构？", "a": "QPS 百万级而 TPS 仅几百，读写负载严重不对称且业务不要求读写同事务"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#q1", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "读操作分布式化的两条可行性依据是什么？", "a": "读与读之间无冲突可无限并发；业务默认容忍查询信息不一致"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#q2", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "游戏服务器为什么只做命令排序而不存状态？", "a": "手机网络吞吐小，传输命令比传输状态省流量，状态计算下沉到手机端"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#q3", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "事件溯源能力的前提是什么？", "a": "自动机必须无随机性，需用跨平台浮点计算中间件抹平不同 CPU 的精度差异"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#c4", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "CQRS（读写分离） 是什么?", "a": "把订票系统与余票查询系统拆成两个系统，出票信息由订票侧异步推送给查询侧。读、写各自独立优化，成立前提是业务不要求读写在同一事务中完成。"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#c5", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "区间加锁 是什么?", "a": "出票前必须锁住同一车次连续几个站点的同一座位，防止已选票被抢走。把票拆到\"车次×站点×座位\"最细粒度后，写入退化为 1 万 TPS 以下的加锁问题，一般数据系统都能承受。"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#c6", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "事件溯源三要素 是什么?", "a": "命令是外部指令（App 需把屏幕点击等物理操作翻译成\"角色向右走\"这类逻辑命令）；事件是已发生且会改变状态的事；状态是 10 个角色与竞技场的当前情况。"}, {"id": "00-春节策划第3期-如何运用架构知识解读春运买票和手游案例#c7", "modNo": 5, "lect": "如何运用架构知识解读春运买票和手游案例？", "q": "自动机确定性 是什么?", "a": "事件溯源的时光机、读模式节点等能力都建立在自动机无随机性的前提上。不同手机 CPU 浮点精度不同，需要跨平台浮点计算中间件抹平差异。"}]};</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const md=s=>marked.parse(s||"");
const byId=id=>COURSE.lectures.find(l=>l.id===id);
const modName=no=>(COURSE.modules.find(m=>m.no===no)||{}).name||"";
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- markmap ---------- */
let transformer=null;
function ensureTransformer(){ if(!transformer){ transformer=new window.markmap.Transformer(); } return transformer; }
function renderMarkmap(container, mdText, opts){
  try{
    const t=ensureTransformer();
    const {root}=t.transform(mdText);
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    container.innerHTML=""; container.appendChild(svg);
    const mm=window.markmap.Markmap.create(svg, Object.assign({duration:250,initialExpandLevel:2,spacingVertical:6,paddingX:14,maxWidth:260},opts||{}), root);
    setTimeout(()=>{try{mm.fit()}catch(e){}},400);
    return mm;
  }catch(e){ container.innerHTML='<div style="padding:20px;color:#999">导图库加载失败,请检查网络后刷新</div>'; return null; }
}
function lazyMap(box){
  const tpl=box.querySelector('script[type="text/template"]');
  if(!tpl) return;
  const mdText=tpl.textContent, wide=box.classList.contains("map-wide");
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting) return;
      io.disconnect();
      const mm=renderMarkmap(box.querySelector('.markmap-container'), mdText, wide?{initialExpandLevel:1}:null);
      const ctl=box.querySelector('.mapctl');
      if(ctl&&mm){
        ctl.innerHTML="";
        const fit=document.createElement("button"); fit.textContent="重置视图"; fit.onclick=()=>mm.fit(); ctl.appendChild(fit);
        let all=false;
        const tog=document.createElement("button"); tog.textContent="展开全部";
        tog.onclick=()=>{ all=!all; tog.textContent=all?"收起":"展开全部";
          const t=ensureTransformer(); const {root}=t.transform(mdText);
          mm.setData(root,{initialExpandLevel:all?-1:2}); mm.fit(); };
        ctl.appendChild(tog);
      }
    });
  },{rootMargin:"200px"});
  io.observe(box);
}

/* ---------- mermaid ---------- */
function runMermaid(scope){
  const blocks=scope.querySelectorAll("pre > code.language-mermaid");
  blocks.forEach(c=>{
    const pre=document.createElement("pre"); pre.className="mermaid"; pre.textContent=c.textContent;
    c.parentElement.replaceWith(pre);
  });
  if(window.mermaid&&scope.querySelector("pre.mermaid")){
    try{ window.mermaid.initialize({startOnLoad:false,theme:"neutral",securityLevel:"loose",flowchart:{useMaxWidth:true},sequence:{useMaxWidth:true}});
      window.mermaid.run({querySelector:"#content pre.mermaid"}); }catch(e){}
  }
}

/* ---------- 闪卡状态(SM-2 lite) ---------- */

/* ---------- 侧边栏 ---------- */
function buildNav(){
  const nav=$("#nav"); nav.innerHTML="";
  const due=dueCards(0).length;
  const tools=[["#/home","🏠 课程总览"],["#/atlas","🗺 专题图谱"],["#/sre","🛠 SRE 手册"],["#/mem","🧠 记忆模式"+(due?` (${due})`:"")],["#/path","🧭 学习路径"]];
  tools.forEach(([href,label])=>{
    const a=document.createElement("a"); a.className="nav-tool"; a.href=href; a.textContent=label; nav.appendChild(a);
  });
  COURSE.modules.forEach(m=>{
    const g=document.createElement("div"); g.className="nav-group";
    const head=document.createElement("div"); head.className="nav-mod";
    head.innerHTML=`<span>${m.name}</span><span class="arrow">▾</span>`;
    const ul=document.createElement("ul"); ul.className="nav-items";
    COURSE.lectures.filter(l=>l.moduleNo===m.no).forEach(l=>{
      const li=document.createElement("li");
      const a=document.createElement("a"); a.href="#/"+l.id;
      const no=l.isQA?"答":String(l.order).padStart(2,"0");
      a.innerHTML=`<span class="no">${no}</span>${l.title.split("丨").slice(1).join("丨")||l.title}`;
      li.appendChild(a); ul.appendChild(li);
    });
    head.onclick=()=>g.classList.toggle("collapsed");
    g.appendChild(head); g.appendChild(ul); nav.appendChild(g);
  });
}
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  $$("#nav .nav-items a").forEach(a=>{
    const l=byId(a.getAttribute("href").slice(2)); if(!l)return;
    const hay=(l.title+" "+(l.summary||"")).toLowerCase();
    a.parentElement.style.display=(!q||hay.includes(q))?"":"none";
  });
});

/* ---------- 视图:记忆模式 ---------- */
function memStats(){
  const s=Object.values(FC.state), n=Date.now();
  return {due:s.filter(x=>x.d<=n).length, seen:s.length, total:COURSE.cards.length};
}
let mq=[],mi=0,mFree=false,mSel=0,mReveal=false;
function memPick(free){
  const inSel=c=>(mSel===0||c.modNo===mSel);
  mq = free ? shuffle(COURSE.cards.filter(inSel)).slice(0,15)
            : [...dueCards(mSel), ...newCards(mSel).slice(0,Math.max(0,15-dueCards(mSel).length))];
  if(mq.length===0){ mq=shuffle(COURSE.cards.filter(inSel)).slice(0,15); mFree=true; }
  mi=0; mFree=free; mReveal=false; renderMemCard();
}
function renderMemCard(){
  const st=memStats();
  const opts=`<select id="msel">${[0,...COURSE.modules.map(m=>m.no)].map(no=>`<option value="${no}" ${no===mSel?"selected":""}>${no===0?"全部模块":modName(no)}</option>`).join("")}</select>`;
  if(mi>=mq.length){
    $("#content").innerHTML=`<div class="lecture-head"><span class="modtag">记忆模式</span><h2>间隔复习</h2></div>
    <div class="sec"><h3>本轮完成 🎉</h3><p>到期 <b>${st.due}</b> · 已学 <b>${st.seen}</b> / 总 <b>${st.total}</b> 张。明天再来,间隔会自动拉长。</p>
    <p style="margin-top:14px"><button class="btn" onclick="memPick(true)">自由复习 15 张</button>
    <button class="btn ghost" style="margin-left:8px" onclick="memPick(false)">再来一轮</button></p></div>`;
    return;
  }
  const c=mq[mi];
  $("#content").innerHTML=`<div class="lecture-head"><span class="modtag">记忆模式</span><h2>间隔复习</h2></div>
  <div class="mem-top"><span>进度 ${mi+1}/${mq.length}</span><span>到期 ${st.due}</span><span>已学 ${st.seen}/${st.total}</span>${opts}</div>
  <div class="sec">
    <div class="fc-meta">${modName(c.modNo)} · ${c.lect}</div>
    <div class="fc-q">${c.q}</div>
    <div class="fc-a ${mReveal?"":"hidden"}" id="fcA">${c.a}</div>
    <div class="fc-btns">${mReveal?`
      <button class="btn bad" onclick="memGrade(0)">忘了</button>
      <button class="btn mid" onclick="memGrade(1)">模糊</button>
      <button class="btn good" onclick="memGrade(2)">会了</button>`
      :`<button class="btn" onclick="memReveal()">翻面</button>`}</div>
  </div>`;
  $("#msel").onchange=e=>{mSel=+e.target.value;memPick(mFree)};
}
function memReveal(){ mReveal=true; renderMemCard(); }
function memGrade(g){
  const c=mq[mi], s=FC.state[c.id]||{b:0,d:0}, day=86400e3;
  if(g===0){ s.b=0; s.d=Date.now()+600e3; }
  else if(g===1){ s.b=Math.max(1,s.b); s.d=Date.now()+day; }
  else { s.b=Math.min(5,s.b+1); s.d=Date.now()+FC.int[s.b-1]*day; }
  FC.state[c.id]=s; FC.save(); mi++; renderMemCard();
}

/* ---------- 路由 ---------- */
function route(){
  const id=decodeURIComponent(location.hash.replace(/^#\//,""));
  $$("#nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#/"+id));
  $("#sidebar").classList.remove("open");
  window.scrollTo(0,0);
  if(id==="atlas") return viewAtlas();
  if(id==="sre") return viewSRE();
  if(id==="path") return viewPath();
  if(id==="mem"){ mSel=0; memPick(false); return; }
  if(!id||id==="home") return viewHome();
  const l=byId(id);
  if(l) viewLecture(l); else viewHome();
}
window.addEventListener("hashchange",route);
buildNav(); route();
