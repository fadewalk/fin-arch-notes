<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>分布式金融架构 · 知识地图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--accent:#4f46e5;--accent2:#7c3aed;--line:#e5e7eb;--sidebar:#111827;--sidebar-ink:#d1d5db}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;min-height:100vh}
#sidebar{width:288px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0 40px}
.brand{padding:6px 20px 14px;border-bottom:1px solid #1f2937}
.brand h1{font-size:17px;color:#fff;font-weight:700;letter-spacing:.5px}
.brand p{font-size:12px;color:#9ca3af;margin-top:2px}
#search{margin:14px 16px 6px}
#search input{width:100%;background:#1f2937;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
#search input:focus{border-color:var(--accent)}
#nav{padding:8px 10px}
.nav-home,.nav-tool{display:block;padding:8px 12px;border-radius:8px;color:#e5e7eb;text-decoration:none;font-size:14px;margin:2px 0}
.nav-home:hover,.nav-tool:hover,.nav-home.active,.nav-tool.active{background:#1f2937;color:#fff}
.nav-home.active,.nav-tool.active{background:var(--accent)}
.nav-group{margin-top:10px}
.nav-mod{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;color:#9ca3af;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;border-radius:8px;user-select:none}
.nav-mod:hover{background:#1f2937}
.nav-mod .arrow{transition:transform .2s}
.nav-group.collapsed .arrow{transform:rotate(-90deg)}
.nav-group.collapsed .nav-items{display:none}
.nav-items{list-style:none}
.nav-items a{display:block;padding:6px 12px 6px 18px;color:var(--sidebar-ink);text-decoration:none;font-size:13px;border-radius:8px;line-height:1.5}
.nav-items a:hover{background:#1f2937;color:#fff}
.nav-items a.active{background:var(--accent);color:#fff}
.nav-items a .no{color:#6b7280;font-size:11px;margin-right:6px}
.nav-items a.active .no{color:#c7d2fe}
#main{flex:1;min-width:0}
#topbar{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;gap:14px}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer}
#crumb{font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#content{max-width:1020px;margin:0 auto;padding:28px 32px 90px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#a855f7);color:#fff;border-radius:18px;padding:34px 36px;margin-bottom:22px}
.hero h2{font-size:26px;font-weight:800;letter-spacing:1px}
.hero p{margin-top:8px;color:#e0e7ff;font-size:14px;max-width:720px}
.stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.stats b{font-size:20px}
.stats span{font-size:12px;color:#c7d2fe;display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:22px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.panel h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:4px;height:18px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.tool-card{display:flex;flex-direction:column;gap:4px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600}
.tool-card small{color:var(--muted);font-weight:400;font-size:12px}
.tool-card:hover{border-color:var(--accent)}
.mod-card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;background:#fafbff}
.mod-card h4{font-size:15px;color:var(--accent)}
.mod-card p{font-size:13px;color:var(--muted);margin:4px 0 10px}
.mod-card .links{display:flex;flex-wrap:wrap;gap:8px}
.mod-card .links a{font-size:12px;color:var(--accent);text-decoration:none;background:#eef2ff;border-radius:999px;padding:3px 12px}
.mod-card .links a:hover{background:var(--accent);color:#fff}
.lecture-head{margin-bottom:18px}
.lecture-head .modtag{display:inline-block;font-size:12px;color:var(--accent);background:#eef2ff;border-radius:999px;padding:2px 12px;margin-bottom:8px}
.lecture-head h2{font-size:23px;font-weight:800;line-height:1.4}
.pageintro{color:var(--muted);font-size:14px;margin:-6px 0 18px;max-width:820px}
.callout{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #e0e7ff;border-radius:14px;padding:16px 20px;margin:14px 0 22px;font-size:15px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.sec h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:4px;height:17px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px}
.sec h4{margin:16px 0 6px;font-size:14px;color:var(--accent)}
.sec .blurb{color:var(--muted);font-size:13px;margin-bottom:10px}
.sec .md ul,.sec .md ol{padding-left:22px}
.sec .md li{margin:5px 0}
.sec .md strong{color:#111827}
.sec table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
.sec th,.sec td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
.sec th{background:#f3f4f6;font-weight:700;white-space:nowrap}
.sec tr:nth-child(even) td{background:#fafafa}
.lect-tag{font-size:11px;font-weight:400;background:#eef2ff;color:var(--accent);padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:2px}
.map-box{position:relative}
.map-box .mapctl{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:6px}
.map-box .mapctl button{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.map-box .mapctl button:hover{color:var(--accent);border-color:var(--accent)}
.markmap-container{height:480px;border:1px solid var(--line);border-radius:12px;background:#fdfdff;overflow:hidden}
.markmap-container svg{width:100%;height:100%}
.map-wide .markmap-container{height:600px}
pre.mermaid{background:#fdfdff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;justify-content:center;overflow-x:auto}
pre.mermaid svg{max-width:100%;height:auto}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.pager a{flex:1;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px}
.pager a:hover{border-color:var(--accent);color:var(--accent)}
.pager .next{text-align:right}
.pager small{display:block;color:var(--muted);font-size:11px}
/* 记忆闪卡 */
.mem-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mem-top select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.fc-meta{color:var(--muted);font-size:12px}
.fc-q{font-size:17px;font-weight:600;margin:12px 0}
.fc-a{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:15px}
.hidden{display:none}
.fc-btns{display:flex;gap:10px;margin-top:14px}
.btn{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:14px;background:var(--accent);color:#fff}
.btn:hover{opacity:.9}
.btn.good{background:#059669}.btn.mid{background:#d97706}.btn.bad{background:#dc2626}
.btn.ghost{background:#e5e7eb;color:var(--ink)}
footer{padding:26px 32px;color:#9ca3af;font-size:12px;text-align:center}
@media (max-width:900px){
#burger{display:block}
#sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
#sidebar.open{transform:translateX(0)}
#content{padding:20px 16px 70px}
#topbar{padding:10px 14px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand"><h1>分布式金融架构</h1><p>知识地图 · 学习笔记 · 27 讲</p></div>
    <div id="search"><input id="q" type="search" placeholder="搜索讲次 / 关键词…"></div>
    <div id="nav"></div>
  </nav>
  <div id="main">
    <div id="topbar">
      <button id="burger">☰</button>
      <div id="crumb">首页</div>
    </div>
    <div id="content"></div>
    <footer>个人学习笔记 · 内容为对课程的提炼转述与可视化重制</footer>
  </div>

<script>const COURSE = {"modules": [{"no": 1, "name": "01-开篇词", "blurb": "课程全景:什么是金融级系统,如何成为金融级人才"}, {"no": 2, "name": "02-金融业务与系统", "blurb": "从扫码支付到领域驱动设计:业务模式决定系统核心需求"}, {"no": 3, "name": "03-系统正确性保障", "blurb": "单机视角:计算输入、过程、结果与数据传输、存储的正确性"}, {"no": 4, "name": "04-分布式正确性及高可用", "blurb": "多机视角:一致性分级、共识算法、分布式数据方案与容灾"}, {"no": 5, "name": "05-春节策划", "blurb": "综合实战:用架构视角解读春运买票与手游,附书单"}], "overviews": {"1": {"intro": "本模块是整门课的引言，回答\"什么是金融级软件、怎样才算金融级人才\"两个问题。作者以十余年华尔街与国内金融系统的一线经验指出：金融软件的核心复杂度不在单项技术，而在于系统持续演进过程中保持并证明正确性，金融级人才则要求在正确性与吞吐量等矛盾需求中同时逼近极致，核心能力是透过现象看本质。模块同时给出全课程三大部分的路线图——先建立金融业务认知，再掌握系统正确性与性能优化，最后深入分布式一致性、共识与容灾——用于校准学习预期与难度爬坡的心理准备。", "map": ["  - 金融级软件：演进中证明正确性", "  - 金融级人才：矛盾中看本质", "  - 课程路线：业务→正确性→分布式"]}, "2": {"intro": "本模块是全课的业务地基。它先以跨境扫码支付为样本,拆解 C 端支付从用户操作、跨行清算到外汇市场的完整链路;再抓住\"信息流与资金流分离\"这一第一性原理,推导出支付系统从点券到电商支付再到第三方支付的组件演进规律;随后横向扫描信贷、资产证券化、场内/场外交易四类金融业务的技术要点,给出\"业务决定架构\"的方法论;最后用两讲领域驱动设计,把复杂金融业务收敛为可演进的顶层架构与统一业务模型。学完本模块,你应能从业务原理反推系统架构,并掌握异步处理、轧差、低延迟、DDD 等关键设计手法。", "map": ["  - 扫码支付全链路与跨行清算", "  - 信息流资金流分离与组件演进", "  - 四类金融业务的技术要点", "  - DDD顶层架构与三领域划分", "  - 实体值对象聚合统一建模", "  - 思考题解析与外汇系统拓展"]}, "3": {"intro": "模块一回答了金融业务是什么、模块二开头的领域驱动设计给出了顶层方法论,本模块则下沉到工程实践,解决金融系统最核心的要求——正确性。路线是沿着数据流走一遍:输入对不对(双时序数据库管\"正确时间的数据\")、过程对不对(事件溯源管可复现的计算架构)、结果对不对(事前/事中/事后三段式保障),再补齐数据的传输质量(限流、订阅发布、实时分级分发)、存储选型(图/时序/关系型的适用边界)与运行效率(吞吐量与延时两条优化路线)。本模块的隐含主线是:金融的正确性不是某个组件的特性,而是需要跨部门、跨系统、跨年代的管理问题;最后一篇答疑集锦收拢各讲思考题,并用账务系统示范\"通用架构+业务特化\"的迭代思路。学完本模块即可为第三模块的分布式正确性与高可用打好地基。", "map": ["  - 双时序保证输入正确", "  - 事件溯源保证过程正确", "  - 三段式保证结果正确", "  - 传输分交易与市场数据", "  - 存储按数据形态选库", "  - 优化分吞吐量与延时", "  - 答疑收束与账务特化"]}, "4": {"intro": "", "map": ["  - 12 单机:冲突与隔离级别", "  - 13 多机:2PC 与 TCC 分布式事务", "  - 14 容灾:会话/线性/严格串行化", "  - 15 存在性:FLP 不可能性", "  - 16 Raft:共识与线性化存储"]}, "5": {"intro": "本模块是课程正文结束后的春节特别策划，共三篇加餐。第一期以 10 道客观题检验知识点掌握情况，并留下春运卖票、王者荣耀两道跨行业主观题；第二期给出按技术、经济、金融分类的进阶书单，同时阐明\"英文原版优先、读书求质变\"的选书与读书方法论；第三期公布主观题参考答案，示范如何用课程中的 CQRS 读写分离与事件溯源架构拆解两个非金融案例。模块定位是全课程的复习巩固与知识迁移训练：证明架构核心知识是通用的，复杂系统宏观上类似、细节各有千秋。", "map": ["  - 第1期：客观题自测与两道主观题", "  - 第2期：技术/经济/金融书单", "  - 第3期：CQRS与事件溯源案例答案"]}}, "lectures": [{"id": "00-开篇词-如何成为金融级人才", "module": "01-开篇词", "moduleNo": 1, "order": 0, "title": "开篇词丨如何成为金融级人才？", "isQA": false, "summary": "金融软件的核心难点在于在系统持续演进中保持并证明正确性；金融级人才的要求是在正确性与吞吐量等矛盾需求中同时逼近极致，核心能力是透过现象看本质。本篇同时给出全课程三大部分的路线图。", "mindmap": "- 金融级架构之路\n  - 为什么最难\n    - 与军用/OS并列最复杂\n    - 核心对象是钱\n    - 错误即真金白银损失\n    - 机构零容忍\n  - 金融级软件\n    - 演进中保持正确性\n    - 还要能证明正确性\n    - 正确性与速度双高要求\n  - 金融级人才\n    - 矛盾中同时求极致\n    - 代价含开发运营成本\n    - 还有思考成本\n    - 迭代后承诺不可破\n    - 核心能力看本质\n  - 课程三部分\n    - 金融与业务系统\n    - 系统的正确性保障\n    - 分布式正确性高可用\n  - 行业背景\n    - 国外垄断国内追赶\n    - 金融开放人才稀缺", "concepts": "- **金融级软件**：处理对象是钱，错误意味着真金白银的损失且不可逆。它区别于其他大型系统的关键，是在软件不断迭代升级的过程中始终保持正确性，并能证明这种正确性，同时还要兼顾性能。\n- **金融级人才**：能在正确性与吞吐量等相互矛盾的需求之间不做二选一、而是同时改善的架构师。进阶到资深架构师乃至技术决策者的必经之路。\n- **透过现象看本质**：金融级人才的核心能力。理解了问题本质就能推演出事物发展规律，从而提前布局、未雨绸缪，而不是等问题出现再救火。", "points": "1. 军用软件难在实时处理武器信号，操作系统难在功能多样性与效率的平衡，金融软件难在演进中保持并证明正确性——三者复杂度来源不同。\n2. 金融软件对质量的要求是\"所有地方都做到最好\"，而非一般软件的矛盾取舍。\n3. 吞吐量问题同样致命：系统转不了钱会引发恶意挤兑和恶性群体性事件，所以\"正确性优先\"不等于可以放弃性能。\n4. 同时改善矛盾需求的代价包括开发成本、运营成本和思考成本，还要保证未来迭代不破坏当前的系统承诺。\n5. 课程第一部分讲金融业务生态（第三方支付、交易所、券商、银行、投行）并用领域驱动设计控制复杂度。\n6. 第二部分讲业务处理与数据处理的正确性，以及在保证正确性的前提下合理追求速度。\n7. 第三部分讲分布式一致性存在条件、共识算法、事件溯源、数据方案设计与动态分库，以及跨机房实时容灾与稳定性。\n8. 学习方法：原理部分吃力时先通读建立全局认识，再回头攻难点；爬坡过程无法绕过。", "arch": "```mermaid\ngraph LR\n    A[\"金融与业务系统\"] --> B[\"系统的正确性保障\"]\n    B --> C[\"分布式正确性及高可用\"]\n    C --> D[\"容灾与系统稳定性\"]\n```", "compare": "| 系统 | 复杂度来源 |\n| --- | --- |\n| 军用软件 | 实时处理武器信号 |\n| 操作系统 | 功能多样性与效率的平衡 |\n| 金融软件 | 演进中保持并证明正确性 |", "pitfalls": "- 容易把\"金融级\"当营销词。它实际是对质量标准的类比：零容忍、可证明、演进中不破坏。\n- 以为选了正确性就可以牺牲吞吐量。反例是吞吐不足导致用户转不了钱，同样会酿成挤兑事故。\n- 以为难点是单项技术。真正的难点是在有限资源下调和矛盾，并让承诺在迭代中长期成立。", "quiz": "- 金融软件与军用软件、操作系统的复杂度差异在哪里？（金融在于演进过程中保持并证明正确性）\n- 为什么金融系统不能在正确性与吞吐量之间简单取舍？（吞吐不足会让人转不了钱，引发挤兑等恶性群体性事件）\n- 同时改善矛盾需求的代价包含哪几类？（开发、运营、思考成本，还要保证迭代后承诺不破）\n- 课程三大模块分别解决什么问题？（业务认知、单系统正确性与优化、分布式一致性高可用与容灾）"}, {"id": "01-01-业务初探-扫了二维码之后发生了什么", "module": "02-金融业务与系统", "moduleNo": 2, "order": 1, "title": "01丨业务初探：扫了二维码之后发生了什么？", "isQA": false, "summary": "以跨境扫码支付为样本,拆解用户扫码后的完整链路(用户扫码→本币代收→外汇交易→外币代付),揭示支付业务背后的两大架构手法:异步消息处理与日终轧差。", "mindmap": "- 扫码支付\n  - 为何选它入门\n    - 最具代表性场景\n    - 银行系机构全参与\n    - 互联网与机构架构兼具\n  - 用户扫码三步\n    - 鉴权\n      - 绑卡四要素\n      - 短信动态验证\n      - 银行返回Token\n    - 支付\n      - 二维码即订单\n    - 拉取状态\n      - 轮询查询\n      - 异步削峰填谷\n      - 推拉结合通知\n  - 本币代收\n    - 央行管真实资金\n      - 存款准备金划转\n    - 清算机构管记录\n      - 日间只记账\n      - 日终轧差结算\n      - 七步转账流程\n  - 外汇交易\n    - C端零售\n      - 双币种双账户\n      - 四账号两笔订单\n      - 时间与交易成本\n      - 提前批量购汇\n    - B端批发\n      - 分层外汇市场\n      - 订单逐层汇聚\n      - 顶层做市商定价\n      - 衍生品对冲风险\n  - 外币代付\n    - 走国际清结算\n    - 原理同本币代收", "concepts": "- **绑卡四要素**: 姓名、身份证号、银行卡号、银行预留手机号,全是银行记录的静态信息;再加短信验证码这一动态信息共验证 5 项。验证主体是银行,第三方公司只是转交,通过后拿到用户 Token 供后续合法操作。\n- **轮询**: 用户 App 定时向支付后台查询交易状态。因为后台与银行之间是异步消息,支付结果不会同步返回,只能由用户主动拉取。\n- **异步消息处理(削峰填谷)**: 应对偶发流量峰值的架构——高峰期把请求缓存进消息队列按系统正常速度消化,避免核心系统超载;代价是结果无法即时返回。\n- **存款准备金**: 各银行存放在央行的资金。跨行转账不搬真钱,只需央行调整两家银行准备金的一减一增。\n- **清算机构**: 记录日间全部跨行交易明细、日终计算各行净差额的机构,银联、网联、万事达均属此类。\n- **轧差**: 把两家银行互欠金额相互抵消,日终只按净差额通过央行做一笔真实转账;本质是延时更大的批量异步处理。\n- **外汇零售与批发**: 面向终端用户的小额换汇逐层向上汇聚成大额订单;顶层是巨型跨国商业银行做市商,通过交换不同币种的大额定息存折决定汇率。", "points": "1. 扫码跨境支付链路四段:用户扫码、第三方本币代收、外汇交易、外币代付。\n2. 鉴权验证 5 个信息:4 静态要素 + 1 动态短信码,验证方是银行。\n3. 二维码本质是图形化的交易订单字符串。\n4. 支付\"确认\"只代表后台收到请求,不代表支付成功,因此必须轮询。\n5. 服务器实时推送 + 用户定时轮询,推拉结合是异步系统的标准状态通知方式。\n6. 跨行转账日间只记账,日终由清算机构轧差、央行调准备金完成真实划转。\n7. 账务原理要求一个账号只处理一个币种,一笔外汇购买涉及 4 个账号、2 笔支付订单。\n8. 外汇有时间和交易(按次收费)两类成本,第三方公司倾向提前大批量购汇,储备降到警戒线再补。\n9. 隔天到账期内的汇率波动属市场风险,常用期货、期权等衍生品对冲。\n10. 外币代付与本币代收原理相同,只是币种变为美元、走国际清结算体系。", "arch": "跨境支付四阶段总览:\n```mermaid\ngraph LR\n    A[\"用户扫码支付\"] --> B[\"本币代收\"]\n    B --> C[\"外汇交易\"]\n    C --> D[\"外币代付\"]\n    B -.->|清算机构+央行| B1[\"跨行转账\"]\n    C -.->|零售+批发分层| C1[\"外汇市场\"]\n    D -.-> D1[\"国际清结算\"]\n```\n跨行转账七步(简化为关键交互):\n```mermaid\nsequenceDiagram\n    participant 支付公司\n    participant 第三方开户行\n    participant 清算机构\n    participant 买家开户行\n    participant 央行\n    支付公司->>第三方开户行: 持Token发起转账指令\n    第三方开户行->>清算机构: 提交跨行信息\n    清算机构->>买家开户行: 通知记录\n    清算机构->>第三方开户行: 通知记录打款\n    买家开户行-->>用户: 扣款并短信通知\n    Note over 清算机构,央行: 日终轧差盘存\n    清算机构->>央行: 提交未完成的转账\n    央行->>央行: 调整两行存款准备金\n```", "compare": "| 维度 | C端外汇零售 | B端外汇批发 |\n| --- | --- | --- |\n| 参与方 | 第三方支付公司、有资质银行 | 银行、投行、跨国做市商 |\n| 单笔规模 | 小额、面向用户 | 日均数万亿美元级 |\n| 定价方式 | 汇兑提供行报价 | 做市商间交换大额定息存折 |\n| 组织形态 | 无交易所、有资质门槛 | 有层级的跨国市场 |", "pitfalls": "- 绑卡在第三方 App 上完成,但真正的验证方是银行;第三方只持 Token 发起操作。\n- 日终前买家开户行账面上减少的钱并未实际到达对方,实质资金要等央行调准备金。\n- 清算机构与央行分工不同:清算管记录与轧差,央行管真实资金划转。\n- 轧差是\"延时更大的异步\",不是实时清算;它牺牲时效换取流量与成本。\n- 外汇账户必须按币种分离,一个账号只服务一个币种,所以一笔兑换变成两笔订单。", "quiz": "- 为什么扫码后 App 需要轮询支付状态?(后台与银行间是异步消息,结果非同步返回)\n- 跨行转账中清算机构与央行各做什么?(清算记录日间交易并日终轧差;央行调准备金完成真实划转)\n- 一笔外汇购买为何是 4 个账号 2 笔订单?(双方各有本、外币两个账号,本币与外币各一笔支付)\n- 外汇市场顶层是谁、如何定价?(跨国商业银行做市商,交换不同币种大额定息存折)\n- 第三方公司如何摊薄外汇成本?(提前批量购汇+降到警戒线再补,减少按次收费与到账等待)"}, {"id": "02-02-原理解读-如何理解第三方支付的业务逻辑和系统组件", "module": "02-金融业务与系统", "moduleNo": 2, "order": 2, "title": "02丨原理解读：如何理解第三方支付的业务逻辑和系统组件？", "isQA": false, "summary": "支付系统的第一性原理是\"信息流与资金流分离\",由此可推导出从点券系统到电商支付系统再到第三方支付公司的架构演进:账务、网关、核算、资金池、清算中心等组件逐一补齐。", "mindmap": "- 支付系统原理\n  - 核心原理\n    - 信息流与资金流\n      - 信息流即使用权转移\n      - 资金流即所有权转移\n      - 最终必须同步\n    - 为何选择分离\n      - 实时清结算成本过高\n      - 需全行业协同改造\n    - 三条架构推论\n      - 非银行方只产信息流\n      - 异步最终一致\n      - 需核算系统对账\n  - 点券系统\n    - 信息流等于资金流\n    - 业务系统出订单\n    - 支付网关处理\n    - 账务系统管账户\n    - 查询与通知系统\n  - 电商支付系统\n    - 外部资产走第三方\n    - 路由分发内外资产\n    - 金融网关协议对接\n    - 调用轮询对账三步\n    - 核算系统保一致\n  - 第三方支付系统\n    - 流量支持\n      - 异步消息削峰\n      - 熔断降级\n      - 缓存分库分表\n    - 备付金资金池\n      - 虚拟账户记台账\n      - 多银行多资金池\n      - 跨行变行内省成本\n    - 清算中心\n      - 资金池间轧差\n      - 监管演进调整架构", "concepts": "- **信息流**: 想象中钱的流转,转移的是资金使用权(白天朋友间纸条记账);非银行机构没有物理现金,只能产生信息流。\n- **资金流**: 钱的真实流转,转移的是所有权(晚上通过银行转账);只有银行和央行能完成。\n- **交易订单/支付订单**: 交易订单同时含财产交换与物品交换两类信息;支付订单只记账号间的财产变动,是支付系统真正处理的对象。\n- **金融网关**: 对接第三方支付/银行的二进制协议层,负责证书签名、加解密、协议传输与数据校验。\n- **智能路由**: 金融网关对接多家支付机构,按可用性与费率动态选择通道。\n- **核算系统**: 负责与第三方机构对账,并核对账务系统与业务系统的一致性,保证信息流与资金流最终同步。\n- **备付金资金池**: 把用户资金混存于支付公司银行账户,账面用虚拟账户区分你我;须持支付牌照设立,挪用受严格监管。", "points": "1. 信息流与资金流可分离、通常分离、最终必须同步;实时一致因成本过高暂不可行。\n2. 分离的直接推论:支付系统本质是异步系统,一致性模型是最终一致性。\n3. 电商公司与第三方支付公司都只处理信息流,真实资金流在银行体系内。\n4. 点券等内部资产可内部闭环;银行卡等外部资产必须经第三方支付公司转银行处理。\n5. 同步系统演进为异步系统的三步法:异步调用→限时轮询→日终对账。\n6. 异步接口除成功、失败外还有不确定状态,轮询与对账就是为收敛它而存在。\n7. 点券系统的三个基础组件:业务系统、支付网关、账务系统;再加查询与异步通知系统。\n8. 高并发治理复用互联网方案:异步消息、熔断降级、缓存、分库分表。\n9. 在多家银行设资金池,把跨行转账变成行内转账:省手续费,跨境可近实时到账。\n10. 第三方支付公司内部清算中心对资金池间转账做清结算;国内备付金已 100% 集中存管,跨行资金池成历史,但清算中心组件保留。\n11. 监管条例持续演进(如欧盟 GDPR),支付架构必须随监管因地制宜。", "arch": "C 端支付核心组件关系(收单→清算→账务→对账闭环):\n```mermaid\ngraph TD\n    U[\"用户\"] --> BIZ[\"业务系统\"]\n    BIZ -->|交易订单变支付订单| PG[\"支付网关(路由)\"]\n    PG --> IAM[\"内部资产管理系统\"]\n    PG -->|\"A-10→B\"| EAM[\"外部资产管理系统\"]\n    IAM --> PCTS[\"点券系统\"]\n    IAM --> ACC[\"账务系统\"]\n    EAM --> ACC\n    EAM --> FG[\"金融网关(签名/加密)\"]\n    FG -.->|异步通讯| TPS[\"第三方支付公司\"]\n    ACC --> CLC[\"清算中心\"]\n    CLC -->|资金流操作| PG\n    BIZ -.->|交易订单| REC[\"核算系统\"]\n    ACC -.->|账务信息| REC\n    TPS -.->|对账单| REC\n    ACC --> Q[\"查询/异步通知\"] --> U\n```", "compare": "| 维度 | 点券系统 | 电商支付系统 | 第三方支付系统 |\n| --- | --- | --- | --- |\n| 信息流/资金流 | 一致 | 分离 | 分离 |\n| 资产性质 | 内部资产 | 外部资产(银行卡) | 外部资产+自有资金池 |\n| 通讯方式 | 同步 | 异步(轮询+对账) | 异步+高并发治理 |\n| 特有组件 | 账务/查询/通知 | 路由/金融网关/核算 | 资金池/清算中心/流量治理 |", "pitfalls": "- \"支付\"不等于\"转账\":第三方支付公司不能自己搬钱,只能记信息流再与银行同步。\n- 不确定状态不是成功也不是失败,是异步通讯的必然产物,靠轮询+对账收敛。\n- 账务系统负责记账,核算系统负责验证记账与事实一致,两者职责不能混。\n- 资金池里钱不分你我,靠账本(虚拟账户)区分;账实分离正是监管重点。\n- 备付金集中存管后国内已无资金池玩法,但该架构在跨境与海外仍有技术输出价值。\n- 很多组件(如核算系统)平时看似多余,其价值在出错时体现——正确性建立在证据之上。", "quiz": "- 为什么支付环节的非银行参与者只能产生信息流?(物理现金都在银行,它们只能记账)\n- 处理异步不确定状态的两步是什么?(规定时间内轮询,失败则日终对账)\n- 交易订单与支付订单的差别是什么?(前者含物品交换,后者只含财产交换)\n- 多银行资金池为何能降低跨境成本?(跨行转账变多个行内转账,近实时到账且免跨行费)\n- 第三方支付为什么需要自己的清算中心?(资金池间转账等价于跨行转账,需轧差清结算)"}, {"id": "03-03-产品大观-不同金融业务都有哪些技术实现要点", "module": "02-金融业务与系统", "moduleNo": 2, "order": 3, "title": "03丨产品大观：不同金融业务都有哪些技术实现要点？", "isQA": false, "summary": "金融盈利的根本是利用信息不对称;信贷、资产证券化、场内交易、场外交易制造或消除不对称的方式不同,对应系统要求从批处理、海量分布式计算到微秒级低延迟逐级升级。", "mindmap": "- 金融业务与技术\n  - 盈利原理\n    - 利用信息不对称\n  - 信贷类业务\n    - 传统信贷\n      - 低息吸储高息放贷\n      - 信用评级防违约\n      - 早期靠信贷员\n      - 大数据改变格局\n      - 批处理即可满足\n    - 资产证券化\n      - 打包拆分增价值\n      - 违约率是概率\n      - 违约间强相关\n      - 定价公式复杂\n      - 暴力求解算力大\n  - 交易类业务\n    - 场内交易\n      - 交易所侧\n        - 二级市场发现价格\n        - 撮合买卖订单\n        - 每时每刻秒杀\n        - FPGA硬件实现\n      - 用户侧\n        - 投行拆单造不对称\n        - 算法交易平台\n        - 高频消除不对称\n        - 低延时看统计规律\n        - 猫鼠速度竞赛\n      - 用户技术\n        - 毫秒至微秒延时\n        - C为主核心用汇编\n        - 单进程免网络\n        - 托管交易所机房\n    - 场外交易\n      - 产品类型广泛\n      - 无市场自动定价\n      - 必须主动定价\n      - 复杂度与数据量\n      - 统一定价平台靠DDD", "concepts": "- **信息不对称**: 金融最核心的盈利原理;有的机构靠制造不对称赚钱(拆单),有的靠消除不对称赚钱(高频交易、公开市场)。\n- **资产证券化**: 把房贷、消费贷等资产打包后按信用评级拆分成小包卖给投资人,分拆包装后总价值反而上升;次贷危机与花呗/借呗等背后都是这套资本运作。\n- **一级/二级市场**: 一级是股东间私下交易,投行靠人脉撮合买卖,对系统要求不高;二级是交易所公开交易,靠海量成交发现合理价格,对系统要求极高。\n- **拆单**: 把大额订单拆成小单分时发送以免冲击市场价格,本质是制造信息不对称;承载方是算法交易平台。\n- **高频交易**: 以极低延时发现并利用他人的交易意图(如拆单后的连续小单),靠统计规律超短线获利。\n- **场外交易(OTC)**: 交易所之外的交易,涵盖私下股票交易、外汇、证券化产品;没有公开市场发现价格,必须主动计算合同价值。", "points": "1. 传统信贷靠利息差赚钱,信息系统只需结果正确,对时效与吞吐无要求,批处理即可。\n2. 互联网+大数据让信用评级更快、更全、更便宜,信贷核心竞争力转向数据收集与处理。\n3. 信用分是提前批量算好的评级结果,用于营造\"实时放款\"的体验。\n4. 资产证券化定价两大挑战:公式复杂(正确性难保证)与数据量大(需上万台机器暴力求解)。\n5. 区域性房贷违约意味着违约率之间强相关,这是次贷危机的概率学根源。\n6. 股票交易所是永不停止的秒杀系统:极低延时+极高吞吐量,靠 FPGA 等硬件实现;业务逻辑简单但不怕研发成本高、周期长。\n7. 交易所撮合逻辑直白:维护未成交买卖订单簿,新订单能配则配、不能配则排队。\n8. 交易所用户侧是猫鼠游戏:投行拆单制造不对称,对冲基金高频消除不对称,谁快谁赚钱。\n9. 低延时决定技术栈:C 首选、核心代码用汇编、单进程完成全部逻辑、机器托管在交易所机房。\n10. 互联网方案(分库分表、缓存、最终一致)都以牺牲延时换流量,交易所场景完全不适用。\n11. 场外交易占金融市场绝大部分;产品虽多但都与钱相关,共性可用领域驱动设计抽象出统一定价平台。\n12. 支付属于 C 端金融,不适用场内/场外的 B 端划分。", "arch": "交易所撮合引擎的简单直白逻辑:\n```mermaid\ngraph LR\n    A[\"新订单到达\"] --> B{\"能否撮合\"}\n    B -->|可成交| C[\"生成成交回报\"]\n    B -->|不可成交| D[\"挂入订单簿等待\"]\n    D -.->|新对手单到达| A\n```", "compare": "| 业务 | 核心竞争力 | 信息系统要求 |\n| --- | --- | --- |\n| 传统信贷 | 数据收集与评级 | 批处理、无实时组件 |\n| 资产证券化 | 复杂定价能力 | 计算正确性+海量算力 |\n| 交易所 | 速度与吞吐 | FPGA硬件、微秒级 |\n| 交易所用户 | 延时优势 | C/汇编、单进程、托管机房 |\n| 场外交易 | 产品抽象与定价 | 统一定价平台(DDD) |", "pitfalls": "- 一级市场靠人脉不靠技术,但上市定价仍需二级市场公开交易来发现价格。\n- 不要把互联网高并发方案照搬到交易所:它们省流量费的正是交易所最不能牺牲的延时。\n- 高频交易赚的是低延时下的统计规律(如发现小买单后抢跑),不是宏观基本面判断。\n- 外汇没有交易所,属于场外交易;资产证券化产品同样属于场外。\n- 拆单与高频是同一枚硬币的两面:一个制造不对称,一个消除不对称。\n- 资产证券化\"分拆增价值\"不是魔术,而是把风险重新分配并转移给了投资人。", "quiz": "- 金融业最核心的盈利原理是什么?(利用信息不对称)\n- 资产证券化定价对系统的两大挑战是什么?(公式复杂导致的正确性问题与暴力求解的海量算力)\n- 为什么说交易所是秒杀系统?(每时每刻都有撮合,要求极低延时与极高吞吐量)\n- 交易所用户为何选 C/汇编与单进程架构?(毫秒到微秒延时,消除语言与网络开销)\n- 场外产品定价为何需要领域驱动设计?(产品类型繁多但有共性,需抽象出统一定价平台)"}, {"id": "04-04-领域驱动设计-上-如何设计金融软件顶层架构", "module": "02-金融业务与系统", "moduleNo": 2, "order": 4, "title": "04丨领域驱动设计（上）：如何设计金融软件顶层架构？", "isQA": false, "summary": "领域驱动设计是面向复杂金融软件的战略方法论:先以小组直接沟通解决\"人\"的问题并沉淀领域语言,再按核心/通用/支持型三类领域分配资源,两大约束是投资回报比与长期优化。", "mindmap": "- 领域驱动设计\n  - 定位\n    - 战略而非战术\n    - 只解决复杂问题\n    - 注重投资回报比\n    - 着眼长期优化\n  - 适用条件\n    - 组件足够多\n    - 业务逻辑复杂\n    - 生命周期长\n  - 人员组织\n    - 传统层级沟通\n      - 四步瀑布流程\n      - 层层翻译致信息损失\n    - 小组直接沟通\n      - 全员参与\n      - 决策速度提升\n      - 打破部门壁垒\n      - 沉淀领域语言\n      - 弱化产品经理\n  - 系统组织\n    - 核心领域\n      - 判断看竞争优势\n      - 看超额利润\n      - 自研加最优人手\n      - 审时度势演进\n    - 通用领域\n      - 跨行业通用\n      - 优先采购\n      - 次选二开外包\n      - 能用即可随换\n    - 支持型领域\n      - 辅助核心领域\n      - 仅行业内通用\n      - 买人工自研递进\n  - 实战案例\n    - 衍生品管理系统\n      - 投前定价交易打印\n      - 投后支付会计风控\n      - 定价风控属核心\n      - 打印支付会计通用\n      - 交易报价属支持型", "concepts": "- **领域驱动设计(DDD)**: 针对特定领域定制的战略设计,空间上覆盖整个行业领域,时间上覆盖软件全生命周期,角色上覆盖业务、产品、开发、运维全员;专门用于复杂问题。\n- **领域语言**: 全员直接沟通中沉淀出的对专业术语的共同理解,让各方沟通不再\"鸡同鸭讲\"。\n- **核心领域**: 能给公司带来行业内竞争优势的业务;判据是超额利润(超出行业平均水平的利润),且随时代与竞争对手漂移。\n- **通用领域**: 跨行业可用的能力(短信、安全、日志、存储),市场多有成熟产品,优先采购。\n- **支持型领域**: 辅助核心领域运转、不能跨行业通用(会计系统、市场数据系统),缺了不行但不是竞争力。", "points": "1. DDD 是战略思路而非战术实操;简单问题不要用,金融软件恰好满足组件多、逻辑复杂、生命周期长三个条件。\n2. 两大务实原则:注重投资回报比、做长期优化。\n3. 层级沟通的每一步都是翻译,流程越长信息损失越大;最优沟通是单层级的小组直接沟通。\n4. 金融系统可能运行几十年,远超个人项目周期,长期沟通成本决定项目成败。\n5. 直接沟通带来三个文化变化:决策更快、打破部门壁垒、弱化产品经理角色。\n6. 金融术语生僻(融资融券、内保外贷、DCF、Snowball 等),正确建模的前提是正确理解术语。\n7. 在金融行业,开发人员往往是最懂业务的人——写程序必须穷尽正常与异常分支。\n8. 核心领域自研、配最好的人手、做长期投入;核心竞争力买不来。\n9. 核心领域会漂移:70 年代是电算化处理交易,08 年前后是风险计算与对冲,需审时度势。\n10. 同一组件在不同公司重要性不同:会计系统对券商是支持型,对会计服务公司是核心。\n11. 通用领域优先采购;二开不行也只投非核心力量,按随时可替换设计,质量要求\"能用就行\"。\n12. 支持型领域三步走:先买→再人工处理(办公软件亦可)→最后低耦合自研。", "arch": "三类领域的划分决策与资源策略(DDD 顶层分层思路):\n```mermaid\ngraph TD\n    DC[\"日期变更(通用领域)\"] -->|\"调整现金流日期\"| P[\"定价(核心领域)\"]\n    DC -->|\"调整现金流日期\"| RC[\"风险计算(核心领域)\"]\n    P -->|\"读取价格\"| RC\n    LC[\"生命周期管理(支持型领域)\"] -->|\"读取合同\"| P\n    LC -->|\"读取合同\"| RC\n    LC -->|\"读取合同\"| T[\"交易(支持型领域)\"]\n    LC -->|\"读取合同现金流声明\"| PAY[\"支付(通用领域)\"]\n    T -->|\"存档\"| PR[\"打印(通用领域)\"]\n    PAY -->|\"记账\"| ACC[\"会计(通用领域)\"]\n```", "compare": "| 维度 | 核心领域 | 通用领域 | 支持型领域 |\n| --- | --- | --- | --- |\n| 判断标准 | 带来超额利润 | 跨行业通用 | 辅助核心、不跨行业 |\n| 典型例子 | 定价、风险计算 | 短信、支付、会计、日期 | 交易、报价、生命周期管理 |\n| 通用范围 | 公司特有、随时代漂移 | 全行业 | 金融行业内 |\n| 资源策略 | 自研+核心人手 | 采购优先、外包可接受 | 买→人工→简单自研 |\n| 质量要求 | 持续升级投入 | 能用就行、随时可替换 | 能用就行、与核心低耦合 |", "pitfalls": "- \"重要\"不等于\"核心\":短信通知坏了也是大事,但只有带来超额利润的才是核心领域。\n- 核心领域是动态的:曾经的电算化、风险计算一旦被同行复制就失去核心地位。\n- 支持型领域与通用领域的分界线是\"能否跨行业\",不是\"是否重要\"。\n- DDD 耗时耗力,投入前先算 ROI,小而简单的系统用了得不偿失。\n- 层级沟通看似规范,实则每一层翻译都在丢信息,是复杂项目失败的常见根源。", "quiz": "- 判断核心领域的根本标准是什么?(能否带来行业内竞争优势,即超额利润)\n- DDD 为什么要求小组直接沟通?(层级沟通层层翻译损失信息,单层沟通损失最小)\n- 通用领域的资源策略优先级如何排?(采购>二次开发>外包/非核心自研,按可替换设计)\n- 衍生品管理系统中哪些组件属于支持型领域?(交易、报价、生命周期管理)\n- 为什么大型金融公司很少设产品经理岗?(开发人员在穷尽业务分支中最懂业务,直接沟通弱化翻译层)"}, {"id": "05-05-领域驱动设计-下-如何设计统一的金融业务模型", "module": "02-金融业务与系统", "moduleNo": 2, "order": 5, "title": "05丨领域驱动设计（下）：如何设计统一的金融业务模型？", "isQA": false, "summary": "以债券期权为例讲解 DDD 统一业务模型:建模逻辑三要素(实体、值对象、领域服务)+生命周期管理三组件(聚合、工厂、仓库);聚合定义影响与存储双重边界,仓库兼任防腐化层。", "mindmap": "- 统一金融模型\n  - 业务案例\n    - 债券期权\n      - 行权权利与定价\n      - 输入未来现金流\n      - 输入历史与市场数据\n      - 欧式看涨的简化\n  - 建模逻辑\n    - 实体\n      - 唯一标识符\n      - 标识判同一\n      - 生命周期管理\n      - 例债券期权现金流\n    - 值对象\n      - 无唯一标识\n      - 内部属性判等\n      - 不可变修改即替换\n      - 实体的附属品\n      - 例金额与行权日\n    - 领域服务\n      - 承载跨实体逻辑\n      - 无状态无随机\n      - 不可变架构\n      - 例定价与风控\n  - 生命周期管理\n    - 聚合\n      - 影响范围边界\n      - 聚合根唯一入口\n      - 一个数据库事务\n      - 有向无环小图\n      - 大图用延时加载\n      - 跨聚合存引用ID\n      - 多聚合最终一致\n    - 工厂\n      - 创建与使用分离\n    - 仓库\n      - 业务对象存取\n      - 兼任防腐化层\n      - 不做数据分析", "concepts": "- **实体**: 有唯一标识符的业务对象,靠标识判断是否同一,从发行到到期有完整生命周期;债券、期权、现金流、利息都是实体。\n- **值对象**: 只有值没有标识的对象,靠内部属性判等(金额=币种+数额);不可变,修改即替换;只能作为实体或值对象的附属属性(状态)存在。\n- **领域服务**: 业务逻辑跨多个实体、不适合放进任何单个实体时的逻辑载体;金融领域要求无状态、无随机性,因此金融系统普遍采用不可变架构。\n- **聚合**: 实体引用关系图中的一个子图,同时定义影响范围边界与存储边界(一个数据库事务);聚合根是唯一入口且必为实体。\n- **工厂**: 负责业务对象的创建,与设计模式中的工厂作用一致,实现创建与使用分离。\n- **仓库**: 负责业务对象的序列化存取;形态像 SOA 的数据访问层,但更关键的作用是防腐化层——隔离数据使用与数据存储,防外部协议变化入侵领域模型。\n- **防腐化层**: 介于新旧系统之间,把老协议包装成新协议;外部变化入侵内部导致架构变差的过程即\"腐化\"。", "points": "1. 实体三特征:有唯一标识符、靠标识判同一、有生命周期管理。\n2. 值对象五特征:无标识、有内部属性、内容判等、不可变(修改返回新对象)、不能独立存在。\n3. 实体与值对象的划分取决于具体问题:数钞票时人民币是值对象,验真伪时看编号就成实体。\n4. 值对象只能顺藤摸瓜通过引用关系访问,修改即整体替换,故建议属性全只读。\n5. 领域服务不依附任何实体、独立存在;定价与风险计算是典型领域服务。\n6. 金融计算要求无状态、无随机性——这是金融系统普遍采用不可变架构的根源。\n7. 聚合设计三原则:关系呈有向无环图、图尽量小(事务小、存取快)、太大用延时加载摊销。\n8. 聚合间访问只能通过聚合根;可将对方聚合根的唯一标识符作为值对象存储引用。\n9. 单个聚合用数据库事务保证一致性;多个聚合放弃大事务,改用最终一致性,须提前设计中途不一致的处理。\n10. 业务对象创建归工厂、使用归领域服务。\n11. 不建议用仓库做数据分析,DDD 有专门的事件溯源与 CQRS。", "arch": "DDD 建模组件与分层关系(以债券期权聚合为例):\n```mermaid\ngraph TD\n    DS[\"领域服务:定价/风控\"] --> AG[\"操作聚合\"]\n    F[\"工厂\"] --> AG\n    AG --> ROOT[\"聚合根:债券期权\"]\n    ROOT --> EXP[\"行权日期(值对象)\"]\n    ROOT --> BOND[\"债券实体\"]\n    BOND --> CF[\"债券现金流实体\"]\n    CF --> INT[\"债券利息实体\"]\n    INT --> AMT[\"金额=币种+数额(值对象)\"]\n    ROOT -.->|跨聚合引用ID| BOND\n    REPO[\"仓库\"] <--> AG\n    REPO --> ACL[\"防腐化层\"] --> DB[\"数据存储\"]\n```", "compare": "| 维度 | 实体 | 值对象 | 领域服务 |\n| --- | --- | --- | --- |\n| 标识 | 有唯一标识 | 无 | 无 |\n| 判等方式 | 按标识符 | 按内部属性 | 不涉及 |\n| 生命周期 | 有(发行至到期) | 无 | 独立存在 |\n| 状态 | 有状态 | 不可变 | 无状态 |\n| 例子 | 债券、期权、利息 | 金额、行权日、市场利率 | 定价、风险计算 |\n\n| 维度 | 聚合内 | 聚合间 |\n| --- | --- | --- |\n| 访问方式 | 仅经聚合根 | 引用对方聚合根唯一标识符 |\n| 存储保证 | 一个数据库事务 | 放弃大事务、最终一致 |", "pitfalls": "- 实体/值对象不是固定标签:同一对象随问题定义可互相转换,需具体情况具体判断。\n- 值对象不是\"简单的值\":金额是币种+数额的复合体,判等必须整体比较而非逐字段随意比。\n- 聚合不只是影响边界,同时是存储(事务)边界;聚合过大事务就慢,要用延时加载。\n- 跨聚合引用存的是聚合根的唯一标识符,不是对方实体本身。\n- 仓库与数据访问层的本质区别是防腐化职责:外部存储协议变化不应入侵领域模型。\n- 不要用一个更大的事务包住多个聚合事务:事务范围过大且不确定,存储效率低。\n- 聚合图关系应尽量构成有向无环图,避免环状引用导致一致性问题。", "quiz": "- 实体与值对象最根本的区别是什么?(有无唯一标识符,以及据此决定判等方式)\n- 为什么金融领域服务必须无状态、无随机?(正确性要求极高,排除不确定性,故金融系统普遍不可变架构)\n- 聚合定义了哪两类边界?(影响范围边界与数据库事务存储边界)\n- 聚合的关系图太大怎么办?(延时访问 Lazy Loading,访问到才加载,摊销加载时间)\n- 仓库为什么被视为防腐化层?(隔离数据使用与存储,防止外部协议变化入侵内部模型)"}, {"id": "06-06-答疑集锦-一-思考题解析与外汇架构知识拓展", "module": "02-金融业务与系统", "moduleNo": 2, "order": 6, "title": "06丨答疑集锦（一）丨思考题解析与外汇架构知识拓展", "isQA": true, "summary": "集中解析模块一前五讲思考题(降低汇兑成本、外汇支付架构、监管规避、领域间数据传输、行权通知),并拓展完整外汇系统架构:汇率查询、清算中心对冲省费与司库预测购汇。", "mindmap": "- 答疑与外汇拓展\n  - 思考题解析\n    - 降低汇兑成本\n      - 第一步代理交易\n      - 收集交易行为数据\n      - 第二步自营资金池\n      - 分币种垫资建池\n      - 轧差减少交易次数\n      - 预测流动性风险\n    - 外汇支付架构\n      - 一笔外汇两笔订单\n      - 记录汇率与手续费\n      - 独立外汇系统\n      - 外汇资产似点券\n    - 监管规避\n      - 拆解吸储放贷条件\n      - 存款转公司股份\n    - 领域间数据传输\n      - 小公司用简单类型\n      - POJO缺校验行为\n      - 大公司用领域模型\n      - 金融重正确性\n    - 行权自动通知\n      - 属领域服务\n      - 操作行权日期值对象\n      - 通知用通用领域\n  - 外汇系统架构\n    - 四主体资金流\n    - 复用支付系统组件\n    - 新增汇率查询\n    - 清算中心对冲省费\n    - 司库预测购汇量\n  - 出题思路\n    - 业务驱动系统演进", "concepts": "- **垫资(Floating)**: 公司在每个币种资金池中放入自有资金,把外汇交易分解为单币种收支,无需逐笔实时换汇。\n- **外汇支付=两笔同币种交易**: 买家人民币付给支付公司、支付公司美元付给卖家;关键是把两笔不同币种的支付订单关联,记录当时汇率与手续费便于日后对账。\n- **司库(Treasury)**: 企业资金管理部门,根据未来几天的外汇支付行为预测需要购换汇的金额。\n- **POJO 的缺陷**: 纯二进制数据形态缺乏对象行为,最缺的是逻辑校验能力,使用方必须重建全部业务验证逻辑,易出错。", "points": "1. 降低汇兑成本两步走:先代理每笔交易赚手续费并收集用户交易行为,再自营建分币种资金池。\n2. 自营模式下用自有清结算能力轧差,把双向交易抵消,大幅减少与中间商的按笔收费。\n3. 自营的风险是单向交易过多致资金池枯竭,需财务提前预测流动性、提前购汇,来不及再回退代理模式。\n4. 外汇支付在架构上按\"没有外汇\"处理:两笔不同币种支付订单+关联关系(汇率、手续费)。\n5. 实践中独立外汇系统承担购汇、对接汇兑提供行与外汇资产管理;外汇资产管理可视为另一种点券系统(点券换成各国货币)。\n6. 业务系统需先向外汇报价接口,再生成外汇支付订单。\n7. 规避\"银行\"定性只需拆掉吸储或放贷任一条件;存款转公司股份的漏洞很快被监管堵住。\n8. 领域间传输类型因公司规模取舍:小公司求上线快用简单数据类型+数据库互通;大公司求正确用领域模型。\n9. 金融公司对正确性要求极高,倾向初期就用领域模型;向领域模型切换存在双轨过渡的维护成本。\n10. 行权自动通知跨多个实体,定位为领域服务;其操作对象是行权日期(值对象),通知依托消息系统(通用领域)。\n11. 外汇系统大量复用第三方支付组件(账务、金融网关、资产管理、核算),购换汇走外部资产管理,金融网关改对接外汇交易商。\n12. 外汇系统新增汇率查询系统,为跨境电商支付页面提供可交易汇率。\n13. 清算中心把双向外汇交易(中国买美国货、美国买中国货)对冲,减少资金流笔数节省交易成本。\n14. 思考题的共同出发点:金融业务不断追逐高利润新点,系统必须学会持续升级。", "arch": "外汇支付四主体的资金流:\n```mermaid\ngraph LR\n    BUY[\"中国买家(人民币)\"] -->|70元| PAY[\"第三方支付公司\"]\n    PAY -->|10美元| SELL[\"美国卖家\"]\n    PAY -->|提前购汇| FX[\"外汇交易商\"]\n    FX -.->|美元入资金池| PAY\n```\n外汇系统组件(复用支付组件+新增汇率查询):\n```mermaid\ngraph TD\n    BIZ[\"业务系统\"] -->|先询报价| RATE[\"汇率查询系统\"]\n    BIZ --> O[\"外汇支付订单\"]\n    O --> IAM[\"外汇资产管理(内部)\"]\n    O --> EAM[\"外部资产管理\"]\n    EAM --> FG[\"金融网关\"]\n    FG --> FXD[\"外汇交易商\"]\n    IAM --> CLC[\"清算中心(对冲轧差)\"]\n```", "compare": "| 维度 | 汇兑代理模式 | 汇兑自营模式 |\n| --- | --- | --- |\n| 交易方式 | 每笔交中间商处理 | 资金池内单币种轧差 |\n| 成本结构 | 按笔付手续费 | 垫资占用+偶发补货购汇 |\n| 前提条件 | 无 | 交易行为数据+流动性预测 |\n| 回退能力 | - | 可随时回退代理模式 |", "pitfalls": "- 外汇支付不是\"先换汇再付款\",而是两笔独立同币种订单,外汇只是两者的关联信息。\n- 外汇资产管理系统的本质是点券系统的变体,不要为新名词重新造轮子。\n- POJO 跨领域传输省的是眼前功夫,丢的是校验行为,大公司反编译业务行为极易出错。\n- 大公司从小数据类型切换到领域模型有双轨期,短期维护成本上升,是领导层的长期 ROI 决策。\n- 存款转股份式监管套利不可持续,监管会迅速补漏洞。", "quiz": "- 自营外汇靠什么降低按笔收费?(分币种资金池垫资+轧差抵消双向交易,减少与中间商交易次数)\n- 外汇支付订单应如何设计?(两笔不同币种支付订单,以关联信息记录汇率与手续费)\n- 行权自动通知为什么属于领域服务?(跨多个实体,操作对象是行权日期这一值对象)\n- 外汇系统比支付系统多出哪些能力?(汇率查询系统;清算中心对冲双向交易节省成本;司库预测购汇量)\n- POJO 在领域间传输的主要问题是什么?(缺乏校验等对象行为,重构验证逻辑易错)"}, {"id": "06-06-计算输入的正确性-怎么选择正确时间的数据", "module": "03-系统正确性保障", "moduleNo": 3, "order": 6, "title": "06丨计算输入的正确性：怎么选择正确时间的数据？", "isQA": false, "summary": "金融数据存在\"业务发生时间\"与\"系统记录时间\"两个维度,用双时序数据库管理这两个时间,可以保证任意时点的查询可重现、数据修订不污染历史计算,是公司级数据正确性的地基。", "mindmap": "- 计算输入正确性\n  - 问题背景\n    - 指标公布晚且会修订\n    - 合同存续几十年\n    - 跨部门统一数据访问\n    - 查询必须可重现\n  - 双时序数据库\n    - 两个时间维度\n      - 发生时间 VT\n      - 记录时间 TT\n    - 与单时序的区别\n      - 单时序管新增\n      - 双时序管修改\n  - 可见范围\n    - 既存在且有意义\n    - 选最近的合理数据\n    - 与查询互相定义\n  - 优缺点\n    - 优点: 不变性与唯一性\n    - 缺点: 学习与执行成本\n  - 实践建议\n    - 不限制发生时间范围\n    - 失效用新版本覆盖", "concepts": "- **发生时间(VT/valid time)**: 数据所描述的业务事实对应的时间,如\"2018年3月的通胀率\"。解决\"这条数据说的是什么时候的事\"。\n- **记录时间(TT/transaction time)**: 数据进入系统的时间。解决\"这条数据什么时候开始可查\"。通胀率发生时间是3月,记录时间可能是4月甚至更晚。\n- **单时序数据库**: 常见的时序数据库只有一个时间轴,只能处理数据的增加;双时序数据库多一条记录时间轴,专门处理数据的修改与更正。\n- **可见范围**: 一个数据\"能被查到\"的查询坐标集合——查询时间落在该范围内,才能看到这条数据。它不是数据的固有属性,而是由查询结果反推定义的。\n- **最近的合理数据**: 查询时在\"既已录入(记录时间不晚于查询)、且已生效(发生时间不晚于查询)\"的数据中,取发生时间最晚的一条。这与金融口语中\"现在的股价\"的语义一致——金融数据离散,不存在真正的\"现在\"。\n- **情景计算(Scenario Analysis)**: 监管提出的假设性事件(挤兑、地震等)下重算合同。双时序让它只动记录时间、不动发生时间,从而与真实数据天然隔离。", "points": "1. 一个金融数据自带两个时间:业务发生时间与系统记录时间,二者组成二维坐标系。\n2. 查询必须同时给出发生时间和记录时间,坐标落在谁的可见范围内,就返回谁。\n3. 可见范围与查询互相定义:数据可见范围 = 能查询到该数据的所有查询时间点。\n4. 修正旧数据(相同发生时间、新记录时间)会截断旧版本的可见范围,查询自动拿到最新版本。\n5. 优点:数据不变(不可篡改)+唯一标识(两个时间即主键),查询可精确复现历史。\n6. 用合同签订时刻做查询坐标,几十年前的合同用过的数据可完整还原,不受后续修订影响。\n7. 固定发生时间、遍历记录时间,即可单独分析某次修订的影响,做到只改想改的。\n8. 缺点:业务、产品都要理解二维时间,教育成本高;多一个索引,插入与查询都更慢。\n9. 实践中不建议给发生时间设置有限的可见范围(如房贷30年):逻辑与查询优化都过于复杂;数据失效用写入一个\"无效版本\"来实现。\n10. 双时序是大型机构金融的公司级框架,规模越大、历史越长价值越大;普惠金融一般用不上。", "arch": "```mermaid\ngraph LR\n    A[\"业务事实发生<br>(发生时间VT)\"] --> B[\"数据录入系统<br>(记录时间TT)\"]\n    B --> C[\"写入双时序坐标点\"]\n    C --> D[\"修正/补充数据<br>(新TT同VT)\"]\n    D --> C\n    E[\"查询: 给定VT+TT\"] --> F[\"定位可见范围\"]\n    F --> G[\"返回最近的合理版本\"]\n```", "compare": "| 维度 | 单时序数据库 | 双时序数据库 |\n| --- | --- | --- |\n| 时间维度 | 1个(发生时间) | 2个(发生+记录) |\n| 解决的问题 | 数据增加 | 数据修改/更正 |\n| 修改语义 | 覆盖旧值,历史丢失 | 新版本叠加,历史完整保留 |\n| 性能与成本 | 快、简单 | 多一维索引,学习与执行成本高 |\n| 典型场景 | 一般时序数据 | 机构金融的公司级正确性框架 |", "pitfalls": "- \"现在的利率是多少\"在逻辑上是\"离现在最近的一条利率数据\",因为金融数据是离散的。\n- 可见范围是查询视角的产物,不能脱离查询孤立地说\"这个数据的有效期\"。\n- 出现同发生时间的新版本时,旧数据可见范围并非无限向上延伸,而是在新版本生效处被截断——这是\"最近合理数据\"规则的必然结果。\n- 理论上发生时间可以有有限区间(房贷30年),实践会带来覆盖关系和查询优化的复杂度,不推荐。", "quiz": "- 为什么金融公司需要双时序而不是普通时序数据库?(因为要处理数据修订,且要求历史查询几十年可重现)\n- 查询(2018-9, 2018-3)但该数据9月才被更正,返回什么?(返回4月录入的旧版本,更正版本的记录时间晚于查询的记录时间,不可见)\n- 双时序数据库的两个核心优点是什么?(数据不变性、数据唯一性,由此保证查询结果可复现)\n- 如何用双时序支持监管情景计算?(只调整记录时间引入假设数据,业务发生时间不变,真实数据不受影响)\n- 为什么不建议限制发生时间的可见范围?(多个有限范围互相覆盖导致定义和查询优化过于复杂,用新版本覆盖更简单)"}, {"id": "07-07-计算过程的正确性-如何设计正确的数据处理架构", "module": "03-系统正确性保障", "moduleNo": 3, "order": 7, "title": "07丨计算过程的正确性：如何设计正确的数据处理架构？", "isQA": false, "summary": "用事件溯源(Event Sourcing)架构:命令经检查生成事件、按 FIFO 顺序存储、由无随机性的自动机按序重放,使任意历史状态可复现、可审计、可容灾,这是金融行业沉淀多年的过程正确性方案。", "mindmap": "- 事件溯源\n  - 三大术语\n    - 命令: 待检查的指令\n    - 事件: 检查通过必执行\n    - 状态: 执行改变的对象\n    - 一命令可生多事件\n  - 队列处理\n    - FIFO 保证全局顺序\n    - 顺序一致可合并队列\n  - 队列存储\n    - 顺序写对硬盘友好\n    - 内容文件+定长索引\n  - 自动机执行\n    - 禁真实随机数\n    - 禁外部 IO\n    - 外部输入预存入队\n  - 时光机与快照\n    - 重放回滚任意时点\n    - 审计与容灾能力\n    - 快照截断恢复时间\n    - 日切定时打快照\n  - 查询 CQRS\n    - 读写分离\n    - 读模式自动机\n    - 历史查询靠回滚\n  - 数学本质\n    - 不可变架构\n    - 状态为事件累积和\n    - 函数不可交换\n    - 线性序列对应FIFO", "concepts": "- **命令(Command)**: 系统收到的外部指令,如转账请求。命令先做合理性检查,可能被拒绝,因此不保证执行。\n- **事件(Event)**: 命令检查通过后的结果,是\"一定执行、执行一定成功\"的事实用过去式表示(\"moved right\" vs \"move right\")。检查不通过可不生成事件,或生成不改变状态的空事件(NOP)以保留痕迹。\n- **状态(State)**: 事件执行改变的对象与结果,如账户余额。\n- **自动机**: 把事件队列当作无限磁带、从头逐条读取并改变状态的经典计算模型,是事件溯源的执行引擎。\n- **时光机**: 重置自动机并重放事件,可精确恢复到任意历史时点的状态;既支撑审计(\"为什么\"),也支撑容灾。\n- **快照(Snapshot)**: 把当前状态连同对应事件位置存入文件;恢复时先加载快照再重放其后事件,使恢复时间只取决于快照之后的事件数。\n- **CQRS**: 读写分离。写组件只管命令与事件,查询由独立的\"读模式自动机\"(只执行事件不处理命令)提供。\n- **不可变架构**: 事件溯源所属的更大架构族,数据一律不可变,分为事件与状态两类。", "points": "1. 金融不仅要求系统正确,还要求能解释系统为什么正确,事件溯源为此而设计。\n2. 命令和事件的处理必须有确定顺序:同样两条命令,到达顺序不同,产生的事件可能不同(先收100再付200 vs 先付200再收100)。\n3. 命令队列与事件队列顺序完全一致,可合并为一个队列:命令处理出事件后,命令与事件打包落盘。\n4. 队列只在末尾追加(顺序写),能吃满硬盘顺序吞吐,这是事件溯源存储高效的原因。\n5. 每个队列要存两个文件:内容文件+定长索引文件,靠\"位置×定长\"直接计算偏移定位第N条。\n6. 自动机执行禁止随机性:禁硬件真随机数;伪随机数可把算法与种子记入事件后使用;禁止执行期外部 IO,外部输入要提前存进事件队列。\n7. 快照频率是\"恢复时间 vs 运行开销\"的权衡;金融系统靠日切(每晚12点清点)自然形成快照节奏,月/季/年结可复用。\n8. 实时查询:复制事件流到读模式自动机重放(类似游戏直播用电脑复现手机状态);历史查询:从最近快照回滚到目标时点;可部署多个读模式自动机分别锚定不同时点。\n9. 数学本质:状态 Sₙ = S₀ + e₁ + … + eₙ(事件效果的累积和/积分,事件即状态对时间的导数);自动机函数无随机性、且一般不可交换(参数换序结果不同),故数据构成线性序列,天然对应 FIFO 存储。正因与数学严格对应,才能像验证公式一样验证系统正确性。", "arch": "```mermaid\ngraph TD\n    A[\"外部命令\"] --> B[\"命令队列 FIFO\"]\n    B --> C[\"写自动机: 检查命令\"]\n    C -->|合理| D[\"生成事件(过去式)\"]\n    C -->|不合理| E[\"空事件 NOP\"]\n    D --> F[\"事件队列 FIFO\"]\n    E --> F\n    F --> G[\"队列数据文件+索引文件<br>(顺序写)\"]\n    F -->|读取事件| H[\"写自动机<br>按序执行事件\"]\n    H -->|更新状态| I[\"系统状态\"]\n    I -->|日切时打快照| J[\"快照文件<br>(状态+事件位置)\"]\n    F -->|复制事件流| K[\"读模式自动机(实时查询)\"]\n    F -->|从快照回滚| L[\"读模式自动机(历史查询)\"]\n```", "compare": "| 维度 | 互联网架构 | 金融架构(事件溯源) |\n| --- | --- | --- |\n| 关注点 | 当前事实(\"是什么\") | 变化原因(\"为什么\") |\n| 记录倾向 | 记录状态 | 记录原因(命令/事件) |\n| 历史回溯 | 一般不需要 | 必须可审计、可复现 |\n| 容灾方式 | 多副本 | 事件重放+快照 |", "pitfalls": "- 命令≠事件:不合理的命令不会变成事件,事件一旦生成则执行必然成功——这一步检查是正确性的关键闸门。\n- 禁的是\"真随机\":伪随机数只要把算法与种子写入事件,重放结果依然确定。\n- 事件不会触发事件,触发的是命令;命令再生成新事件,命令可以带随机性,事件执行不能。\n- 快照里必须记录对应的事件位置,否则自动机不知道从哪条事件继续执行。\n- 历史查询与实时查询可结合:多个读模式自动机分别停在最新状态与日切时点。", "quiz": "- 为什么事件用过去式命名?(表示命令已通过检查、是必然执行的事实,与可能被拒绝的命令区分)\n- 事件溯源为什么必须 FIFO?(自动机函数不可交换,事件顺序不同结果不同,故数据是线性序列)\n- 快照解决了什么问题?(把容灾恢复时间从事件总长度降为快照之后的事件数,与历史长度无关)\n- 自动机执行时哪两类行为被禁止?(真实随机数与执行期外部 IO;外部输入需提前写入事件队列)\n- 如何查询任意历史时点的状态?(从最近的快照加载状态,再重放到目标时点,即回滚/时光机)"}, {"id": "08-08-计算结果的正确性-怎么保证计算结果是正确的", "module": "03-系统正确性保障", "moduleNo": 3, "order": 8, "title": "08丨计算结果的正确性：怎么保证计算结果是正确的？", "isQA": false, "summary": "单个组件正确不代表系统正确,要把组件间不确定的交互变确定:事前保证输入内容与顺序、事中靠函数式编程与精度控制、事后用独立环境验证,消息传输用\"事务+幂等\"兜底。", "mindmap": "- 结果正确性\n  - 事前: 内容\n    - 双时序查对时间\n    - HMAC 完整性校验\n    - 版本号做兼容\n  - 事前: 顺序\n    - 不乱序\n      - 自增 ID+缓冲区\n      - 线性一致性\n    - 至少一次\n      - 重发直到回执\n      - 事务存回执位\n    - 至多一次\n      - 唯一 ID 去重\n  - 事中\n    - 函数式编程可组合\n    - 计算精度边界\n  - 事后\n    - 换环境独立验证\n    - 验证一次或三次\n    - 实时/异步验证\n    - 日切对账补偿", "concepts": "- **内容正确性**: 上游对数据内容负责——用双时序查对时间,加 HMAC 防传输/读取损坏,加版本号标识数据格式以支持升级后的向下兼容。\n- **线性一致性**: 不乱序的理论要求(第13讲展开)。实现上与 TCP 同思路:消息带自增 ID,接收端把提前到达的消息放入缓冲区,等目标 ID 出现再按序取出。多 TCP 链路/多路由下单靠 TCP 不够,需应用层重做。\n- **至少一次(At-least-once)**: 非确定性网络下回执本身也可能丢,发送方只能持续重发直到收到至少一次回执。由\"事务记录回执状态+幂等更新回执位\"两个保证支撑。\n- **幂等性**: 同一操作执行多次与一次结果相同(如把回执位反复置为成功)。去重就是让消息处理幂等化。\n- **去重与唯一ID**: 至少一次必然带来重复,靠唯一 ID 只处理第一条。ID 来源:自增 ID(需消息系统可控格式)、业务属性(支付订单号)、与业务无关的数据库主键或摘要(MD5/SHA1)。\n- **函数式编程**: 数据不可变、函数无随机,函数可像积木一样组合而不破坏正确性(Composibility),程序不因代码增长而失去正确性。金融大规模使用:Slang/SecDB(高盛)、A+/Scala(大摩)、OCaml(Jane Street)、Haskell(渣打)。\n- **异步验证与日切对账**: 事后验证不阻塞对外输出,错了靠业务补偿(补账),日切/对账即异步验证的落地形态。", "points": "1. 计算三段论:收到请求(事前)、处理请求(事中)、输出结果(事后),每段都有独立的正确性手段。\n2. 找到正确时间的数据还不够,还要校验完整性(HMAC)并带上版本号。\n3. 不乱序是对接收端的要求,发送端因异步网络和多链路无法保证有序。\n4. 上游至少一次:消息中间件有自己的数据库,消息带回执标识位,无回执则无限重发、重启后重发所有未回执消息。\n5. 为什么用事务数据库:回执状态是\"下游客观状态\",必须在上游任意故障下仍被正确记录。\n6. 下游经典错误是先回执再处理:重启即丢消息且上游不再重发;正确做法是先落库(未执行态)、再回执、处理完再标记。\n7. 上下游中间件可合并为一个消息系统(企业总线),6步交互比两套中间件省4步。\n8. 事中正确性是软件工程问题:函数式编程学习成本高,但正确性维护成本低,符合金融投资回报比。\n9. 精度问题只在金额极大时出现(175千万亿津巴布韦元、500万亿日元GDP),对接机构越大越要提前设防。\n10. 事后验证必须降低与原计算的相关性:换语言、换人、换架构、换云厂商;曾有案例是宇宙射线损坏 CPU 浮点寄存器导致算错。\n11. 验证次数:航天级4套系统取至少3个一致结果;金融验证1次基本够。实时验证防患未然但加延时,异步验证需要补偿能力。", "arch": "```mermaid\ngraph TD\n    U[\"上游业务系统\"] -->|1 发消息| M[\"消息中间件\"]\n    M -->|2 落库,回执位空| DB[\"中间件数据库(事务)\"]\n    M -->|3 确认| U\n    M -->|4 持续发送直至回执| D[\"下游业务系统\"]\n    D -->|5 返回回执| M\n    M -->|6 幂等更新回执位| DB\n```", "compare": "| 维度 | 至少一次 | 至多一次 |\n| --- | --- | --- |\n| 保证目标 | 消息不丢 | 消息不重 |\n| 关键机制 | 重发+事务化回执位 | 唯一 ID 去重 |\n| 依赖关系 | 基础保障 | 建立在至少一次之上 |\n| 风险 | 下游可能收到重复消息 | 去重库容量有限,归档后可能漏判 |\n\n| 维度 | 实时验证 | 异步验证 |\n| --- | --- | --- |\n| 时机 | 公布结果前 | 公布结果后 |\n| 优点 | 防患于未然 | 不增加系统延时 |\n| 代价 | 增加延时 | 需业务补偿能力(日切对账) |", "pitfalls": "- \"不乱序\"不要求发送端按序:异步网络下发送端做不到,只约束接收端。\n- 回执悖论:回执也是消息、也会丢,所以\"至少一次\"只能靠无限重发逼近。\n- 先回执后处理是下游最常见的事故来源,顺序必须反过来。\n- 错误结果未必是人为 bug,硬件与环境也会出错,验证要换计算环境而不是复跑同一环境。\n- 去重库归档删数据后,老 ID 重放可能被当新消息处理(思考题:给 ID 引入逻辑时间解决)。", "quiz": "- 为什么保证至少一次必须用支持事务的数据库?(回执位记录的是下游客观状态,要在上游任何故障下保持正确)\n- 下游系统接收消息的正确顺序是什么?(先落库标记未执行→回执→交业务处理→标记已执行)\n- 至多一次如何实现?(给消息唯一 ID 并去重,只处理第一条,ID 可来自自增序号/业务单号/库主键或摘要)\n- 为什么金融业青睐函数式编程?(数据不可变+函数无随机→可自由组合且正确性不退化,长期维护成本低)\n- 事后验证为什么强调\"换环境\"?(降低与原计算的相关性,排除同源软硬件错误,如 CPU 寄存器故障)"}, {"id": "09-09-数据传输的质量-金融业务对数据传输有什么要求", "module": "03-系统正确性保障", "moduleNo": 3, "order": 9, "title": "09丨数据传输的质量：金融业务对数据传输有什么要求？", "isQA": false, "summary": "金融数据分交易数据与市场数据两类:交易数据要保持事务性(顺序+一次)并做好限流;市场数据非事务性,按时效性分级——非实时用订阅发布可容忍丢数据,实时靠付费层级分发与二进制协议压缩。", "mindmap": "- 数据传输质量\n  - 场景模型\n    - 券商对接交易所\n    - 订单+行情两类流\n  - 交易数据\n    - 事务性: 顺序+一次\n    - 限流\n      - 漏桶: 匀速放行\n      - 令牌桶: 平均+峰值\n      - 组织间假设恶意\n  - 市场数据\n    - 非事务性可丢\n    - 非实时\n      - 订阅发布: 全量独立\n      - 消息: 共享断续\n      - 时效性允许缺失\n      - 降 ISR 换速度\n    - 实时\n      - 席位费分级\n      - 同机房换低延时\n      - 广播+层层分发\n      - FIX 只传差量", "concepts": "- **交易数据**: 订单等事务型数据,传输要满足上一讲的顺序正确性与恰好一次(不乱序+去重)。\n- **市场数据**: 全市场成交信息(行情)。算法平台关心的是所有人的行情而非自己的成交,故不需要事务保证,允许丢数据——这是选型自由的来源。\n- **漏桶算法**: 请求进固定容量桶,匀速消费,桶满丢弃。适合强制平滑对外发送速度(券商对交易所)。\n- **令牌桶算法**: 系统匀速放令牌,消费消息需耗令牌;放令牌速度决定平均速率,桶容量决定峰值处理能力。适合总流量限流时做微调(交易所)。\n- **订阅发布(Pub/Sub)**: 每个消费者独立收到全部消息,各自按相同顺序处理(如 Kafka、Google Cloud Pub/Sub 的原始设计)。\n- **消息(Messaging)**: 所有消费者共享消息,各自只处理一部分,单视角看消息是断续的(ActiveMQ、SQS、RabbitMQ、RocketMQ 的原始设计)。\n- **时效性**: 不同时间的数据价值不同。市场数据越新越值钱、旧数据价值衰减快,因此允许丢失——丢失后等一会儿其重要性自然下降。\n- **ISR(同步数)**: Kafka 同步副本数,设为0即放弃同步等待,牺牲容灾换处理速度。\n- **席位费**: 交易所对低延时实时数据的收费分级;同机房托管可把光速延时压到忽略不计,但位置稀缺、天价。\n- **FIX 协议**: 金融专用二进制通讯协议;利用行情连续两条大部分相同的特性只传变化部分,思想同视频压缩关键帧。", "points": "1. 组织间系统对接要假设发送方恶意,接收方必须限流——这是与互联网内部限流的本质差异。\n2. 券商用漏桶限制自己发出的速度;交易所对总流量可用令牌桶获得\"平均可控+峰值可冲\"的弹性。\n3. 一旦上下游限流,就要假设数据会丢:需处理订单发不出去、发出后不被执行两种情况。\n4. 判断市场数据是否事务型的关键:你关心的是\"自己订单的成交\"(事务)还是\"所有人的行情\"(非事务)。\n5. 算法交易平台需要全部历史信号→选订阅发布;这也是 Kafka 在金融系统越来越普及的原因。\n6. 非实时市场数据处理与互联网接近;利用时效性可降 Kafka 同步数换速度,但要配监控防数据频繁丢失。\n7. 实时市场数据的消费者不平等:谁付钱多谁的延时低,所以分发架构天然是层级结构。\n8. 交易所顶层用局域网广播(所有一层节点同时收到)替代 Kafka 式主备同步,因为主备通讯的网络延时不可接受。\n9. 低延时架构优化的是延时而非吞吐量:VIP 用户少,实时推送的硬件开销可控;从经济学看 VIP 越少席位费越贵,总盈利反而可能更高,系统无需支持大量 VIP。\n10. 实时系统大部分时间耗在编解码:禁用 JSON/XML(给人看的冗余),要求不高用 Protobuf,金融场景用 FIX;FIX 只传变动字段。\n11. 数据分层分发到某层后对接非实时系统,推送变拉取,免费用户从此访问。", "arch": "```mermaid\ngraph TD\n    E[\"交易所撮合产生行情\"] -->|局域网广播| T1[\"第一层数据节点(多节点防单点)\"]\n    T1 -->|实时推送| VIP[\"VIP付费客户\"]\n    T1 -->|推送| T2[\"第二层分发节点\"]\n    T2 -->|推送| PAID[\"非VIP付费客户\"]\n    T2 -->|推送| T3[\"更下层节点\"]\n    T3 -->|转拉取| PUB[\"非实时系统(免费用户)\"]\n```", "compare": "| 维度 | 漏桶算法 | 令牌桶算法 |\n| --- | --- | --- |\n| 桶里装什么 | 待消费消息 | 令牌 |\n| 处理节奏 | 严格匀速 | 平均速度+峰值爆发 |\n| 适用位置 | 券商限制自身对外发送 | 交易所总流量微调 |\n\n| 维度 | 订阅发布 | 消息 |\n| --- | --- | --- |\n| 消费关系 | 各消费者独立全量 | 共享消费各取部分 |\n| 单消费者视角 | 完整连续 | 断断续续 |\n| 典型系统 | Kafka、Pub/Sub | RabbitMQ、SQS、RocketMQ |\n| 券商行情需求 | 符合(要全量历史) | 不符合 |", "pitfalls": "- 金融不是处处高要求:非实时市场数据与互联网架构几乎一样,别过度设计。\n- 互联网消息系统默认客户端定时拉取(Kafka 客户端即如此),实时系统必须推——优化目标从吞吐量换成了延时。\n- 实时数据不可缓存补发:缓存后再给,提供的就不再是实时数据(答疑集锦观点)。\n- 数据优化第一杠杆是\"量小\":先把数据压小,再谈传输快。\n- 市场数据允许丢,但不等于可以频繁丢,监控告警必须配齐。", "quiz": "- 券商与交易所各自该选什么限流算法?(券商漏桶限制自己发送;交易所总流量可用令牌桶,兼顾平均与峰值)\n- 为什么券商算法平台选订阅发布而不是消息?(算法平台需要全部历史行情信号,不能接受只消费一部分)\n- 市场数据为什么允许丢失?(时效性:旧数据价值迅速衰减,丢失影响小,可换传输速度)\n- 交易所顶层为什么用广播而不用 Kafka 主备同步?(主备同步引入网络延时,广播让一层节点同时收到数据)\n- FIX 协议为什么快?(二进制编码体积小,且利用连续行情相似性只传变化部分,类似视频压缩)"}, {"id": "10-10-数据存储的合理性-金融业务可以不用关系型数据库吗", "module": "03-系统正确性保障", "moduleNo": 3, "order": 10, "title": "10丨数据存储的合理性：金融业务可以不用关系型数据库吗？", "isQA": false, "summary": "按数据关系的复杂度选存储:图数据配图数据库(仅风控/KYC),无关系的市场数据配列存储时序数据库(KDB),树状业务数据配关系型数据库;NewSql 解决对象存储但查询一致性仍是金融观望的原因。", "mindmap": "- 存储选型\n  - 按关系分类\n    - 图: 网状非结构化\n    - 无关系: 带时间序列\n    - 树状: 雪花业务结构\n  - 图数据库\n    - 金融业务少用\n    - KYC/AML 分析场景\n  - 时序数据库\n    - 行存 vs 列存\n      - 行存整行加载慢\n      - 列存按列读快\n    - 市场数据是业务结果\n    - KDB\n      - 函数式 Q 语言\n      - 向量指令加速\n      - 单线程免锁\n      - GB~TB/贵/难学\n    - 双时序≠时序\n      - 不能列存/无向量\n      - 场外交易自研\n  - 关系型数据库\n    - 对象关系阻抗不匹配\n    - 图论 vs 集合论\n    - NewSql 原子存对象\n    - 二级索引最终一致\n    - 万金油靠事务", "concepts": "- **数据分类三象限**: 按数据间关系复杂度——无关系(市场数据)、树状(业务数据)、网状(图数据),分别对应时序、关系型、图数据库。选型先分类,再匹配。\n- **行存储 vs 列存储**: 存储设备是一维的,二维数据矩阵必须降维。行存横向切割,每行整体存取,查某几列也要加载整行;列存纵向切割,只加载需要的列,大量 IO 被省掉。市场数据求\"某段时间某几列\"的聚合,天然适合列存。\n- **KDB**: 金融行业最强的列存储数据库,自带函数式语言 Q(源自大摩的 A+、数学语言 A,与 Lisp 同族)。Q 中数据不可变、函数无随机,函数可视为参数到返回值的 Map;表与 Map 通过 flip 互转(列名即键)。实时编译 Q 以使用 CPU 向量指令,一条指令处理多个同类型数据。\n- **双时序数据库 vs 时序数据库**: 名字相近实现迥异。双时序多一维时间,无法按列存储、无法用向量指令加速,吞吐上不去,不适合股票外汇等高频业务,适合债券、期货、资产证券化等场外业务;无通用产品,是大型金融公司自研的核心竞争力(实现难点在时间索引,可用空间树)。\n- **对象关系阻抗不匹配**: 面向对象的关系是图(图论),关系库的模式是同构列表的集合(集合论),把对象存入关系库等于把图论翻译成集合论,天然别扭;且对象有封装与行为,库里只有原始数据,抽象层次不同。\n- **NewSql(旧称 NoSql)**: 解决两个问题——高并发高流量、树状数据存储。对象可作为原子单元(如 JSON)存储,缓解阻抗不匹配;但分布式架构下二级索引只能最终一致,查询可能不准。", "points": "1. 金融业务要求结构清晰,本质不是非结构化数据,所以图结构在金融业务中很少。\n2. 图数据库主要在数据分析部门用:KYC 背景调查、AML 反洗钱,分析客户社会关系与资金网络。\n3. 市场数据是业务处理的结果(撮合、交易之后产生),不是业务问题,不适合为\"整行业务读写\"优化的行存储。\n4. 列存储的优势贯穿存、读、算:只读需要的列,CPU 向量指令再加速同列计算。\n5. KDB 适用数据量 GB~TB,重内存;学习门槛高(Q 如 Lisp)且昂贵,但开发与运行速度带来的投资回报比让顶级金融公司买单。\n6. 互联网列数据库(如 ClickHouse)与 KDB 技术大同小异,行业技术正在出圈融合。\n7. 关系型数据库是金融万金油,核心原因是事务支持极大简化了架构难度。\n8. 只有业务量大到必须分布式时,才值得为 NewSql 承担异步架构与最终一致性的复杂度——这是金融业对其观望的原因。", "arch": "```mermaid\ngraph TD\n    D[\"金融数据按关系分类\"] --> G[\"图数据(网状)\"]\n    D --> T[\"市场数据(带时间,无关系)\"]\n    D --> R[\"业务数据(树状/雪花)\"]\n    G --> GDB[\"图数据库: KYC/AML风控\"]\n    T --> TS[\"时序数据库(列存储)\"]\n    TS --> KDB[\"KDB: 高速交易计算\"]\n    T --> BT[\"双时序库: 场外交易(自研)\"]\n    R --> RDB[\"关系型数据库: 事务业务\"]\n    R --> NS[\"NewSql: 高并发对象存储\"]\n```", "compare": "| 维度 | 行存储(关系型) | 列存储(时序/KDB) |\n| --- | --- | --- |\n| 降维方式 | 横向切割,按行 | 纵向切割,按列 |\n| 查询代价 | 整行加载到内存 | 只加载所需列 |\n| 优化目标 | 单行业务完整读写 | 聚合分析、批量计算 |\n| 适合数据 | 业务数据 | 市场数据 |\n| 加速手段 | 索引 | CPU 向量指令、实时编译 |\n\n| 维度 | 关系型数据库 | NewSql |\n| --- | --- | --- |\n| 对象存储 | 阻抗不匹配,需技巧 | 对象作原子单元 |\n| 一致性 | 强事务 | 二级索引最终一致 |\n| 架构复杂度 | 低(事务兜底) | 高(异步/分布式) |\n| 金融态度 | 万金油默认选项 | 观望,量大才升级 |", "pitfalls": "- 双时序数据库名字里带\"时序\",实现与适用场景和时序数据库完全不同,不能混为一谈。\n- 单线程不一定慢:省掉线程切换与同步锁开销后,KDB 反而极快;KDB 的单线程是有列存+向量指令托底的。\n- \"别人都在用关系型库\"是借口不是理由;关系库真正的理由是事务大幅降低架构难度。\n- 对象与数据抽象层次不同:对象=数据+行为+封装,库里只有原始格式,公有私有、继承、校验都无法直接表达。\n- Codd 50年前的奠基论文就提出\"表的值可以是表\",JSON 列并非颠覆性新概念。", "quiz": "- 为什么计算3个时间点的买入均价时列存储快得多?(只需加载买价一列,行存要把整行全部加载)\n- 市场数据为什么不适合关系型数据库?(它是业务处理的结果而非业务问题,关系库优化的是整行业务数据的读写)\n- KDB 的速度来自哪三个设计?(列存储 IO、CPU 向量指令+实时编译、单线程免锁)\n- 对象关系阻抗不匹配的数学根源是什么?(对象关系是图论,关系库模式是集合论,两套理论翻译不自然)\n- 金融业对 NewSql 观望的直接原因是什么?(分布式下二级索引只能最终一致,查询可能不准)"}, {"id": "11-11-系统优化-如何让金融系统运行得更快", "module": "03-系统正确性保障", "moduleNo": 3, "order": 11, "title": "11丨系统优化：如何让金融系统运行得更快？", "isQA": false, "summary": "互联网的\"快\"是吞吐量(边际成本趋零、拼规模),金融的\"快\"是延时(边际成本高、拼质量);吞吐量靠分库分表与消息队列削峰填谷,延时靠单机微观优化(单线程/绑核/内存池)与 epoll、io_uring 网络优化。", "mindmap": "- 系统优化\n  - 快的两义\n    - 互联网: 吞吐量大\n    - 金融: 延时低\n    - 普惠金融近互联网\n  - 吞吐量优化\n    - 分库分表\n      - MECE 切分原则\n      - 哈希切分: 打散流量\n      - 范围切分: 连续友好\n      - 四大问题\n        - 分布式事务\n        - 最低延时\n        - 必须容灾\n        - 库数难调\n    - 消息队列\n      - 削峰填谷\n      - 秒杀三阶段\n      - 担保账号异步化\n  - 延时优化\n    - 单机\n      - 单线程免调度\n      - 绑核+isolcpus\n      - 内存顺序访问\n      - 内存池\n      - 顺序写/mmap\n    - 网络\n      - epoll: 事件通知\n      - io_uring: 内核批量", "concepts": "- **边际成本与\"快\"的定义**: 互联网业务边际成本≈0,倾向大规模扩张→海量用户→大流量→\"快\"指集群吞吐;机构金融要做 KYC、业务/财务/合规流程,无法规模扩张,只能拼质量→时间就是金钱→\"快\"指延时低。普惠金融(支付、小额信贷)归互联网一边。\n- **分库分表**: 将表横向/纵向切割后分散到多机,用更多硬件扛流量。切分要 MECE:子表互不重复(独立)且不丢数据(穷尽)。水平切分两法:按主键哈希(打散流量,但连续访问差)与按主键范围(区间连续对市场数据友好,但热点集中)。\n- **消息队列削峰填谷**: 流量先写入队列,服务器按自身能力匀速拉取,峰值流量不再压垮系统。队列写入上限很高,通常不构成瓶颈。\n- **担保账号异步化**: 秒杀付款先入担保账号而非直连卖家;中间账号扣款可延迟、甚至丢了靠日切对账补账,因此可异步处理,秒杀期只做买家账号一半的写操作。\n- **单线程优化**: 多线程赢在资源多,但线程调度要更新内核结构与 CPU 缓存,\"准备资源本身消耗资源\";单线程+绑核(sched_setaffinity)+isolcpus 独占 CPU 可反超。\n- **epoll**: Linux 独有,同时监听海量连接,就绪才通知,解决 C10K;但读写仍要用户态自己调内核函数,状态切换开销大。\n- **io_uring**(2018): 把读写操作与预分配内存编成队列整体交给内核,内核在内核态批量完成 epoll+读写,经共享页表回传状态;省切换也省拷贝,生态尚不成熟。", "points": "1. 优化前先判断业务属于哪一类:普惠金融走吞吐量路线,机构金融走延时路线。\n2. 市场数据要按时间连续访问,哈希切分不适合,应按时间范围切分;但量化分析集中访问最近数据会造成热点。\n3. 分库分表的代价:分布式事务(正确性)、至少两次网络通讯(最低延时)、机器越多故障概率越高(容灾)、库数一旦定死难调(容量),须提前\"超前\"规划库数。\n4. 秒杀支付三阶段:平稳期→峰值(写入队列)→回落;处理速度上限=分库分表后集群总能力,峰值高但短、处理慢但长。\n5. 结合业务规律再深挖:从付钱到商家收钱有天然时间差→中间环节异步化,秒杀期少一半账号操作。\n6. 延时优化是纵向(微观资源)调配,与吞吐量的横向调配方法论不同。\n7. CPU 层:绑核只保证自己不迁移,别人仍可来抢;isolcpus 独占才算真隔离。\n8. 内存层:CPU 经缓存访问内存,按算法访问顺序组织多维数组可享顺序加载红利;C 语言 malloc 耗时且时长随机,延时敏感场景自建内存池。\n9. 文件层:能顺序写就顺序写(事件溯源即是);必须随机写时用 mmap 把文件映射进页表,省去用户态与内核间数据拷贝。\n10. 机构金融不适合云计算:云计算是宏观横向扩张的标准解,机构金融需要的是对进程、内核、硬件的微观控制。", "arch": "```mermaid\ngraph TD\n    A[\"电商系统: 秒杀峰值流量\"] -->|写入| Q[\"消息队列\"]\n    Q -->|按集群能力匀速拉取| P[\"支付系统\"]\n    P -->|同步强事务| B[\"买家账号扣款\"]\n    P -.->|秒杀期搁置| M[\"中间/担保账号\"]\n    M -.->|第四阶段异步打款| S[\"卖家账号\"]\n    M -.->|日切对账补账| R[\"补偿机制\"]\n```", "compare": "| 维度 | 互联网业务 | 机构金融业务 |\n| --- | --- | --- |\n| 边际成本 | 趋近于零 | 高(KYC/合规流程) |\n| 竞争方式 | 规模扩张 | 质量与速度 |\n| \"快\"的含义 | 集群吞吐量大 | 延时低 |\n| 优化方向 | 横向: 分库分表+队列 | 纵向: 单机/内核/硬件 |\n\n| 维度 | 哈希切分 | 范围切分 |\n| --- | --- | --- |\n| 分布特点 | 随机打散,流量均匀 | 区间连续,可能热点 |\n| 连续访问 | 差 | 好(适合市场数据) |\n| 典型风险 | 主键连续查询低效 | 最近数据单机过载 |", "pitfalls": "- 多线程\"资源更多所以更快\"有个隐含假设:计算间不互相抢占资源;线程调度与缓存刷新本身就是开销。\n- sched_setaffinity 绑核后,其他程序仍可能抢占该 CPU;要 isolcpus 把核从系统里摘出来才算独占。\n- 分库分表方案自带最低延时(分布式事务至少两次网络通讯),高频交易机构不可接受。\n- 消息队列不是万能:削峰填谷用延时换吞吐,只适合对峰值时延不敏感的业务。\n- 中间账号的打款在支付系统视角可以异步甚至丢失(日切补账兜底)——识别哪些环节不需要强事务,才是优化的关键。", "quiz": "- 为什么金融和互联网对\"快\"的定义不同?(边际成本决定扩张方式:互联网拼规模要吞吐,机构金融拼质量要延时)\n- 分库分表切分要遵守什么原则?(MECE:子表互不重复且切分不丢数据)\n- 市场数据应该按哈希还是范围切分?为什么?(按时间范围:需要时间段连续访问,哈希会打散连续性)\n- 单线程为什么可能比多线程快?(省掉线程调度、内核数据结构与 CPU 缓存的更新开销)\n- io_uring 相比 epoll 的改进是什么?(把就绪检测与读写批量放内核态,共享页表,省状态切换和数据拷贝)"}, {"id": "11-11-答疑集锦-二-思考题解析与账务系统优化", "module": "03-系统正确性保障", "moduleNo": 3, "order": 11, "title": "11丨答疑集锦（二）丨思考题解析与账务系统优化", "isQA": true, "summary": "本篇是模块二的思考题总解:给出双时序矩形复杂度、事件文件完整性检测、去重 ID 逻辑时间、实时速度协调、JSON 列取舍、热点账户拆分六题的参考答案,并加餐账务系统的合并存储与链式对账优化。", "mindmap": "- 答疑集锦二\n  - 06 双时序矩形\n    - 空间 O(n平方)\n    - 查询 O(log n)\n    - 高成本限低吞吐\n  - 07 文件完整性\n    - 索引存事件校验码\n    - 索引尾部逐条验证\n    - 先事件后索引\n  - 08 去重 ID\n    - 归档致漏判\n    - 引入逻辑时间\n    - 业务保证有序\n  - 09 实时提速协调\n    - 不可缓存补发\n    - 丢弃+反馈降速\n    - 按性能上限选席位\n  - 10 JSON 列\n    - 顶层以下无模式\n    - 速度vs可维护性\n    - 严格场景加强测试\n  - 11 热点账户\n    - 独立分库\n    - 拆子账户/科目\n    - 纵向扩容\n  - 加餐账务优化\n    - 事件带前后状态\n    - 查询免回放免快照\n    - 链式对账似区块链", "concepts": "- **矩形切割存储(06题)**: 双时序坐标空间按新增数据点做水平垂直切割成矩形,索引建在矩形左下/右上角坐标上。空间复杂度 O(n²),查询 O(log n) 或 O(1)——高存储成本正是双时序只适合低吞吐场外业务的原因(呼应第10讲)。\n- **完整性检测(07题)**: 索引文件每条末尾存\"此前所有内容的校验码\";事件文件的校验码(MD5/SHA1/HMAC)放在对应索引里,两文件联合检测。线性写文件损坏只在末尾:索引文件先裁剪到单条索引大小的整数倍,再从末尾逐条校验、不完整即丢弃。\n- **逻辑时间(08题)**: 让去重 ID 之间满足线性关系(任意可比、可传递,且后生成者更大),ID 反映事件顺序。ID 带时间/自增成分后,归档删除形成连续区间,只需判断新 ID 是否落在已删区间即知是否可能重复;由业务系统保证逻辑时间正确。\n- **实时数据速度协调(09题)**: 实时数据过期即失效,不能进队列缓存补发(补发的已不是实时服务)。接收方处理不过来就丢弃,并返回丢弃通知让发送方降速,稳定后回升——思想同 TCP 带宽探测。\n- **合并存储(加餐)**: 账务状态是简单 K/V,可在生成事件的同时\"假装执行\"得到前后余额,把事件与前状态、后状态一起存储。\n- **对账链(加餐)**: 两条不变式——前一事件的最终余额=后一事件的初始余额;事件最终余额=初始余额+变动金额。把相邻余额、事件前后余额链接成链,任一状态可沿链校验全部变动过程。", "points": "1. 双时序矩形方案的空间开销随数据点数平方增长,决定了它服务不了高频场景——复杂度分析与业务选型闭环。\n2. 事件溯源不要一发现文件不完整就整个丢弃:恢复成本太高,应逐条抢救可用部分。\n3. 两文件写入顺序:先事件文件、后索引文件,否则索引可能指向未落盘的事件。\n4. 去重问题的本质是\"检测元素是否属于大集合\",与其无限扩容去重库,不如让 ID 有序化,把问题降为区间判断。\n5. 实时传输的丢数据不是故障而是设计:过期数据没有找回价值,双向速度协调防止无谓浪费网络处理时间。\n6. JSON 列的推广是权衡题:无 schema 提快上线速度,但顶层以下零约束推高长期维护成本;正确性严格的场景要么不用,要么按超出常规关系库的力度测试。\n7. 超大流量账户三板斧:单独分库(性价比常最优)→账户拆分/科目记账(只追加、顺序写、无余额累加)→纵向扩容(升级单机)。\n8. 合并存储后,历史查询退化为\"找最近事件读其附带状态\",常规时序库即可支持,且连快照都不再需要。\n9. 链式对账把内部对账从\"另建系统重算总额\"变为\"沿链逐点校验\",与区块链本质相同,差别仅在后者用非中心化共识建链。\n10. 加餐点题:完整软件系统不是一蹴而就,是在通用方案上按业务特性逐步迭代(事件溯源→账务特化)。", "arch": "```mermaid\ngraph LR\n    S0[\"用户A: 余额0\"] -->|\"事件e1 转出100\"| S1[\"余额-100\"]\n    S1 -->|\"事件e2 转入100\"| S2[\"余额0\"]\n    S2 -->|\"事件e3...\"| S3[\"...\"]\n    S0 -.->|\"链接校验<br>前终值=后初值\"| S1\n    S1 -.->|\"链接校验\"| S2\n```", "compare": "| 维度 | 通用事件溯源 | 账务系统特殊优化 |\n| --- | --- | --- |\n| 历史查询 | 快照+回滚重放 | 找最近事件直接读附带状态 |\n| 快照 | 需要(日切) | 可完全省去 |\n| 对账方式 | 另建系统重算总额比对 | 沿余额链逐点校验 |\n| 存储内容 | 仅事件 | 事件+前后状态(冗余换查询) |", "pitfalls": "- 文件完整性检测可以跨文件协同:用索引文件校验事件文件,不必给每个事件单独存校验块。\n- 索引自身完整性靠\"每条末尾放此前内容的校验码\"+从尾部逐条回退验证。\n- 缓存实时数据再补发=提供过期的服务,不如不缓存;正确做法是丢弃并反馈降速。\n- 去重 ID 归档后漏判的解法不是保留更多数据,而是给 ID 加逻辑时间、把问题变成区间判断。\n- 区块链思想在账务里的对应物就是\"前后余额链接\",不要把它神化成另一种技术。", "quiz": "- 矩形切割方案的空间与查询复杂度各是多少?对业务选型有何暗示?(O(n²) 与 O(log n)~O(1);高成本决定只适合低吞吐场外业务)\n- 事件文件和索引文件应按什么顺序写?为什么?(先事件后索引,避免索引指向不存在的事件)\n- 什么是逻辑时间?它解决什么问题?(ID 满足线性关系且反映产生顺序;解决去重数据归档后的重复判别)\n- 实时数据系统收到过快推送该怎么办?(丢弃过期数据并通知发送方降速,做双向速度协调,而非缓存)\n- 账务系统把事件与前后状态合并存储带来哪两个收益?(历史查询找最近事件即可、不再需要快照;对账可沿链逐点校验)"}, {"id": "12-12-正确性分级-上-单机无备份有哪几种不同的一致性", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 12, "title": "12丨正确性分级（上）：单机无备份有哪几种不同的一致性？", "isQA": false, "summary": "本讲在单机环境下定义了事务间\"冲突\"的三种类型，并据此建立隔离级别分级体系：从解决脏写的 Read Uncommitted 一路递进到解决全部冲突的可串行化，最后给出工程上最常用的快照隔离及其 MVCC 实现。核心主张：数据库宣称\"支持事务\"并不等于最高正确性，事务本身分很多等级。", "mindmap": "- 单机事务隔离级别\n  - 冲突定义\n    - 作用于同一对象\n    - 至少一方是写\n    - 后操作依赖前操作\n    - 三种冲突\n      - 读写冲突\n      - 写读冲突\n      - 写写冲突\n  - 隔离级别阶梯\n    - Read Uncommitted\n      - 解决脏写(写写)\n    - Read Committed\n      - 加解决脏读(写读)\n    - Repeatable Read\n      - 加解决模糊读(读写)\n    - 可串行化\n      - 解决全部冲突\n  - 可串行化\n    - 等价于某顺序执行\n    - 对任意初值结果相同\n    - 某个顺序不唯一\n    - 分而治之降低成本\n  - 冲突可串行化\n    - 无冲突互换调整次序\n    - 是可串行化的子集\n    - 2PL 实现\n      - 先全加锁再访问\n      - 最后统一解锁\n      - 需预知访问数据\n  - 快照隔离与 MVCC\n    - 事务开始打快照\n    - 读写互不干扰\n    - 快照只含已完成事务\n    - MVCC 实现\n      - 数据只增不改\n      - 修改即新增版本\n      - 删除打标签待回收\n      - 隐藏列记录事务\n    - 属只读架构思想\n  - SSI(思考题)\n    - 乐观并发控制\n    - 提交时查冲突", "concepts": "- **冲突**：两个操作作用于同一对象且至少有一个是写操作。排除双读情形后，冲突只有读写、写读、写写三种；写读冲突要求写事务回滚才暴露问题，读写冲突则要求写事务提交。\n- **隔离级别（Isolation Level）**：对\"不正确\"程度的分级。经典出处是 1995 年论文《A Critique of ANSI SQL Isolation Levels》，每一级比低一级多解决一种冲突。\n- **可串行化（Serializability）**：并发事务的最终结果永远等价于它们按某个顺序一个接一个执行的结果。\"永远\"指对任意初始值都成立；\"某个\"意味着等价顺序不必唯一，所以可串行化自带一定随机性。\n- **冲突可串行化（Conflict Serializability）**：更强(更苛刻)的等价定义——要求能通过一系列\"无冲突互换\"把原执行序列调整为串行执行。它是可串行化的充分条件，其集合是可串行化的真子集；有些可串行化的调度无法通过无冲突互换达成。\n- **2PL（Two Phase Lock）**：两阶段锁。事务先对所有要访问的资源加排它锁，访问完再统一释放，加锁与解锁不交替。注意与 2PC（两阶段提交）完全是两回事。它能实现冲突可串行化，但要求事务提前知道要访问哪些数据，释放任一锁后不能再加新锁。\n- **快照隔离（Snapshot Isolation）**：事务开始时为所有\"正确\"数据打一个不可变快照，此后读写互不干扰、无锁等待。正确=只包含已完成事务的数据，排除进行中和尚未开始的事务。\n- **MVCC（Multi-Version Concurrency Control）**：快照隔离的典型实现。数据只增不改，修改分解为\"删旧标新增\"，删除只是打标签由垃圾回收器择机回收；每行有隐藏列记录修改事务，查询时自动附加\"只取已完成事务版本\"的条件，快照其实并未真正拷贝数据。\n- **SSI（Serializable Snapshot Isolation）**：串行化快照隔离，在快照隔离上增加提交时检查读写、写读冲突的乐观机制，冲突少时性能好，冲突频繁时会在长时间运行后回滚、浪费资源。", "points": "1. 冲突三型：读写、写读、写写；两个读操作永不冲突，不同对象的操作也永不冲突。\n2. 隔离级别按\"解决冲突数量\"递进：RU 解决写写；RC 加解决写读；RR 加解决读写；可串行化解决全部。\n3. 可串行化的价值在于分而治之：串行化后每个事务成为原子单元，大正确性问题拆成以事务为单位的小问题。\n4. 冲突可串行化 ⊆ 可串行化，反之不然——存在可串行化却无法无冲突互换调整为串行的场景。\n5. 锁式调度天然实现的是冲突可串行化，而非完整意义上的可串行化。\n6. 2PL 的硬伤：必须提前锁定全部待访问数据，中途不能新增锁，实践中用得不多。\n7. 快照隔离强度介于 Read Committed 与可串行化之间，是当今多数数据系统的事实默认级别；听到\"新系统支持事务\"应首先怀疑它是快照隔离。\n8. 快照选择数据的三分法：只取已完成（提交或回滚）事务的数据，忽略进行中和未开始的事务，否则会读到半成品或未来数据。\n9. MVCC 与事件溯源同属只读架构（Immutable Architecture）：把数据变为只读多版本，正确性靠\"选对版本\"而不是\"改对数据\"。\n10. SSI 是乐观路线（提交时验证），2PL 是悲观路线（提前加锁预防），系统压力不大时 SSI 是好选择。", "arch": "```mermaid\ngraph TD\n    A[\"事务开始\"] --> B[\"加锁阶段<br/>对全部访问资源加排它锁\"]\n    B --> C[\"访问资源\"]\n    C --> D[\"解锁阶段<br/>统一释放所有锁\"]\n    D --> E[\"事务结束\"]\n    B -. \"期间不允许再增锁\" .-> B\n    D -. \"解锁后不可再访问\" .-> C\n```", "compare": "| 级别名 | 前提/场景 | 保证 | 代价 |\n| --- | --- | --- | --- |\n| Read Uncommitted | 单机最低级 | 消除脏写(写写冲突) | 仍会读到未提交数据 |\n| Read Committed | 多数系统基础级 | 消除脏写+脏读(写读冲突) | 前后两次读可能不同 |\n| Repeatable Read | 需要重复读一致 | 再消除模糊读(读写冲突) | 实现与加锁成本更高 |\n| 可串行化 | 需要最强单机正确性 | 消除全部冲突，等价串行 | 实现复杂，通常借锁 |\n| 冲突可串行化 | 数据库实用调度 | 可经无冲突互换证串行 | 是可串行化的子集 |\n| 快照隔离 | 长事务、默认选项 | 读写互不干扰、速度快 | 弱于可串行化，写写仍需处理 |\n| SSI | 冲突少的负载 | 快照隔离+可串行化能力 | 冲突多时晚回滚浪费资源 |", "pitfalls": "- \"事务\"是个多义词：不同系统说\"支持事务\"时正确性天差地别，同名不一定同级。\n- 2PL(两阶段锁)与 2PC(两阶段提交)名字相近但毫无关系，后者在第 13 讲。\n- 可串行化的\"某个\"顺序不唯一，带来调度随机性；要消除需等 14 讲的严格可串行化。\n- 快照不是把数据真的拷贝一份，而是靠隐藏列+改写查询条件实现，理解这点才能理解 MVCC 性能。\n- \"已提交的事务不能回滚\"在直觉上成立，但可串行化的等价性定义与直觉并不完全重合，要以定义为准。\n- MVCC 的删除并未真删，只是打标签，依赖垃圾回收器回收；忽略这点会误判存储增长。", "quiz": "- 三种事务冲突分别是什么？各对应哪个隔离级别的哪次修复？（读写/写读/写写；RU 修写写、RC 修写读、RR 修读写）\n- 可串行化与冲突可串行化是什么关系？为什么数据库常用后者？（后者是前者的充分不必要条件/子集；因为基于锁的实现天然只能做到冲突可串行化）\n- 2PL 为什么能保证冲突可串行化？它的使用局限是什么？（最早解锁者可在解锁前与其他事务无冲突互换而提前；需提前知道全部访问数据，释放锁后不能再加锁）\n- 快照里的数据为什么必须排除\"未开始\"的事务？（事务运行期间还有新事务陆续进入，其数据不属于该时刻的正确状态）\n- 快照隔离的实现要点是什么？（MVCC 多版本只增不改、删除打标签、隐藏列记录事务、查询按已完成事务过滤版本）"}, {"id": "13-13-正确性分级-中-多机无容灾有哪几种不同的一致性实现", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 13, "title": "13丨正确性分级（中）：多机无容灾有哪几种不同的一致性实现？", "isQA": false, "summary": "在多机、数据不复制(无容灾)的场景下，把各节点局部的事务能力汇集起来做集中决策，就得到分布式事务(分布式可串行化)。两条主流路线：数据库底层的 2PC 与业务上层的 TCC，共同支柱是协调者，但协调者本身构成单点。", "mindmap": "- 分布式事务\n  - 核心思路\n    - 汇集局部信息集中决策\n    - 单机事务保证全局事务\n  - 两阶段提交 2PC\n    - 假设\n      - 节点间无直接交流\n      - 协调者唯一通信角色\n      - 网络可丢指令与回执\n    - 协议流程\n      - 一:准备提交(预处理)\n      - 二:统一提交或回滚\n    - 数据库新增准备成功态\n    - 成本\n      - 至少两次网络往返\n      - 两阶段间全程持锁\n  - TCC\n    - Try-Confirm-Cancel\n    - 业务系统自管进度\n    - 每阶段是完整本地事务\n    - 取消是业务补偿非回滚\n    - 业务需写正反两套\n    - 中间态短暂少钱\n    - 异常三加强\n      - 允许空回滚\n      - 空回滚留记录\n      - 防悬挂\n  - 正确性反思\n    - 协调者库承载全局能力\n    - 中间态靠最终一致性\n    - 协调者单点问题", "concepts": "- **分布式事务（Distributed Transaction）**：跨多个独立数据库的事务，目标是让整体表现如一个可串行化的事务。实现思路是用单机事务的正确性支撑全局事务的正确性。\n- **协调者（Coordinator）**：唯一与所有参与机器通信、收集局部状态并做全局决策的角色，可以是一台独立机器，也可以是集群中的一员。协调者的本地数据库保存全局事务状态，其事务能力决定整个分布式事务的能力。\n- **2PC（两阶段提交）**：数据库级分布式事务。第一阶段协调者发\"准备提交\"，各节点做预处理(加锁、改数据)但不提交，返回准备结果；第二阶段按全局结果统一下发提交或回滚。前提假设：节点间无直接交流、网络可能丢消息或回执。\n- **准备成功状态**：为支持 2PC，单机数据库在\"开始\"与\"完成\"之外新增的中间事务状态——预处理完成但未提交，所以第二阶段\"回滚\"并不违反已提交事务不可回滚的原则。\n- **TCC（Try-Confirm-Cancel）**：业务层分布式事务。Try 阶段各节点执行并真正提交本地事务并上报；Confirm 阶段做确认动作；Cancel 阶段用反向业务对冲第一阶段的业务效果。Cancel 是业务补偿(事务补偿)，不是数据库回滚，因此每个业务要实现正反两套。\n- **空回滚**：允许对\"根本没收到 Try\"的事务执行 Cancel(取消一个不存在的事务)，并在系统中留下记录；此后迟到的 Try 看到该记录必须失败——这就是防悬挂。三者合起来解决 Try 与 Cancel 消息乱序问题。", "points": "1. 分布式环境的出发点：各节点只有局部可串行化信息，需要协调者汇集后集中决策。\n2. 2PC 至少需要两次网络往返，这是无法压缩的时间成本。\n3. 2PC 第一阶段不提交事务，两阶段之间所有相关数据都要持锁，锁持有时间可能很长。\n4. 出现任何一台机器准备失败或长时间无响应，全局事务统一回滚。\n5. TCC 每个阶段都是完整的本地数据库事务，锁持有时间短，代价是业务系统必须感知分布式事务并实现三个方法。\n6. TCC 微观不原子：转账例中第一阶段结束时 x、y 均为 0，系统瞬间\"少了 100 元\"，靠第二阶段补回；协调者全局库记录的中间状态保证了最终正确。\n7. 宏观看，TCC 就是金融顶层架构：先通知所有系统做事(第一阶段)，再通过第二阶段对结果调整，对账系统正是第二阶段协调者的代表。\n8. Try 与 Cancel 可能乱序(节点先收到取消后收到尝试)，业务必须做空回滚、空回滚留痕、防悬挂三重加强。\n9. 2PC 也有同样的乱序问题，但被封装在数据库底层解决，不暴露给业务。\n10. 协调者收集信息与执行事务是先后两个过程，中间状态不一致靠最终一致性收敛。\n11. 协调者的全局事务数据库一旦损坏，整个分布式事务无法继续——这是本讲遗留的单点问题，由后续共识算法解决。", "arch": "2PC 全局提交流程(协调者写全局事务状态→准备提交→记录成功→统一下发):\n```mermaid\nsequenceDiagram\n    participant C as 协调者\n    participant A as 数据库A\n    participant B as 数据库B\n    C->>C: 记录全局状态:准备提交\n    C->>A: 第一阶段:准备提交(x变0)\n    C->>B: 第一阶段:准备提交(y变100)\n    A-->>C: 准备成功\n    B-->>C: 准备成功\n    C->>C: 记录第一阶段完成\n    C->>A: 第二阶段:提交事务\n    C->>B: 第二阶段:提交事务\n    A-->>C: 提交成功\n    B-->>C: 提交成功\n    C->>C: 记录分布式事务结束\n```\n\nTCC 流程(第一阶段各节点本地提交后上报,第二阶段确认或取消):\n```mermaid\nsequenceDiagram\n    participant C as 协调者\n    participant A as 数据库A\n    participant B as 数据库B\n    C->>C: 记录全局状态:准备提交\n    C->>A: Try:尝试提交(x变0)\n    C->>B: Try:尝试提交(y不变)\n    A-->>C: 本地提交,事务提交成功\n    B-->>C: 本地提交,事务提交成功\n    C->>C: 记录第一阶段完成\n    alt 全部提交成功\n        C->>A: Confirm:确认\n        C->>B: Confirm:确认\n    else 任一失败\n        C->>A: Cancel:取消(反向业务对冲)\n        C->>B: Cancel:取消\n    end\n```", "compare": "| 方案 | 前提/层次 | 第一阶段 | 保证 | 代价 |\n| --- | --- | --- | --- | --- |\n| 2PC | 数据库底层实现 | 预处理但不提交,停在准备成功态 | 全局原子提交/回滚,业务无感 | 两次网络往返;两阶段间长持锁;需改造数据库 |\n| TCC | 业务上层实现 | 执行并真正提交本地事务 | 加锁时间短,各阶段独立提交 | 业务写正反两套;中间态暴露;需空回滚/防悬挂 |\n| 单机事务 | 单库 | — | 强隔离(可串行化/快照隔离) | 仅覆盖本机,跨库失效 |\n\nTCC 与 2PC 的关键差异：2PC 只有第二阶段结束后本地事务才真正结束，TCC 每阶段都是完整提交的本地事务。", "pitfalls": "- \"已提交事务不能回滚\"的悖论：2PC 第二阶段回滚并不违规，因为第一阶段事务从未提交，只是到达\"准备成功\"状态。\n- TCC 的 Cancel 不是事务回滚，而是用一个反向业务对冲正向业务；照搬回滚思维会导致实现错误。\n- 教科书说\"转账必须是原子操作\"是宏观结论；微观上 TCC 有多个原子步骤和可见的中间不一致状态，最终正确即可。\n- 异常处理最复杂的情况是节点压根没收到第一阶段消息，稍后又收到第二阶段消息——这是乱序而非故障。\n- 协调者全局库丢失数据不必然灾难：多数情况下可根据各节点状态反推全局事务进展(思考题线索)。", "quiz": "- 2PC 两个阶段各自做什么？什么条件下进入回滚？（阶段一准备提交并反馈；阶段二统一下发提交或回滚；任一准备失败或长时间无响应即回滚）\n- 为什么 2PC 需要数据库新增\"准备成功\"状态？（第一阶段不提交也不能直接丢弃，需要一个未完成的中间事务状态，第二阶段凭此提交或回滚）\n- TCC 相对 2PC 的优缺点是什么？（每阶段完整本地事务、锁时间短；代价是业务双份实现、中间态可见、需处理空回滚与防悬挂）\n- TCC 的取消为什么不能叫回滚？（Try 阶段事务已真正提交，数据库层面不可回滚，只能用反向业务做补偿）\n- 协调者的单点问题指什么？（协调者全局事务数据库保存全部分布式事务状态，它一出问题全局事务就无法决策）"}, {"id": "14-14-正确性分级-下-多机有容灾有哪几种不同的一致性", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 14, "title": "14丨正确性分级（下）：多机有容灾有哪几种不同的一致性？", "isQA": false, "summary": "数据一旦复制到多处(容灾)，前两讲的集中控制模型失效。本讲批判性梳理 CAP，建立有容灾下的一致性分级：最终一致性、四种并列的会话一致性、最重要的线性一致性，以及把线性一致性与可串行化合体而成的最强级别——严格可串行化；并给出按业务选级的决策思路。", "mindmap": "- 容灾下一致性\n  - CAP 辨析\n    - 脑裂时二选一 CP/AP\n    - 一致性指线性一致性\n    - 定义笼统不建议常用\n  - 最终一致性\n    - 可见性:修改被副本反映\n    - 最终=极限时间收敛\n    - 缺工程定义指导有限\n  - 会话一致性四种\n    - 单调写一致\n      - 各节点写序与用户一致\n    - 单调读一致\n      - 新读不得读到旧值\n    - 自读自写\n      - 读回全部历史写入\n    - 先读后写\n      - 跨会话写因果定序\n    - 四者并列无强弱\n  - 线性一致性\n    - 分布式版可串行化\n    - 重排操作至无重叠\n    - 不重叠者先后不可反\n    - 再做业务正确性验证\n  - 严格可串行化\n    - 线性一致性+可串行化\n    - 唯一真实时间串行序\n    - 效率极低很少用\n  - 选级思路\n    - 单机选快照隔离\n    - 单会话三类保证\n    - 多会话先读后写\n    - 高要求线性一致性\n    - 分库分表加分布式事务", "concepts": "- **分区容错性（Partition Tolerance）**：网络故障把连通的机器割裂成独立部分，即脑裂。CAP 的真实含义是在脑裂发生后只能在一致性与可用性中二选一(CP 或 AP)，而不是流传甚广的\"三选二\"。\n- **可见性（Visible）**：机器 A 上的修改经过一段时间反映到机器 B 上，即该修改在 B 可见；之后就能在 B 上使用该结果。\n- **最终一致性（Eventual Consistency）**：修改在所有机器上最终都可见。\"最终\"借数学极限概念——时间趋于无穷时未复制到数据的机器数降为零；但对\"多久算最终\"没有工程可用的定义，指导意义有限。\n- **会话（Session）**：用户的唯一标识符，是客户端概念而非服务端概念。容灾下同一用户的请求会落到不同机器，需要保证体验与单机一致，因此引出四种会话一致性。\n- **单调写一致（Monotonic Write）**：所有节点记录的写入顺序与用户写入顺序完全一致。\n- **单调读一致（Monotonic Read）**：不是要求读顺序一致，而是与写有关——同一用户后一次读不能读到比前一次读更旧的值。\n- **自读自写（Read Your Write）**：能读回自己过去写入的全部值，要求读节点保存该会话的全部写入记录；但\"写都完成了\"不等于\"写顺序正确\"，需配合单调写。\n- **先读后写（Write Follow Reads）**：唯一跨会话的一致性。若读到别人的写，则自己的写必须定序在那个写之后，保证因果先后。\n- **线性一致性（Linearizability）**：分布式系统最重要的一致性，可视为分布式版的可串行化。要求能把所有操作按时间重排成互不重叠的顺序执行；未重叠的操作先后顺序不可颠倒；重排后还需按业务逻辑验证结果正确，全部排列都错才算违反。\n- **严格可串行化（Strict Serializability）**：可线性化 + 可串行化。要求事务等价于唯一一个串行顺序——原事务结束越早，在串行序中越靠前，消除了可串行化\"某个顺序\"的随机性；代价是效率极低，很少使用。", "points": "1. 容灾=数据多副本，此时单机与多机无容灾的结论都不适用，需要新理论。\n2. CAP 不是三选二：分区容错是背景条件，真正可选的只有 C 和 A 之一。\n3. CAP 对\"一致性\"没有明确定义(实指线性一致性)，把丰富的中间选择压成单选，学术界已不建议在架构讨论中使用。\n4. 异步消息架构天然宣称最终一致性，但\"最终\"无工程定义，描述力同样有限。\n5. 四种会话一致性彼此并列，没有高低强弱之分，按需组合。\n6. 单调写是\"各节点写序正确\"；单调读是\"读不到更旧的值\"；自读自写是\"读回全部历史写\"；先读后写是\"跨会话写因果\"。\n7. 自读自写只保证写入完成，不保证写入顺序，与单调写互补。\n8. 线性一致性分析三步：重排重叠操作→保持非重叠操作先后→按业务逻辑验证串行结果。\n9. 严格可串行化规定串行顺序唯一且符合真实时间先后，是分布式下最强一致性。\n10. 简化容灾模型：写主节点、主节点复制到备份，读可落在主或任意备份，一致性差异由此产生。\n11. 选级路线：单机→快照隔离；只保单会话→单调读/写+自读自写；跨会话→先读后写；高正确性→线性一致性；分库分表→每个容灾集群先线性一致、再用 TCC/2PL 做分布式事务。", "arch": "```mermaid\ngraph LR\n    U[\"用户\"] --> M[\"主节点写入\"]\n    M --> B1[\"容灾节点1复制\"]\n    M --> B2[\"容灾节点2复制\"]\n    U -->|\"读可任选\"| M\n    U -->|\"读可任选\"| B1\n    U -->|\"读可任选\"| B2\n    B1 -. \"复制慢则读到旧值<br/>违反单调读/自读自写\" .-> U\n```", "compare": "| 级别名 | 前提/场景 | 保证 | 代价 |\n| --- | --- | --- | --- |\n| 最终一致性 | 异步复制架构 | 极限时间所有副本可见 | 窗口期读到旧值，无工程时限 |\n| 单调写一致 | 同一会话多次写 | 全节点写序与用户一致 | 复制必须保序 |\n| 单调读一致 | 同一会话跨副本读 | 后读不旧于前读 | 读副本选择受限 |\n| 自读自写 | 同一会话读自己的写 | 读回全部历史写入 | 节点需保存会话全部写入 |\n| 先读后写 | 跨会话交互 | 写序遵循读到的因果 | 跨会话追踪成本 |\n| 线性一致性 | 有容灾集群的高要求 | 全部操作可排全局序 | 实现需共识算法，复杂 |\n| 严格可串行化 | 分布式事务最强要求 | 唯一真实时间串行序 | 效率极低，很少用 |", "pitfalls": "- CAP\"三选二\"是流传最广的误读；正确表述是脑裂前提下的 CP/AP 二选一。\n- CAP 的一致性就是线性一致性，但它没说出口，造成大量歧义。\n- 单调读不约束\"读的顺序\"，它约束的是\"读相对写的新旧\"；名称极具误导性。\n- 自读自写与写入\"完成\"是两回事，顺序正确必须另靠单调写补足。\n- 三个\"强\"的层次：可串行化管事务(顺序可任选)、线性一致性管操作(全局可排序)、严格可串行化管事务且顺序唯一，不要混用。\n- 同一讲中的四个会话一致性是并列关系，不存在谁包含谁。\n- 前两讲的结论(集中决策、单点控制)在多副本场景下整体失效，不要套用。", "quiz": "- CAP 为什么不是三选二？它的一致性实际指什么？（分区容错是故障前提，只能 CP/AP 二选一；一致性实指线性一致性）\n- 线性一致性的定义包含哪几步？（重排操作消除时间重叠、非重叠操作先后不可反、按业务逻辑验证串行结果是否合理）\n- 自读自写为什么还需要单调写配合？（自读自写只保证所有写入都已完成，不保证各节点写入顺序一致）\n- 先读后写与其他三种会话一致性的本质区别？（它是唯一跨会话的一致性，约束两个用户间的写因果顺序）\n- 分布式严格可串行化由什么组成？为什么不常用？（可线性化+可串行化，串行顺序唯一且随真实时间；效率极低）"}, {"id": "15-15-分布式正确性的存在性-上-什么情况下不存在分布式共识算法", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 15, "title": "15丨分布式正确性的存在性（上）：什么情况下不存在分布式共识算法？", "isQA": false, "summary": "本讲讲解金融级架构师必须知道的 FLP 结论(1985 年 Fisher/Lynch/Patterson)：在完全异步、且至少一台机器可能出故障的分布式系统里，不存在非随机的共识算法。破局方法只有一个——让\"完全异步\"失效，即引入时钟做失败检测，这正是 Paxos/Raft 都带超时机制的理论根源。", "mindmap": "- FLP 不可能性结论\n  - 结论表述\n    - 完全异步+一台可能故障\n    - 不存在非随机共识\n    - 破除任一前提即可\n    - 加时钟检测消息丢失\n  - 系统定义\n    - 机器\n      - 至少三台二元状态\n      - 改状态/发消息/输出一次\n      - 逻辑正确非拜占庭\n      - 算法非随机\n    - 共识三条件\n      - 终止性\n      - 一致性\n      - 有效性\n    - 消息假设\n      - 发送异步无时限\n      - 队列完美不丢不重\n      - 接收顺序随机\n  - 三步反证\n    - 一:存在非确定初始状态\n      - 逐台变值构造相邻态\n      - 相邻态结果依赖单机存亡\n    - 二:非确定状态可延续\n      - 关键消息可任意延迟\n      - 接收方异同皆有矛盾\n    - 三:无限构造循环\n      - 永不收敛违反终止性\n  - 破局:失败检测\n    - 完整性强/弱\n    - 准确性强/弱\n    - 弱检测即可支撑共识\n    - 时钟是充要条件", "concepts": "- **FLP 结论**：《Impossibility of Distributed Consensus with One Faulty Process》确立的不可能性定理(2001 年获 Dijkstra 最具影响力论文奖)。完全异步系统中只要有机器可能故障，就不存在非随机的共识算法。\n- **终止性（Termination）**：每个仍正常运行的机器最终都要确定唯一结果，一个不落；结果一旦做出不可更改；对故障机器无任何要求。\n- **一致性（Agreement）**：所有还活着的机器输出的结果完全相同(全 0 或全 1)。\n- **有效性（Validity）**：每个可能的值都可能成为共识结果。它排除了\"永远输出 0\"这类平凡算法——那虽满足终止与一致，却毫无意义。\n- **确定性/非确定性状态**：若能从某状态预先算出共识结果，该状态是确定性的；若结果取决于某台机器是否在线，则是非确定性的。\n- **路径**：系统状态变化的顺序，相邻两次状态变化之间恰好是新接收的一条消息。\n- **失败检测器**：能判断某台机器是否出问题的机制(由时钟实现)，具有完整性与准确性两个属性，各分强弱共四种；后两篇 1996 年论文证明：即使很弱的失败检测也足以实现共识，而\"能最终做准确判断的不准确时钟\"是共识存在的充要条件。", "points": "1. 结论的两个前提\"完全异步\"与\"至少一台机器可能故障\"缺一不可，推翻任何一个即存在共识算法。\n2. 机器无法保证永不故障，所以唯一突破口是消除完全异步：给机器加时钟判断消息是否丢失。\n3. Paxos、Raft 内置消息超时判断，正是绕开 FLP 的现实手段——理论不存在，现实可行。\n4. 机器模型假设：至少 3 台、二元初始状态、只做改状态/发消息/输出一次三件事、逻辑正确(非拜占庭)、算法非随机。\n5. 消息模型假设：发送与接收均异步且无时间保证，但队列本身完美——不丢消息、每条只被处理一次、接收顺序随机；队列空时返回空消息。\n6. 证明第一步：把结果为 0 与 1 的两个初始状态逐台机器地改值逼近，必然出现相邻两个状态只差一台机器而结果相反；若这台机器从头死机，两状态实际相同却须给出相反结果——矛盾，故必存在非确定性初始状态。\n7. 第二步：利用异步消息\"接收时间可任意延迟\"，把关键消息 e 往后挪；无论消息 e 与 f 的接收方相同还是不同，假设\"中间状态全确定\"都会推出矛盾，所以非确定性可以在中间状态延续。\n8. 第三步：从非确定初始状态出发，每到一个非确定状态就把消息 e 挪后制造下一个非确定状态，循环无穷，违反终止性——于是任何共识算法都不存在。\n9. 反证法从\"所有初始状态都可预判结果\"出发，逐层推出矛盾，是本讲最精妙的部分。\n10. 例子的关键差异：C 一直运行但不输出(违反终止性，无共识) vs C 死机(对故障机器无要求，反而达成共识)。", "arch": "```mermaid\ngraph TD\n    A[\"非确定性初始状态\"] --> B[\"接收关键消息 e\"]\n    B --> C[\"仍存在非确定性中间状态<br/>(第二步证明)\"]\n    C --> D[\"把消息 e 任意延后<br/>制造下一个非确定状态\"]\n    D --> C\n    C --> E[\"无限循环<br/>违反终止性\"]\n    A -. \"加时钟/失败检测\" .-> F[\"打破完全异步<br/>共识算法可行\"]\n```", "compare": "| 情形 | 系统条件 | 是否存在共识 | 说明 |\n| --- | --- | --- | --- |\n| 完全异步+有故障 | 无时钟、机器可能宕机 | 不存在(非随机算法) | FLP 结论本体 |\n| 非完全异步 | 有时钟/失败检测 | 存在 | Paxos/Raft 靠超时实现 |\n| 强检测 vs 弱检测 | 完整性×准确性四档 | 弱检测即可实现共识 | 时钟为充要条件 |\n\n失败检测器两属性：完整性(所有/一些正确节点最终怀疑每个出错节点)、准确性(所有/一些正确节点不会被误怀疑)。", "pitfalls": "- \"不存在共识算法\"不是绝对论断：它有精确前提，现实系统加超时即可绕开，不要把它当成\"分布式注定不可能\"。\n- 本讲假设非拜占庭(机器不撒谎、不攻击算法)，与区块链/比特币解决的拜占庭问题不同，不要混谈。\n- 共识算法的\"非随机\"限定是为了结果可复现，随机算法不在证明范围内。\n- 消息队列\"完美\"是刻意的理想化假设：不丢、只处理一次、接收随机序——现实中不存在，但证明聚焦分布式本身而非消息系统。\n- 终止性只约束还活着的机器；一台机器\"活着却不输出\"与\"死了\"在共识判定上天差地别。\n- 队列为空时返回的空消息同样可以触发机器改变状态，容易被忽略。", "quiz": "- FLP 结论的精确表述是什么？两个前提是什么？（完全异步且至少一台机器可能故障时，不存在非随机共识算法）\n- 共识三条件分别约束什么？有效性为什么必要？（终止性:活着的机器最终唯一输出；一致性:输出全相同；有效性:排除恒定输出的平凡算法）\n- 三步证明分别证明什么？（存在非确定初始状态；非确定状态可延续到中间状态；无限延续违反终止性）\n- 为什么异步消息的\"可任意延迟\"是证明的核心？（允许把关键消息挪后，不断制造新的非确定状态，使系统永不收敛）\n- 现实中的共识算法如何绕开 FLP？（引入时钟做失败检测/超时判断，消除完全异步前提）"}, {"id": "16-16-分布式一致性-下-怎么理解最简单的分布式一致性算法", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 16, "title": "16丨分布式一致性（下）：怎么理解最简单的分布式一致性算法？", "isQA": false, "summary": "Raft(2014)是通俗易懂的共识算法，通俗结论是：只要多数机器在线，集群内文件就完全一致。它一面解决文件同步，一面天然实现全序广播与线性化存储——三者理论等价；用好 Raft 的关键是客户端只访问主节点、把\"不确定\"当失败重试并依赖服务端去重，其内部骨架是节点三状态与单调递增的任期。", "mindmap": "- Raft 共识算法\n  - 能解决什么\n    - 文件同步\n      - 多数在线即文件一致\n      - 已确认段安全可用\n      - 同步中内容不可用\n      - 宜存重要小数据\n    - 全序广播\n      - 消息一个不丢\n      - 各机顺序完全一致\n      - 数据库日志容灾\n      - 会计账本备份\n    - 线性化存储\n      - 可线性化的实现\n      - 分布式锁\n      - 锁服务支撑分布式事务\n  - 三者等价\n    - 共识即全序广播\n    - 全序广播即线性化存储\n    - 锁换序互推\n    - 借分布式状态机\n  - 使用要点\n    - 客户端\n      - 只访问主节点\n      - 失联轮询找主\n      - 三态:成功/失败/不确定\n      - 不确定按失败重发\n      - 服务端必须去重\n    - 服务端\n      - 多数在线即可工作\n      - 容灾力度可配置\n  - 核心概念\n    - 节点三状态\n      - 主节点\n      - 从节点\n      - 候选节点\n    - 任期\n      - 单调递增正整数\n      - 心跳压制从节点\n      - 失主触发选主\n      - 过半同意当选", "concepts": "- **共识（Consensus）**：多台机器就结论达成统一。通俗版：能在多台机器间同步一个内容不断增加的文件；保证是——只要多数机器正常工作，这些机器上的文件完全一样。\n- **全序广播（Total Order Broadcast）**：两个条件——消息一个不丢(某机出现的消息其他机器都有)，且所有机器记录的消息顺序完全一致。等于不仅要同步文件，还要同步文件内容的顺序。\n- **线性化存储（Linearizable Storage）**：第 14 讲\"可线性化\"理论的工程实现——一个分布式存储集群，用户在其上的操作序列可重排为无重叠的顺序执行且结果合理。标志性应用是分布式锁：在一台机器上拿到锁，等于在所有机器上都拿到了锁。\n- **分布式状态机**：事件溯源(第 7 讲)的分布式版本。命令经全序广播到达各机，各机自动机判定命令合理性后生成事件、更新状态，用于从全序广播构造线性化存储。\n- **主从节点（Leader and Follower）**：任一时刻集群最多一个主节点，是唯一处理请求的节点，负责把请求同步给从节点；主从角色会变化，但同一时刻最多一个主。\n- **候选节点（Candidate）**：未来的主节点。节点发现集群疑似无主时自荐为候选并发起选主；系统中可同时存在多个候选。\n- **任期（Term）**：不断递增的正整数，历任主节点任期严格递增。正常时主节点用心跳广播任期压制其他节点保持从属；主节点失联时各节点自荐候选，把最后任期数加一征求投票，获半数以上同意即当选为主。", "points": "1. 文件被分为两段：已确认同步的内容可放心使用；同步中的内容是临时内容，暂不可用。\n2. 共识适合同步\"重要但数据量不大\"的数据：云计算机器清单、配置信息、路由信息等。\n3. 全序广播的典型场景：数据库日志容灾、会计账本备份——顺序错误不可接受的场合；区块链本质是共识生成的分布式账本，但它假设节点恶意(拜占庭)，Raft 假设非恶意，资源消耗更低速度更快。\n4. 重要结论：共识 ≡ 全序广播 ≡ 线性化存储，三者两两等价、可互相构造。\n5. 线性化存储→全序广播：广播前先取分布式锁，消息送达所有机器后释放锁。\n6. 全序广播→线性化存储：把加锁命令经全序广播分发，各机状态机判定后生成\"获得锁\"事件并更新状态。\n7. 客户端第一守则：永远只访问主节点；主失联就轮询其余节点，好的实现会让从节点提示\"它心中的主节点\"，循提示可快速找到真主。\n8. Raft 反馈三态：成功=消息已通过全序广播保存到所有正常机器，可继续；失败=多半是对方不再是主节点，重新找主；无响应(不确定)=假设失败重发，因此服务端必须有去重能力。\n9. 服务端只需多数节点在线即可工作，Raft 天然带容灾能力，容灾力度按需选择。\n10. Raft 本地维护自增不减的日志文件，已同步部分安全、同步中部分临时，与文件同步的两段论一致。\n11. 金融启示：核心组件与周边数据系统都需要线性一致性——底层用线性化存储支撑分布式锁与分布式事务，上层用分布式状态机保证业务多机一致。\n12. 思考题呼应：协调者单点问题本质就是\"单点存储需要共识\"；解法是用 Raft 这类共识算法为协调者的全局事务数据库做容灾。", "arch": "客户端使用 Raft 的请求流程(只访问主节点,主节点经全序广播同步,多数确认后回复成功):\n```mermaid\nsequenceDiagram\n    participant K as 客户端\n    participant L as 主节点\n    participant F1 as 从节点1\n    participant F2 as 从节点2\n    K->>L: 请求写入\n    L->>F1: 复制日志(全序广播)\n    L->>F2: 复制日志(全序广播)\n    F1-->>L: 确认\n    F2-->>L: 确认\n    L->>L: 多数确认,提交日志\n    L-->>K: 回复成功(可放心继续)\n    Note over F1,F2: 主节点失联时<br/>从节点自荐候选<br/>任期+1征求投票,过半当选\n```\n\n节点三状态状态机(超时触发选举,发现新主回归从属):\n```mermaid\ngraph LR\n    S[\"开始\"] --> F[\"从节点\"]\n    F -->|超时,选举| C[\"候选节点\"]\n    C -->|选主成功| L[\"主节点\"]\n    C -->|发现新主| F\n    L -->|发现新主| F\n```", "compare": "| 能力 | 保证 | 典型用途 |\n| --- | --- | --- |\n| 文件同步 | 多数在线时各机文件一致 | 配置、路由等重要小数据 |\n| 全序广播 | 消息不丢且全机顺序一致 | 数据库日志容灾、会计账本、区块链 |\n| 线性化存储 | 操作可排全序、结果合理 | 分布式锁、容灾锁服务、分布式事务 |\n| 拜占庭共识(区块链) | 容忍恶意节点 | 加密货币；资源消耗大 |\n| Raft(非拜占庭) | 假设节点不撒谎 | 更少资源达成共识，更快 |", "pitfalls": "- \"成功\"的精确含义：不是本机收到，而是已通过全序广播保存到所有正常机器——只有此时才能继续下一条。\n- \"不确定\"必须按失败处理并重发，重复请求不可避免，服务端去重(幂等)不是可选项而是必需品。\n- 主节点角色随时可能变化，客户端不能缓存\"谁是主\"太久，要有找主与跟随提示的机制。\n- Raft 的可用前提是多数节点在线，不是全部在线；理解容灾力度按\"多数存活\"计算。\n- 候选节点可以同时存在多个，\"候选\"不等于\"将当选\"；真正的唯一性约束是同一时刻至多一个主。\n- 心跳(压制)与选主是同一枚硬币的两面：压制消失才触发选主，任期递增保证旧主无法复辟。\n- 勿把 Raft 与区块链共识混为一谈：后者解决拜占庭问题，假设前提不同。", "quiz": "- 共识算法通俗地解决什么问题？给出的确切结论是什么？（跨机同步不断增加的文件；只要多数机器正常工作，机器上的文件完全一致）\n- 全序广播有哪两个条件？适合什么场景？（消息不丢、全机顺序一致；数据库日志容灾、会计账本备份）\n- 为什么共识、全序广播、线性化存储可视为同一件事？各自怎么互推？（三者等价；线性化存储借分布式锁广播消息、全序广播借分布式状态机判定加锁命令）\n- 客户端使用 Raft 的三条纪律是什么？（只访问主节点；失联轮询找主并跟随提示；不确定一律按失败重发且依赖服务端去重）\n- 任期机制如何同时实现压制与选主？（主用心跳广播递增任期压制从节点；失主后节点自荐候选、任期+1 征求投票，半数以上同意即当选）"}, {"id": "17-17-正确性案例-上-如何实现分布式的事件溯源架构", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 17, "title": "17丨正确性案例（上）：如何实现分布式的事件溯源架构？", "isQA": false, "summary": "把单机事件溯源架构扩展到多机：用共识算法复制**事件队列**构成复制状态机实现容灾，再依次解决对外通讯（反向代理）、数据查询（读模式与一致性读）、分库（路由升级与协调者容灾）问题。", "mindmap": "- 分布式事件溯源\n  - 多机容灾\n    - 线性一致性要求主节点\n    - 选主解决单点故障\n    - 全序广播保状态一致\n  - 复制状态机\n    - 复制事件队列非命令\n    - 命令转事件有随机性\n    - 仅主节点对外通讯\n    - 反向代理隐藏集群\n  - 数据查询\n    - 常规查询\n      - 读模式复制事件队列\n      - 任一已同步节点可为源\n      - 主节点新但压力大\n      - 从节点压力小有延时\n    - 一致性读\n      - 查询发往写节点\n      - 空命令事件走共识\n      - 达到线性一致性\n  - 分库\n    - 反向代理升级为路由\n    - 跨库事务需协调者\n    - 操作日志共识同步容灾", "concepts": "- **复制状态机**：用共识算法把同一份日志（这里是事件队列）按相同顺序复制到多台机器并各自执行，各节点状态完全一致；是有状态系统容灾的标准形态。\n- **全序广播**：所有节点以相同顺序看到相同消息序列；它是\"替换节点与主节点完全一致\"的机制基础，由一致性算法提供。\n- **反向代理**：集群对用户的统一代表，负责维持 TCP 长连接、转发请求与回传结果；用它向用户隐藏\"事件溯源是一组机器、且主节点可能中途更换\"的细节。\n- **读模式状态机**：只复制事件队列从而复制出状态、专门服务查询的节点；分布式下可从任一已同步节点获取事件。\n- **一致性读（Consistent Read）**：把查询当作空的命令和事件发给写节点、走共识排序，用线性一致性覆盖读模式满足不了的单调读一致与自读自写。\n- **分库路由**：分库后各节点只能处理部分业务，反向代理必须升级为维护全局路由信息的路由节点。", "points": "1. 线性一致性容灾隐含三个要求：集群由主节点提供服务、主节点故障后要选主、新主与旧主完全一致（全序广播）——所以有状态系统容灾必然选共识算法。\n2. 要复制的是**事件队列**而非命令队列：命令变事件的过程有随机性，换主后同样的命令可能生成不同事件；只有命令到事件完全无随机性时才能复制命令队列。\n3. 只有主节点能对外通讯（返回执行结果）；从节点只复制事件队列、更新内部状态。\n4. 常规查询从任一节点复制事件都正确（Raft 保证已同步数据正确）；从主节点取数据最新但加重压力，从从节点取压力小但延时大、甚至长期落后——按需取舍。\n5. 读模式查询满足不了会话的单调读一致与自读自写；一致性读与写流程完全一样，只是命令事件为空操作，靠共识的线性排序保证读写顺序正确。\n6. 分库后系统出现多个不同状态的节点，反向代理要变成路由，内部维护全局路由信息、按业务逻辑分发消息。\n7. 2PC/TCC 的协调者是单点；把数据库操作日志经共识算法同步到多机、由日志恢复状态，即可实现协调者容灾——这也是常见分布式数据库的实现方式。", "arch": "```mermaid\ngraph TD\n    U[用户] --> P[反向代理]\n    P -->|\"转发请求(一致性读=空命令事件走共识)\"| M[\"主节点(写模式状态机)\"]\n    M -->|\"一致性算法复制事件队列\"| F1[从节点]\n    M -->|\"一致性算法复制事件队列\"| F2[从节点]\n    M -->|\"返回处理情况\"| P\n    F1 -->|\"复制事件队列\"| R1[\"读模式节点(常规查询)\"]\n    F2 -->|\"复制事件队列\"| R2[\"读模式节点(常规查询)\"]\n```", "compare": "| 维度 | 常规查询（读模式） | 一致性读 |\n| --- | --- | --- |\n| 实现 | 从节点复制事件队列重建状态 | 查询作为空命令/事件走写节点共识 |\n| 一致性级别 | 弱一致，不满足单调读/自读自写 | 线性一致性 |\n| 负载 | 可分摊到从节点 | 全部落到主节点 |\n| 适用 | 一般查询、数据分析 | 会话内读写顺序敏感的操作 |", "pitfalls": "- 误区：复制命令队列就能容灾。错在忽略命令→事件的随机性，换主后状态会分叉。\n- \"任何节点都能复制\"不等于数据随意：只有被标记为已同步的数据才保证正确，不同节点同步进度不同。\n- 一致性读不是新流程，本质和写完全一样，只是命令与事件什么都不做。\n- 换主后原主节点与用户的连接会断开，这个复杂度应交给反向代理，而不是让客户端自己处理。", "quiz": "- 为什么容灾要复制事件队列而不是命令队列？（命令转事件有随机性，同命令换主后可能生成不同事件；复制事件才能全序一致）\n- 常规查询从主节点还是从节点复制事件？各自代价？（主节点最新但压力大；从节点压力小但延时大）\n- 一致性读如何实现、达到什么级别？（查询作空命令/事件发写节点经共识排序，结果经反向代理返回；线性一致性）\n- 分库后反向代理要怎么变？（升级为路由，维护全局路由信息）\n- 分布式事务协调者的单点问题怎么解？（复制状态机：操作日志经共识算法同步到多机恢复状态）"}, {"id": "18-18-正确性案例-中-常见分布式数据方案的设计原理是什么", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 18, "title": "18丨正确性案例（中）：常见分布式数据方案的设计原理是什么？", "isQA": false, "summary": "所有业务系统本质上都是数据系统；本讲用 Redis、RocksDB、Spanner、TiDB 四个代表方案，讲清分布式数据系统在不同环节的速度、正确性、稳定性取舍原理。", "mindmap": "- 分布式数据方案\n  - Redis-内存K/V\n    - 单线程加epoll提速\n    - 异步主从备份\n    - 牺牲会话一致性换速度\n    - RDB快照与AOF日志\n  - RocksDB-文件K/V\n    - SSTable有序文件Map\n    - LSM树分层查询\n    - 追加写入速度极快\n    - 查询延时呈锯齿\n    - B+树延时平稳\n  - Spanner\n    - Paxos同步日志文件\n    - 表本质是K/V结构\n    - 主节点做分布式锁\n    - 2PC协调者非单点\n    - TrueTime原子钟\n  - TiDB\n    - TiKV行存Raft事务\n    - TiFlash列存读模式\n    - 读写分离各自优化\n  - 架构取舍\n    - 稳定性正确性速度不可兼得\n    - 读写存储空间不可兼得", "concepts": "- **SSTable**：存储在文件里的 Map，键为字符串且按升序排列；是最小的文件型存储单元。\n- **LSM 树**：多个 SSTable 自上而下分层组成，查询从最上层往下逐层找；更新不改旧文件、只在最上面新建一个 SSTable，把\"修改\"变成\"新增\"，因此写极快、读偏慢。\n- **RDB / AOF**：Redis 的两种本地备份——RDB 定期把内部状态快照到硬盘（快但两次快照间的数据无法恢复），AOF 实时追加操作日志（完整但持续写盘）。\n- **日志即状态**：数据库操作日志可恢复状态，经共识算法（Paxos/Raft）全序广播同步到多机、各自回放，就得到分布式状态机；这是 Spanner 与 TiDB 的共同根基。\n- **TiKV / TiFlash**：TiDB 把行存储（事务、LSM+Raft）与列存储（分析、B+树、读模式）拆成两个独立组件，分别优化写与分析。", "points": "1. Redis 快在三招：单线程+epoll 避免多线程加锁冲突、异步主从备份减少返回延迟、RDB 定期快照牺牲完整性换速度。\n2. Redis 异步主从+只读从节点满足不了单调读一致与自读自写；读操作走主节点可得线性一致，但前提是主节点不出故障——异步备份下主挂了会丢数据，集群整体并非线性一致。\n3. LSM 树的真正价值：数据超过内存后仍能提供 K/V 查询能力且写入吞吐高；代价是查询要逐层找，延时呈锯齿（bloomfilter 只能缓解不能根治）。\n4. 选型口诀：要求延时可控选 B+ 树，要求写入速度选 LSM 树。\n5. 关系型表无论按列垂直划分（列名为键）还是按行水平划分（主键为键），最终存储都是 K/V 结构。\n6. Spanner 的分布式锁与 2PC 协调者都由 Paxos 主节点承担，协调者天然有容灾能力、不再是单点。\n7. TiDB 用 Raft 替代 Paxos（工程上更清晰易实现）；数据分析不需要一致性读，所以 TiFlash 只需常规查询，选择只从 TiKV 主节点复制日志以节省延时。\n8. 总取舍：稳定性提高伴随速度下降，速度提高伴随正确性下降；读写都快需要多份存储。分布式环境下没有\"正确\"的架构，只有满足业务需求的合适架构。", "arch": "```mermaid\ngraph TD\n    subgraph S1[\"内存型K-V：Redis\"]\n        RA[主节点-单线程epoll] -- \"异步复制\" --> RB[从节点-只读]\n    end\n    subgraph S2[\"文件型K-V：RocksDB\"]\n        RD[更新-追加新SSTable] --> RE[LSM树-分层查询]\n    end\n    subgraph S3[\"分布式数据库：TiDB\"]\n        RF[TiDB-事务与路由] --> RG[TiKV-Raft行存储]\n        RF --> RH[TiFlash-列存储]\n        RG -- \"主节点复制日志\" --> RH\n    end\n```", "compare": "| 维度 | B+ 树 | LSM 树 |\n| --- | --- | --- |\n| 更新方式 | 原地修改文件 | 追加新建 SSTable |\n| 写入速度 | 一般 | 极快 |\n| 查询速度 | 好 | 慢、需逐层查找 |\n| 延时形态 | 平稳 | 锯齿（偶发尖峰） |\n| 适合场景 | 延时可控优先 | 写入吞吐优先 |\n\n| 维度 | RDB | AOF |\n| --- | --- | --- |\n| 方式 | 定期快照整个状态 | 实时追加操作日志 |\n| 速度 | 快（偶发写盘） | 慢（持续写盘） |\n| 完整性 | 两次快照间数据丢失 | 高 |", "pitfalls": "- \"Redis 是线性一致的\"有前提：主节点不故障；异步备份机制下主节点损坏可能丢数据，集群整体达不到线性一致。\n- 不要神化 LSM 写速度：它的赢面不是绝对速度（Redis 甚至可以不落盘），而是超内存数据量下的高写吞吐。\n- Spanner 的价值在于第一个把成熟方案整合并证明可行，后来的方案普遍借鉴它，不是反过来。\n- TiFlash 只从主节点复制是省延时的优化选择，不是共识要求；常规查询从任何已同步节点取都正确。", "quiz": "- Redis 靠什么做到低延迟？分别牺牲了什么？（单线程+epoll、异步主从、RDB；牺牲单调读/自读自写与数据完整性）\n- LSM 树为什么写快读慢？（更新变文件末尾追加；查询需自上而下逐层找，层多了出现锯齿延时）\n- Spanner 如何让 2PC 协调者不成为单点？（协调者即 Paxos 主节点，本身具备共识容灾）\n- TiDB 为什么要 TiFlash、它怎么同步数据？（列存优化分析场景；以读模式从 TiKV 主节点复制日志）"}, {"id": "19-19-正确性案例-下-如何在运行时进行数据系统的动态分库", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 19, "title": "19丨正确性案例（下）：如何在运行时进行数据系统的动态分库？", "isQA": false, "summary": "基于事件溯源架构实现不停机的动态分库：用快照解决存量数据复制、命令队列解决增量数据完整性、状态机计算能力保证实时状态一致，靠协调者与一条\"分库命令\"完成与业务无关、可自动化的拆分。", "mindmap": "- 动态分库\n  - 架构目标\n    - 停机时间最小化\n    - 与业务尽量无关\n    - 过程尽量自动化\n  - 架构假设\n    - 事件溯源命令队列\n    - 状态机完全可重现\n    - 快照支持定点恢复\n  - 分库前\n    - 新增集群B与协调者\n    - 复制快照恢复状态\n    - 读模式追赶命令队列\n    - 差距几秒即算同步\n  - 分库中\n    - 协调者发分库命令\n    - A改配置拒收B业务\n    - B复制命令后启用\n    - A全程在线不停机\n  - 分库后\n    - 上游靠错误重定向\n    - 中间增加路由层\n    - 下游协调者推送\n    - 或解析分库命令", "concepts": "- **协调者**：分库过程的自动化组件，记录当前分库阶段、向各节点发送指令，本地数据库维护全部分库描述信息。\n- **分库命令**：写入命令队列的特殊命令，记录分库后 A/B 各自负责哪些业务；不涉及存储格式与增改逻辑，几乎与业务无关。\n- **读模式追赶**：新集群 B 先复制老集群 A 的快照恢复到某时间点，再以 A 的读模式身份持续同步命令队列，把差距缩到几秒。\n- **错误重定向**：集群收到不属于自己业务的消息时返回错误并给出正确去处提示，上游据此动态更新路由。", "points": "1. 朴素方案（停业务→备份→切分→测试→重启）停机太久；用异步备份机可先补齐存量、停机后只补增量，但人工干预多、与业务数据保存方式强绑定、通用性低。\n2. 核心思路一句话：快照管存量复制，命令队列管增量完整，状态机管实时一致。\n3. 分库前要新增三组节点：老集群 A、新集群 B（都是共识集群）、协调者；B 恢复快照后即知道对应哪个时间点的事件位置。\n4. 同步标准是\"足够新\"而非\"完全一致\"——A 一直在处理新业务，B 必有延时；一般数据差几秒即算同步好（可用日志时间戳或共识心跳时间戳判断）。\n5. 只有 B 自己能判断是否同步完成，协调者可用推或拉的方式获取该状态。\n6. 分库中：A 把分库命令写入命令队列并经共识复制到容灾节点；A 执行后改变内部配置、拒收属于 B 的业务并向用户报错；B 读到同一条命令同样执行并启用自己的业务；双方通知协调者。A 全程在线，无停机时间。\n7. 对业务的唯一影响：B 同步到分库命令之前的窗口里，属于 B 的消息无人处理；因事先把差距压到几秒，影响约等于一次网络重发时间。\n8. 分库后上游靠错误重定向发现新库；给每个上游都做动态路由成本高，通常在中间加一层路由，根据集群错误提示自动更新路由信息。\n9. 分库后下游需要\"找到所有集群\"：被动方案由协调者推送分库信息（只有协调者需理解分库）；主动方案由下游解析事件流中的分库命令自行发现。下游系统类型多时，主动方案每个都要实现解析、开发量大。\n10. 思考题要点：分库命令改的是内部配置，操作幂等，重复收到同一条命令不影响正确性。", "arch": "```mermaid\nsequenceDiagram\n    participant C as 协调者\n    participant A as 集群A(老)\n    participant B as 集群B(新)\n    C->>B: 发送同步数据指令\n    B->>A: 复制最新快照并恢复状态\n    B->>A: 以读模式持续同步命令队列\n    B->>C: 通知已足够同步\n    C->>A: 发送开始分库消息\n    A->>A: 命令队列插入分库命令-共识复制-执行改配置\n    A->>C: 通知分库完成\n    C->>C: 记录分库状态\n    B->>A: 从A命令队列复制分库命令\n    B->>B: 执行分库命令-改配置\n    B->>C: 通知分库完成\n```", "compare": "| 维度 | 上游系统 | 下游系统 |\n| --- | --- | --- |\n| 诉求 | 找到一个正确集群 | 找到所有集群 |\n| 分库感知方式 | 错误重定向 | 无法靠报错感知 |\n| 方案 | 自带动态路由或加路由层 | 协调者推送（被动）/解析分库命令（主动） |\n| 成本 | 每个上游都要路由能力 | 主动方案需逐个实现解析 |", "pitfalls": "- 不要追求\"完全同步\"：A 在持续处理业务，B 永远有延时，达标线是差距缩小到几秒。\n- 判断同步完成这件事只有 B 自己有资格，协调者只是推或拉地获取状态。\n- 分库命令只记录\"谁负责什么业务\"，不含数据格式、新增还是修改等处理细节。\n- 协调者并不直接指挥 B 的分库执行：B 是从命令队列里自然复制到分库命令的，这是流程能保持实时的关键。", "quiz": "- 动态分库的三个架构目标？（尽量少停机、尽量与业务无关、尽量自动化）\n- 存量与增量分别靠什么解决？（快照解决存量，命令队列解决增量，状态机保证一致性）\n- 分库命令执行后 A、B 各发生什么？（A 改配置拒收 B 的业务并报错；B 改配置启用自己的业务；都通知协调者）\n- 下游发现分库的两种方式及取舍？（协调者推送被动获知 vs 解析分库命令主动发现；下游类型多则主动方案开发成本大）"}, {"id": "20-20-容灾-上-如何实现正确的跨机房实时容灾", "module": "04-分布式正确性及高可用", "moduleNo": 4, "order": 20, "title": "20丨容灾（上）如何实现正确的跨机房实时容灾？", "isQA": false, "summary": "金融容灾的\"正确\"由 SLA 与事务原子性构成、且必须在成本间权衡；先解决发现问题（监控要抗伪报），再按 SOA 分层容灾：无状态靠调度与幂等，有状态与数据靠共识算法的两地三中心、三地五中心部署。", "mindmap": "- 跨机房容灾\n  - 正确的定义\n    - SLA限时恢复\n    - 事务原子性要求\n    - 服务正确性成本三角\n  - 发现问题\n    - 人工监控适用低SLA\n    - 监控平台互相监控\n    - 推拉取数权衡\n    - 警惕监控伪报\n  - 容灾过程\n    - SOA三层架构\n    - 无状态服务容灾\n      - 调度到健康机房\n      - 更新路由剔除故障\n      - 消息重发要幂等\n    - 有状态服务当数据节点\n  - 数据容灾\n    - 单节点容灾\n      - 缓存与fsync风险\n      - 企业级硬件电池\n      - 断电视作单点故障\n    - 多机房部署\n      - 两地三中心机房级\n      - 三地五中心城市级\n    - 客户端正确找新主", "concepts": "- **SLA（服务质量协议）**：规定一定时限内必须恢复服务；违约按合同金额赔偿，风险可控。\n- **事务正确性（原子性）**：金额操作要么全成要么全不成；出错（半截过户、重复打款）带来不可控的经济风险，比 SLA 违约更危险。\n- **监控伪报**：监控系统报某服务不可用，但服务实际正常运行（如防火墙配置错误导致状态和指令都发不通）；容灾处理必须在这种情形下仍然正确。\n- **幂等性**：同一请求重复执行结果不变，靠消息内唯一标识或天然幂等的 K/V 结构实现，用来解决容灾期间的消息重发。\n- **两地三中心**：3 个 Raft 节点分布在两个城市的 3 个数据中心（2+1），只能扛单数据中心故障。\n- **三地五中心**：5 个节点基本平分到 3 个城市的数据中心，任一城市故障仍有多数派在线，达到城市级容灾。", "points": "1. 正确容灾的两大要求：SLA（限时恢复）与事务 ACID 中的原子性；两者都要花钱，正确是相对的，要在服务质量、事务正确性、成本之间权衡。\n2. SLA 违约赔偿金额可控；事务正确性出问题是不可控风险（百亿债券过户中断、工资重复打款）。\n3. 业务量小、客户少、金额高且 SLA 低（几天到几个月）的金融业务，人工监控即可（如 Excel 里的资产证券化）。\n4. 监控系统自身要容灾，但监控数据时效性强、允许部分丢失，性价比方案是本地异步备份+各数据中心的监控平台互相监控，不必照搬业务系统的高成本容灾。\n5. 监控取数：推（心跳）实时但要求监控系统峰值能力高；拉（定期取）资源需求固定但延时更长——按业务 SLA 沟通选择。\n6. SOA 三层：用户应用层、无状态服务层、数据层。无状态服务容灾基本靠调度重试落到健康机房，优化是及时更新路由、剔除故障机房。\n7. 无状态层的真正风险是消息重发：服务可能处理成功但结果没送达（如防火墙问题），必须实现业务幂等。\n8. 外汇/股票交易所这类低延时金融场景是有状态服务，容灾时当作数据节点处理。\n9. 单节点容灾：数据先写 OS 缓存、再写硬件控制器缓存，fsync 也只到控制器缓存，断电仍可能丢数据；对策是企业级带电池硬盘，或像 Kafka 干脆不管、把断电当作单节点故障——\"到什么程度取决于你有多少钱\"。\n10. 3 备份若 2+1 跨两个机房，只保单节点级容灾：机房 1 整体故障只剩 1 节点，Raft 缺多数派无法工作。\n11. 服务端容灾做对即可保证数据正确，但客户端要在换主后用正确方式找到新主，才能压低容灾延时。", "arch": "```mermaid\ngraph TD\n    subgraph T1[\"两地三中心：3备份，仅机房级容灾\"]\n        X1[城市1] --> X2[\"数据中心1-节点B\"]\n        X1 --> X3[\"数据中心2-节点A\"]\n        X4[城市2] --> X5[\"数据中心3-节点C\"]\n        X6[\"数据中心可以出故障；城市1故障则仅剩1节点-缺多数派-不可用\"]\n        X6 -.- X1\n    end\n```\n\n```mermaid\ngraph TD\n    subgraph T2[\"三地五中心：5备份，城市级容灾\"]\n        Y1[城市1] --> Y2[\"数据中心1\"]\n        Y2 --> YB[节点B]\n        Y2 --> YD[节点D]\n        Y4[城市2] --> Y5[\"数据中心2\"]\n
